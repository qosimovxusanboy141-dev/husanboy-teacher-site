<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sahifa topilmadi (404) — Husanboy Teacher</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/png" href="./app-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet" />
  <script>
    try {
      var t = localStorage.getItem('ht_ui_theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <style>
    :root {
      --bg: #fafafa; --surface: #ffffff; --border: #e4e4e7;
      --ink: #09090b; --muted: #52525b; --brand: #1d4ed8;
    }
    html[data-theme="dark"] {
      --bg: #09090b; --surface: #111114; --border: #27272a;
      --ink: #fafafa; --muted: #a1a1aa; --brand: #60a5fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 480px;
      padding: 32px 28px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .code {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 6px;
      border: 1px solid var(--border);
      color: var(--brand);
      margin-bottom: 14px;
    }
    h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
    p { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 22px; }
    .actions { display: grid; gap: 8px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 40px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--ink);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
    }
    .btn:hover { border-color: var(--brand); }
    .btn.primary {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="code">404 · SAHIFA TOPILMADI</span>
    <h1>So‘ralgan manzil mavjud emas</h1>
    <p>Husanboy Teacher ochiq akademiyasining asosiy darsliklari va amaliy bo‘limlariga quyidagi havolalar orqali o‘tishingiz mumkin:</p>
    <div class="actions">
      <a class="btn primary" href="/husanboy-teacher-site/"><span>Bosh sahifaga qaytish</span><span>→</span></a>
      <a class="btn" href="/husanboy-teacher-site/library/ielts/ielts-8-plus.html"><span>IELTS 8+ To‘liq Dasturi</span><span>↗</span></a>
      <a class="btn" href="/husanboy-teacher-site/library/vocab/test-450.html"><span>450 Kunlik Test Tizimi</span><span>↗</span></a>
      <a class="btn" href="/husanboy-teacher-site/cabinet/index.html"><span>Shaxsiy Kabinet (Login / QR)</span><span>↗</span></a>
    </div>
  </main>
</body>
</html>
