:root{--bg:#EEF1F5;--page:#fff;--ink:#1B2433;--ink2:#5A6577;--ink3:#8A94A6;--line:#DCE2EA;--soft:#F5F7FA;--red:#D33F49;--redh:#FDECEE;--ok:#1E7F55;--okh:#E3F4EC;--mark:#FFE58A;--A:#1D4ED8;--Ah:#E6EDFD;
--serif:'Literata',Georgia,'Times New Roman',serif;--ui:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.6 var(--ui);min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--A);outline-offset:2px}
a{color:var(--A)}
.w{max-width:840px;margin:0 auto;padding:12px 16px 110px}
.card{background:var(--page);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}
.au .r{display:flex;gap:16px;align-items:center}.au img{width:104px;height:auto;max-height:150px;object-fit:contain;border-radius:12px;flex:0 0 auto;background:var(--soft)}
.au .nm{font:700 19px/1.3 var(--serif)}.lbl{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--ink);border-radius:99px;padding:2px 10px;margin-bottom:6px}
.ct{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.ct a{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:14px;background:var(--soft)}
.sub,.cp{font-size:13.5px;color:var(--ink2)}.cp{margin-top:10px}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:-.2px;margin:0}
.top{position:sticky;top:0;z-index:20;background:rgba(238,241,245,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:840px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.top .bk{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-weight:700}
.top .tt{flex:1;min-width:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{background:var(--ink);color:#fff;border:0;position:relative;overflow:hidden;padding:26px 22px}
.hero h1{font-size:34px;line-height:1.1;margin-bottom:10px}
.hero p{margin:0;color:#C9D2E0;max-width:560px}
.hero .pen{position:absolute;right:-30px;top:-20px;font:italic 400 190px/1 var(--serif);color:rgba(255,255,255,.06);pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.stats div{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px}.stats b{display:block;font:700 24px var(--serif)}.stats span{font-size:12.5px;color:#C9D2E0}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.nav button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 6px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.2;text-align:center}
.nav button i{font-style:normal;font-size:22px}
.nm2{display:flex;gap:10px;align-items:center}.nm2 input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--soft)}
.mod{background:var(--page);border:1px solid var(--line);border-radius:18px;margin:14px 0;overflow:hidden}
.mod .mh{display:flex;gap:14px;align-items:center;padding:16px 18px;border-left:8px solid var(--A)}
.mod .mh .ic{font-size:30px;flex:0 0 auto}
.mod .mh h2{font-size:21px}.mod .mh .d{font-size:14px;color:var(--ink2)}
.mod .pg{height:6px;background:var(--soft)}.mod .pg div{height:100%;background:var(--A)}
.ls{list-style:none;margin:0;padding:6px 10px 12px}
.ls li{margin:0}
.ls button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 8px;border:0;background:none;text-align:left;border-radius:12px}
.ls button:hover:not(:disabled){background:var(--soft)}
.ls button:disabled{opacity:.45;cursor:not-allowed}
.ls .no{flex:0 0 34px;height:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--ink2);background:#fff}
.ls .ok .no{background:var(--ok);border-color:var(--ok);color:#fff}
.ls .cur .no{border-color:var(--A);color:var(--A)}
.ls .tx{flex:1;min-width:0}.ls .tx b{display:block;font-weight:700;line-height:1.3}.ls .tx small{color:var(--ink2);font-size:13px}
.ls .mn{font-size:12px;color:var(--ink3);white-space:nowrap}
.steps{display:flex;gap:6px;margin:12px 0}
.steps button{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px;font-size:13px;font-weight:700;color:var(--ink2);display:flex;flex-direction:column;align-items:center;line-height:1.2}
.steps button b{font:700 17px var(--serif);color:var(--ink3)}
.steps button.on{border-color:var(--A);color:var(--A);box-shadow:inset 0 -3px 0 var(--A)}.steps button.on b{color:var(--A)}
.steps button.dn b{color:var(--ok)}
.steps button:disabled{opacity:.45}
.lh{padding:20px 20px 16px;border-top:6px solid var(--A)}
.lh .k{font-size:13px;font-weight:800;color:var(--A)}
.lh h1{font-size:28px;line-height:1.15;margin:4px 0}
.lh .uz{color:var(--ink2);font-size:15px}
.goal{margin-top:12px;background:var(--Ah);border-radius:12px;padding:10px 14px;font-size:14.5px}
.th h3{font-size:21px;margin:22px 0 8px;line-height:1.25}
.th h3:first-child{margin-top:4px}
.th p{margin:8px 0}.th ul,.th ol{margin:8px 0;padding-left:22px}.th li{margin:5px 0}
.ex{font-family:var(--serif);font-size:16.5px;background:var(--soft);border-left:4px solid var(--A);border-radius:0 10px 10px 0;padding:8px 14px;margin:8px 0;line-height:1.55}
.ex+.ex{margin-top:-2px}
.en{font-family:var(--serif);font-weight:600}
.tip{background:#FFF7D1;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:15px}
.tip:before{content:"💡 ";}
.warn{background:var(--redh);border-radius:12px;padding:10px 14px;margin:12px 0;font-size:15px}
.warn:before{content:"⚠️ "}
.th table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14.5px;display:block;overflow-x:auto}
.th th,.th td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.th th{background:var(--soft);font-weight:800}
.th td.en,.th td em{font-family:var(--serif)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin:12px 0}
@media(max-width:620px){.cmp{grid-template-columns:minmax(0,1fr)}}
.cmp>div{border-radius:14px;padding:14px;font-family:var(--serif);font-size:15.5px;line-height:1.6;white-space:pre-wrap}
.cmp .bad{background:var(--redh);border:1px solid #F5C2C7}.cmp .good{background:var(--okh);border:1px solid #B7E2CC}
.cmp .h{display:block;font:800 13px var(--ui);margin-bottom:6px;white-space:normal}
.cmp .bad .h{color:var(--red)}.cmp .good .h{color:var(--ok)}
.why{margin:6px 0 0;padding-left:20px;font-size:15px}.why li{margin:4px 0}
.ms{font-family:var(--serif);font-size:17px;line-height:1.85;white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 18px 18px 20px;position:relative}
.ms m{background:linear-gradient(transparent 58%,var(--mark) 58%);cursor:pointer;border-radius:2px}
.ms m:after{content:attr(data-n);display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:var(--red);color:#fff;font:800 11px var(--ui);vertical-align:super;margin-left:2px;line-height:1}
.ms m.on{background:var(--mark)}
.notes{list-style:none;padding:0;margin:12px 0 0;counter-reset:n}
.notes li{position:relative;padding:8px 10px 8px 40px;border-radius:10px;margin:4px 0;font-size:15px;transition:background .2s}
.notes li:before{counter-increment:n;content:counter(n);position:absolute;left:8px;top:9px;width:22px;height:22px;border-radius:50%;border:2px solid var(--red);color:var(--red);font:800 12px var(--ui);display:flex;align-items:center;justify-content:center}
.notes li.on{background:var(--redh)}
.qbar{display:flex;align-items:center;gap:10px;margin:6px 0 12px;font-size:14px;color:var(--ink2);font-weight:700}
.qbar .b{flex:1;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.qbar .b div{height:100%;background:var(--A);transition:width .3s}
.qq{font-size:13px;font-weight:800;color:var(--A);margin-bottom:4px}

L({m:'m1',id:'m1l1',t:'Sentence basics',uz:"Gap tuzilishi: ega + kesim + to'ldiruvchi",min:25,
goal:"Ingliz tilida so'z tartibini (SVO) to'g'ri qo'yish va to'liq gap yozish.",
th:[
{h:"Ingliz gapining «skeleti»",b:`<p>O'zbek tilida kesim gap oxirida keladi: <b>Men kitob o'qiyman.</b> Ingliz tilida esa tartib qat'iy: <b>Ega → Kesim → To'ldiruvchi</b> (Subject – Verb – Object).</p>
<div class="ex">I <b>read</b> books. &nbsp;·&nbsp; My brother <b>plays</b> football. &nbsp;·&nbsp; We <b>visited</b> Samarkand.</div>
<p>Har bir to'liq gapda kamida <b>bitta ega</b> va <b>bitta kesim (fe'l)</b> bo'lishi shart. Fe'lsiz gap — xato.</p>
<div class="warn">«My sister a doctor.» — xato (fe'l yo'q). To'g'ri: <span class="en">My sister <b>is</b> a doctor.</span></div>`},
{h:"Joy va vaqt qayerga qo'yiladi",b:`<p>Odatiy tartib: <b>Ega + Kesim + To'ldiruvchi + Joy + Vaqt</b>.</p>
<div class="ex">I met my friends <b>in the park</b> <b>yesterday</b>.</div>
<p>Vaqtni gap boshiga ham qo'ysa bo'ladi — bunda keyin vergul qo'yiladi:</p>
<div class="ex"><b>Yesterday,</b> I met my friends in the park.</div>
<table><tr><th>Ega</th><th>Kesim</th><th>To'ldiruvchi</th><th>Joy</th><th>Vaqt</th></tr><tr><td>My father</td><td>bought</td><td>a new car</td><td>in Tashkent</td><td>last month.</td></tr><tr><td>We</td><td>are studying</td><td>English</td><td>at Enzo</td><td>this year.</td></tr></table>`},
{h:"Ravishlar: often, always, never",b:`<p>Takrorlanish ravishlari (always, usually, often, sometimes, never) <b>asosiy fe'ldan oldin</b>, lekin <b>«be» fe'lidan keyin</b> keladi.</p>
<div class="ex">I <b>often</b> drink tea. &nbsp;·&nbsp; She is <b>always</b> late.</div>
<div class="warn">«I drink often tea.» — xato. «She always is late.» — xato.</div>`},
{h:"Savol gaplar",b:`<p>Savolda yordamchi fe'l egadan <b>oldinga</b> o'tadi: <b>(So'roq so'zi) + yordamchi fe'l + ega + asosiy fe'l</b>.</p>
<div class="ex">Where <b>do you</b> live? &nbsp;·&nbsp; What <b>did she</b> say? &nbsp;·&nbsp; <b>Are you</b> coming?</div>
<div class="tip">Xatda savol berish juda ko'p kerak bo'ladi: «How was your trip?», «When are you free?» Ularni yod oling.</div>`}],

L({m:'m1',id:'m1l2',t:'Capitals and punctuation',uz:"Katta harf va tinish belgilari",min:25,
goal:"Katta harf, nuqta, vergul, so'roq va apostrofni imtihon talabi darajasida to'g'ri ishlatish.",
th:[
{h:"Katta harf qachon yoziladi",b:`<ul><li>Gap boshida: <span class="en">The weather is nice.</span></li><li>«I» olmoshi doim: <span class="en">My friend and <b>I</b> went out.</span></li><li>Ismlar, shaharlar, davlatlar: <span class="en">Aziz, Samarkand, Uzbekistan</span></li><li>Millat va tillar: <span class="en">Uzbek, English, Russian</span></li><li>Hafta kunlari, oylar, bayramlar: <span class="en">Monday, March, Navruz</span></li></ul>
<div class="warn">Fasllar kichik harf bilan: <span class="en">summer, winter</span>. O'zbek tilidan farqli ravishda millat va tillar <b>katta</b> harf bilan yoziladi.</div>`},
{h:"Vergul (,) — eng ko'p xato qilinadigan belgi",b:`<ol><li>Ro'yxatda: <span class="en">I bought apples, bread and milk.</span></li><li>Kirish so'zlaridan keyin: <span class="en">However, … · In my opinion, … · Yesterday, …</span></li><li>Xatda murojaatdan keyin: <span class="en">Dear Anna, · Hi Tom,</span></li><li>Yakunlovchi iboradan keyin: <span class="en">Best wishes, · Yours sincerely,</span></li><li>«If/When/Although» bilan boshlangan qismdan keyin: <span class="en">If you are free, call me.</span></li></ol>
<div class="warn">Ikki to'liq gapni faqat vergul bilan bog'lab bo'lmaydi: «I was tired, I went to bed.» — xato. To'g'ri: <span class="en">I was tired, <b>so</b> I went to bed.</span> yoki <span class="en">I was tired. I went to bed.</span></div>`},
{h:"Apostrof (')",b:`<p><b>1) Qisqartma:</b> I'm, don't, it's (= it is). <b>2) Egalik:</b> my brother's car (bitta aka), my parents' house (ko'plik).</p>
<div class="ex">It's raining. (= It is) &nbsp;·&nbsp; The city is famous for its history. (egalik, apostrofsiz!)</div>
<div class="tip">Rasmiy xat va Part 2 da qisqartmalar ishlatilmaydi: <b>do not, I am, it is</b>. Do'stga xatda esa qisqartma — tabiiy.</div>`},
{h:"So'roq (?) va undov (!)",b:`<p>Har savol <b>?</b> bilan tugaydi. Undov belgisi faqat norasmiy xatda va kam: <span class="en">Congratulations!</span> Bitta yetarli — «!!!» yozmang.</p>`}],

L({m:'m1',id:'m1l3',t:'Joining ideas: and, but, so, because',uz:"Gaplarni bog'lash: oddiy bog'lovchilar",min:25,
goal:"Qisqa, «uzuq-yuluq» gaplarni oddiy bog'lovchilar bilan silliq matnga aylantirish.",
th:[
{h:"Nega bog'lash kerak",b:`<p>«I woke up. I had breakfast. I went to school.» — grammatik jihatdan to'g'ri, lekin <b>bolalarcha</b> eshitiladi. Imtihonchi «cohesion» (bog'liqlik) uchun ball beradi.</p>
<div class="ex">I woke up <b>and</b> had breakfast, <b>but</b> I was late for school <b>because</b> the bus didn't come.</div>`},
{h:"Asosiy beshlik",b:`<table><tr><th>So'z</th><th>Vazifasi</th><th>Misol</th></tr>
<tr><td class="en">and</td><td>qo'shish</td><td class="en">I like tea and I drink it every day.</td></tr>
<tr><td class="en">but</td><td>qarama-qarshilik</td><td class="en">The hotel was nice, but it was expensive.</td></tr>
<tr><td class="en">so</td><td>natija</td><td class="en">It was raining, so we stayed at home.</td></tr>
<tr><td class="en">because</td><td>sabab</td><td class="en">We stayed at home because it was raining.</td></tr>
<tr><td class="en">or</td><td>tanlov</td><td class="en">We can meet on Friday or on Saturday.</td></tr></table>
<div class="tip"><b>so</b> — natija (shuning uchun), <b>because</b> — sabab (chunki). Ularni chalkashtirmang: «It was raining because we stayed at home» — mantiqsiz.</div>`},
{h:"Vergul qoidasi",b:`<p>Ikki to'liq gapni <b>but</b> va <b>so</b> bilan bog'lasangiz, ulardan oldin odatda vergul qo'yiladi. <b>because</b> dan oldin vergul qo'yilmaydi.</p>
<div class="ex">I was tired<b>,</b> so I went to bed early. &nbsp;·&nbsp; I went to bed early because I was tired.</div>
<div class="warn">Gapni «Because …» bilan tugatib qo'ymang: «Because I was tired.» — to'liq gap emas. To'g'ri: <span class="en">I went home because I was tired.</span></div>`},
{h:"Ortiqcha «and» dan saqlaning",b:`<p>Bitta gapda 3–4 marta «and» — ham yomon: «I went to the shop and I bought bread and I came home and I cooked.» Uni 2 ta gapga bo'ling yoki boshqa bog'lovchi ishlating: <span class="en">After that, … · Then, …</span></p>`}],
cmp:{bad:"I wanted to buy a phone. It was expensive. I didn't buy it. I saved money. I bought it in May.",good:"I wanted to buy a new phone, but it was too expensive, so I didn't buy it immediately. I saved money for three months and finally bought it in May.",why:["5 ta qisqa gap 2 ta silliq gapga aylandi.","<b>but</b> — qarama-qarshilik, <b>so</b> — natija, <b>and</b> — qo'shish.","«immediately», «finally» — vaqt ketma-ketligini ko'rsatadi."]},

task:{type:'para',w:[60,90],time:12,prompt:`<p>Kundalik tartibingiz haqida yozing (<b>60–90 so'z</b>). <b>and, but, so, because</b> so'zlarining har birini kamida bir marta ishlating. Uzuq-yuluq qisqa gaplardan qoching.</p>`,
frame:"On weekdays, I usually get up at … because … .\nI have breakfast and then … .\nMy classes / work … , but … .\nIn the evening, I … , so … .",
model:"On weekdays, I usually get up at half past six because my lessons start at eight. I have a quick breakfast and then take the bus to my lyceum. My classes finish at two, but I often stay for extra English lessons. In the evening, I help my mother at home and do my homework. I am usually very tired by ten, so I go to bed quite early.",ml:'B1',
ck:["and, but, so, because — har biri bor","because dan oldin vergul yo'q, but/so dan oldin bor","«Because …» alohida gap bo'lib qolmagan","Bitta gapda 2 tadan ortiq «and» yo'q","So'z soni 60–90"]}});

L({m:'m1',id:'m1l4',t:'Complex sentences',uz:"Murakkab gaplar: although, when, if, who, which",min:30,
goal:"B1–B2 darajasiga chiqish uchun ergash gaplarni (although, while, when, if, who/which) ishlatish.",
th:[
{h:"Oddiydan murakkabga",b:`<p>Imtihonchilar «range of structures» — tuzilmalar xilma-xilligini baholaydi. Faqat oddiy gaplar = B1 dan yuqori ball qiyin. Ergash gap qo'shish — eng tez yo'l.</p>
<div class="ex">Simple: My city is old. It has many museums.<br>Complex: My city, <b>which</b> is very old, has many museums.</div>`},
{h:"Vaqt va shart: when, while, before, after, if, unless",b:`<div class="ex"><b>When</b> I arrived, the lesson had already started.</div><div class="ex"><b>If</b> you need help, call me.</div><div class="ex">You will fail <b>unless</b> you study. (= if you don't study)</div>
<div class="warn">«if» va «when» dan keyin kelasi zamon ishlatilmaydi: «If it <s>will rain</s>…» emas — <span class="en">If it <b>rains</b>, we will stay at home.</span></div>`},
{h:"Qarama-qarshilik: although / even though / while",b:`<div class="ex"><b>Although</b> the hotel was expensive, we enjoyed our stay.</div><div class="ex">I love my city, <b>even though</b> it is very crowded.</div>
<div class="warn">«Although … , but …» — xato! Bitta gapda bittasi yetarli: <span class="en">Although it was late, we continued.</span></div>`},
{h:"Nisbiy gaplar: who, which, where, whose",b:`<table><tr><th>So'z</th><th>Kim/nima uchun</th><th>Misol</th></tr><tr><td class="en">who</td><td>odam</td><td class="en">My teacher, who is from London, is very kind.</td></tr><tr><td class="en">which</td><td>narsa, hayvon</td><td class="en">The book which you gave me is great.</td></tr><tr><td class="en">where</td><td>joy</td><td class="en">This is the café where we first met.</td></tr><tr><td class="en">whose</td><td>egalik</td><td class="en">I have a friend whose father is a doctor.</td></tr></table>
<div class="tip">Ma'lumot qo'shimcha bo'lsa (olib tashlasa ham gap ma'nosi tushunarli), u vergullar orasiga olinadi: <span class="en">Samarkand<b>,</b> which is 2,700 years old<b>,</b> attracts many tourists.</span></div>`}],
cmp:{bad:"My uncle is a doctor. He lives in Tashkent. He works very hard. He is always happy.",good:"My uncle, who lives in Tashkent, is a doctor. Although he works very hard, he is always cheerful.",why:["<b>who</b> — ikki gapni birlashtirdi.","<b>Although</b> — qarama-qarshilikni ko'rsatdi.","«happy» o'rniga aniqroq so'z: <b>cheerful</b>."]},

['f',"The woman ___ lives next door is a nurse.",["who","that"],"Odam uchun: <b>who</b> (yoki that)."],
['f',"This is the restaurant ___ we celebrated my birthday.",["where"],"Joy uchun: <b>where</b>."],
['x',"Although the test was difficult, but I passed it.",["Although the test was difficult, I passed it.","The test was difficult, but I passed it."],"«Although» va «but» birga ishlatilmaydi."],

['m',"I have a friend ___ brother plays for Pakhtakor.",["who","whose","which"],1,"Egalik: <b>whose</b> brother."],
['m',"You won't pass the exam ___ you practise every day.",["unless","if","when"],0,"<b>unless</b> = if … not."],
['o',["When I finish university,","I","want to work","as an engineer."],"Ergash gap boshda — undan keyin vergul."]],
task:{type:'para',w:[70,100],time:15,prompt:`<p>Ona shahringiz yoki qishlog'ingiz haqida yozing (<b>70–100 so'z</b>). Kamida ishlating:</p><ul><li>bitta <b>who / which / where</b> gapi;</li><li>bitta <b>although / even though</b> gapi;</li><li>bitta <b>if / when</b> gapi.</li></ul>`,
frame:"I come from …, which is … .\nIt is famous for … .\nAlthough …, … .\nThere is a … where … .\nIf you visit …, you should … .",
model:"I come from Kokand, which is one of the oldest cities in the Fergana Valley. It is famous for its beautiful palace and its traditional sweets. Although Kokand is not very big, there is always something to do. There is a large park in the centre where families walk in the evenings. My favourite place is a small tea house which belongs to my uncle. If you visit Kokand, you should definitely try the local halva.",ml:'B1–B2',
ck:["who/which/where bilan nisbiy gap bor","although/even though bor (but siz)","if/when gapi bor, undan keyin kelasi zamon yo'q","Ergash gap boshda bo'lsa vergul qo'yilgan","So'z soni 70–100"]}});

L({m:'m1',id:'m1l5',t:'Tenses in letters',uz:"Xatda zamonlar: yangilik, reja, tajriba",min:30,
goal:"Xat va postlarda eng ko'p kerak bo'ladigan 6 ta zamonni to'g'ri tanlash.",
th:[
{h:"Xatda kerak bo'ladigan zamonlar xaritasi",b:`<table><tr><th>Nima haqida</th><th>Zamon</th><th>Misol</th></tr>
<tr><td>Odatlar, faktlar</td><td>Present Simple</td><td class="en">I work in a bank.</td></tr>
<tr><td>Hozir / shu kunlarda</td><td>Present Continuous</td><td class="en">I'm preparing for my exams these days.</td></tr>
<tr><td>Yangilik, tajriba (vaqt aytilmaydi)</td><td>Present Perfect</td><td class="en">I've just moved to a new flat. · Have you ever been to Khiva?</td></tr>
<tr><td>Aniq vaqtli o'tmish</td><td>Past Simple</td><td class="en">We went there last summer.</td></tr>
<tr><td>Kelishilgan reja</td><td>Present Continuous</td><td class="en">I'm meeting Sara on Friday.</td></tr>
<tr><td>Niyat</td><td>be going to</td><td class="en">I'm going to start a new course.</td></tr>
<tr><td>Hozir qaror, va'da</td><td>will</td><td class="en">I'll send you the photos tonight.</td></tr></table>`},
{h:"Present Perfect yoki Past Simple?",b:`<p>Eng ko'p xato shu yerda. Qoida oddiy: <b>aniq o'tgan vaqt</b> (yesterday, last week, in 2023, two days ago) bo'lsa — Past Simple. Vaqt aytilmasa yoki natija hozir muhim bo'lsa — Present Perfect.</p>
<div class="ex">I <b>have lost</b> my keys. (hozir kalitim yo'q) &nbsp;·&nbsp; I <b>lost</b> my keys yesterday.</div>
<div class="warn">«I have seen him yesterday.» — xato. To'g'ri: <span class="en">I saw him yesterday.</span></div>
<div class="tip">Xat boshida yangilik aytish uchun: <span class="en">I've just got a new job! · We've finally finished the project.</span></div>`},
{h:"for va since",b:`<div class="ex">I have lived here <b>for</b> five years. (davomiylik) &nbsp;·&nbsp; I have lived here <b>since</b> 2020. (boshlanish nuqtasi)</div>`},
{h:"Kelajak: uch xil yo'l",b:`<p>Do'stingizni taklif qilayotganda: <span class="en">We<b>'re having</b> a party on Saturday. (reja aniq)</span><br>Niyat: <span class="en">I<b>'m going to</b> learn to drive this summer.</span><br>Taklif / va'da: <span class="en">Don't worry, I<b>'ll</b> help you.</span></p>`}],
an:{title:"Zamonlar xatda qanday ishlaydi",text:"Hi Kamila,\n\n[[I've just got]] some great news — [[I passed]] my driving test yesterday! [[I'm practising]] every day now because [[I'm going to]] drive to Samarkand next month. [[We're leaving]] on the 15th. [[I'll send]] you lots of photos!\n\nLove,\nNodira",notes:["Present Perfect + just — hozirgina bo'lgan yangilik.","Past Simple — aniq vaqt bor (yesterday).","Present Continuous — shu kunlardagi harakat.","be going to — niyat, reja.","Present Continuous — kelishilgan aniq reja (sana bor).","will — va'da, shu yerda qabul qilingan qaror."]},
ex:[
['m',"I ___ to Khiva three times.",["went","have been","am going"],1,"Tajriba, vaqt aytilmagan: <b>have been</b>."],
['m',"We ___ to Khiva last spring.",["have gone","went","go"],1,"Aniq vaqt (last spring): <b>went</b>."],
['f',"I have known Ali ___ ten years.",["for"],"Davomiylik: <b>for</b>."],
['f',"She has worked here ___ 2019.",["since"],"Boshlanish nuqtasi: <b>since</b>."],
['x',"I have finished the project last week.",["I finished the project last week."],"Aniq vaqt bor — Past Simple."],
['m',"A: The phone is ringing! B: OK, I ___ answer it.",["am going to","will","am answering"],1,"Hozir qabul qilingan qaror: <b>will</b>."],
['m',"I ___ my grandparents this Sunday — we've already bought the tickets.",["visit","am visiting","visited"],1,"Kelishilgan reja: <b>am visiting</b>."],
['m',"Choose the best opening for a letter with news.",["I passed my exam last year ago.","I've just passed my exam!","I have passed my exam two days ago."],1,"Yangilik: <b>I've just passed</b>."],
['f',"These days I ___ (prepare) for my university entrance exams.",["am preparing","'m preparing","’m preparing"],"Shu kunlarda: Present Continuous."]],
task:{type:'para',w:[70,100],time:15,prompt:`<p>Uzoqdagi do'stingizga yangiliklaringizni yozing (<b>70–100 so'z</b>). Kamida <b>4 xil zamon</b> ishlating: yaqindagi yangilik (Present Perfect), aniq o'tgan voqea (Past Simple), hozirgi mashg'ulot (Present Continuous) va kelajak rejasi.</p>`,
frame:"Hi …,\n\nI've just … ! Last week, I … .\nThese days I'm … .\nNext month, I'm going to … .\n\nBest wishes,\n…",
model:"Hi Laylo,\n\nI've just started a part-time job at a bookshop in the city centre! I went for the interview last Monday and they called me the next day. These days I'm learning a lot about books and customers. It's tiring but fun. Next month, I'm going to use my first salary to buy a new laptop. Are you still planning to visit Tashkent in August? I'll show you my shop!\n\nBest wishes,\nMadina",ml:'B1',

L({m:'m1',id:'m1l6',t:'Building a paragraph',uz:"Paragraf qurish: asosiy gap, tafsilot, yakun",min:30,
goal:"Asosiy gap (topic sentence), tushuntirish va misoldan iborat mantiqiy paragraf yozish.",
th:[
{h:"Paragraf — bitta asosiy fikr",b:`<p>Paragraf bu — <b>bitta g'oya</b> atrofidagi 3–6 ta gap. Yangi fikr = yangi paragraf. Imtihonda bitta «devor» matn yozish — tuzilma uchun ball yo'qotish demak.</p>`},
{h:"Uch qism",b:`<ol><li><b>Topic sentence</b> (asosiy gap) — paragraf nima haqida ekanini aytadi.</li><li><b>Supporting sentences</b> — tushuntirish, sabab, misol.</li><li><b>Concluding sentence</b> (ixtiyoriy) — fikrni yakunlaydi yoki keyingisiga bog'laydi.</li></ol>
<div class="ex"><b>Living in a big city has many advantages.</b> Firstly, there are more job opportunities, especially in IT and banking. Secondly, public transport is usually good, so you do not need a car. For example, the Tashkent metro can take you almost anywhere for a low price. <b>For these reasons, many young people prefer to move to the capital.</b></div>`},
{h:"Yaxshi asosiy gap qanday bo'ladi",b:`<ul><li>Juda umumiy emas: <s>«Sport is a thing.»</s></li><li>Juda tor emas: <s>«I play football on Tuesdays at 5.»</s></li><li>Aniq va bahsli: <span class="en">Doing sport regularly improves both physical and mental health.</span></li></ul>`},
{h:"Paragrafni qanday ajratish",b:`<p>Qo'lda yozganda: yangi qatordan boshlang va bir oz chekinish qiling. Kompyuterda: paragraflar orasida <b>bo'sh qator</b> qoldiring. Bu kursda paragraflar orasiga bo'sh qator qo'ying.</p>`}],
an:{title:"Paragraf anatomiyasi",text:"[[Learning a foreign language opens many doors.]] [[First of all, it gives you better career opportunities, because international companies prefer employees who speak English.]] [[For instance, my cousin got a job at a hotel in Samarkand mainly because of his language skills.]] [[In addition, you can travel more easily and make friends from other countries.]] [[In short, a second language is one of the best investments a young person can make.]]",notes:["Topic sentence — asosiy fikr.","1-dalil + sabab (because).","Aniq misol (For instance) — ishonchlilik beradi.","2-dalil (In addition).","Yakunlovchi gap — fikrni boshqa so'zlar bilan takrorlaydi."]},
ex:[
['m',"Which is the best topic sentence for a paragraph about the benefits of reading?",["I read a book yesterday.","Reading regularly has several important benefits.","Books are made of paper."],1,"Asosiy gap — aniq va umumlashtiruvchi."],
['m',"Which sentence does NOT belong in a paragraph about the advantages of public transport?",["It is cheaper than using a car.","It reduces traffic in the city centre.","My favourite colour is blue."],2,"Paragraf bitta fikr atrofida bo'ladi."],
['o',["Social media has changed the way we communicate.","Firstly, we can talk to friends in other countries for free.","Secondly, news spreads much faster than before.","As a result, the world feels much smaller today."],"Asosiy gap → 1-dalil → 2-dalil → yakun."],
['m',"What usually follows a supporting idea?",["A new topic","An example or explanation","The greeting"],1,"Har dalil misol yoki tushuntirish bilan kuchayadi."],
['s',[["Sport improves health in several ways.",0],["For example, running strengthens the heart.",1],["Overall, everyone should exercise regularly.",2],["It also reduces stress.",1]],["Asosiy gap","Tafsilot","Yakun"],"Har gapning vazifasini aniqlang."],
['m',"Which is the best concluding sentence for a paragraph about the problems of big cities?",["For these reasons, life in a big city can be stressful.","I live in a village.","Cities have buildings."],0,"Yakunlovchi gap paragraf fikrini umumlashtiradi."],
['f',"___ example, many students use apps to learn new words.",["For"],"<b>For example</b> — misol keltirish."],
['m',"When should you start a new paragraph?",["After every sentence","When you start a new main idea","Never in a letter"],1,"Yangi asosiy fikr = yangi paragraf."]],
task:{type:'para',w:[80,110],time:15,prompt:`<p>Bitta paragraf yozing (<b>80–110 so'z</b>): <b>«Why is it important to learn English?»</b></p><ul><li>Aniq asosiy gap bilan boshlang;</li><li>2 ta sabab va kamida 1 ta aniq misol;</li><li>Yakunlovchi gap bilan tugating.</li></ul>`,
frame:"[Asosiy gap] Learning English is important for several reasons.\n[1-sabab] Firstly, … because … .\n[Misol] For example, … .\n[2-sabab] In addition, … .\n[Yakun] For these reasons, … .",
model:"Learning English is important for young people in Uzbekistan for several reasons. Firstly, it improves career prospects, because many companies in banking, IT and tourism need staff who can communicate with foreign partners. For example, most job advertisements for well-paid positions in Tashkent ask for at least a B2 level. In addition, English gives access to a huge amount of information, from online courses to scientific articles. For these reasons, I believe English is no longer a luxury but a basic skill.",ml:'B2',
ck:["Birinchi gap — aniq asosiy gap","2 ta alohida sabab bor","Kamida bitta aniq misol (For example / For instance)","Yakunlovchi gap bor","Barcha gaplar bitta mavzu atrofida"]}});

L({m:'m1',id:'m1l7',t:'Linking words by function',uz:"Bog'lovchilar: vazifasi bo'yicha",min:30,
goal:"Bog'lovchilarni vazifasiga qarab tanlash va ularning grammatikasini (vergul, ot/gap) to'g'ri qo'llash.",
th:[
{h:"Besh guruh",b:`<table><tr><th>Vazifa</th><th>Norasmiy / neytral</th><th>Rasmiyroq</th></tr>
<tr><td>Qo'shish</td><td class="en">and, also, too, plus</td><td class="en">In addition, Moreover, Furthermore, What is more</td></tr>
<tr><td>Qarama-qarshilik</td><td class="en">but, though</td><td class="en">However, Nevertheless, On the other hand, Whereas</td></tr>
<tr><td>Sabab</td><td class="en">because, as, since</td><td class="en">due to, owing to, because of</td></tr>
<tr><td>Natija</td><td class="en">so</td><td class="en">Therefore, As a result, Consequently</td></tr>
<tr><td>Misol</td><td class="en">like</td><td class="en">For example, For instance, such as</td></tr></table>`},
{h:"Grammatika: nimadan keyin nima keladi",b:`<p><b>Gap boshida + vergul:</b> However, / Moreover, / Therefore, / As a result, / For example,</p>
<div class="ex">The flat is cheap. <b>However,</b> it is far from the centre.</div>
<p><b>Ot yoki -ing bilan:</b> despite, in spite of, because of, due to</p>
<div class="ex"><b>Despite</b> the rain, we went out. &nbsp;·&nbsp; <b>Because of</b> the traffic, I was late.</div>
<p><b>To'liq gap bilan:</b> although, because, whereas, while</p>
<div class="ex"><b>Although</b> it was raining, we went out.</div>
<div class="warn">«Despite it was raining» — xato. «Despite» dan keyin gap emas, ot keladi: <span class="en">Despite the rain / Despite the fact that it was raining</span>.</div>`},
{h:"Tartib ko'rsatuvchilar",b:`<p>Hikoya yoki jarayon: <span class="en">First, … Then, … After that, … Finally, …</span><br>Dalillar: <span class="en">Firstly, … Secondly, … Finally, …</span></p>
<div class="tip">Bog'lovchilarni haddan tashqari ko'p ishlatmang. Har gap «Moreover, Furthermore, Additionally» bilan boshlansa — sun'iy eshitiladi. 2–3 gapga bitta yetarli.</div>`}],
cmp:{bad:"Online learning is flexible. It can be lonely. You can study at any time. Many students lose motivation. Universities should combine both.",good:"Online learning is flexible because students can study at any time. However, it can be lonely, and as a result, many students lose motivation. Therefore, universities should combine online and face-to-face classes.",why:["<b>because</b> — sabab bog'landi.","<b>However,</b> — qarama-qarshi fikrga o'tish.","<b>as a result</b> / <b>Therefore,</b> — natija va xulosa."]},
ex:[
['m',"The course is expensive. ___, it is very useful.",["Moreover","However","Because"],1,"Qarama-qarshilik: <b>However,</b>"],
['m',"___ the bad weather, the match continued.",["Although","Despite","However"],1,"Ot oldidan: <b>Despite</b> the bad weather."],
['m',"___ it was late, she kept working.",["Despite","Because of","Although"],2,"To'liq gap oldidan: <b>Although</b> it was late."],
['m',"Prices went up. ___, fewer people bought cars.",["As a result","For example","Although"],0,"Natija: <b>As a result,</b>"],
['x',"Despite it was cold, we swam in the lake.",["Although it was cold, we swam in the lake.","Despite the cold, we swam in the lake.","Even though it was cold, we swam in the lake.","Despite the fact that it was cold, we swam in the lake."],"«Despite» + ot; gap bilan — «Although»."],
['f',"Many fruits, ___ as apples and pears, grow well here.",["such"],"<b>such as</b> + misollar."],
['s',[["Moreover",0],["Nevertheless",1],["Consequently",2],["For instance",3],["Furthermore",0],["Therefore",2]],["Qo'shish","Qarama-qarshilik","Natija","Misol"],"Vazifasiga qarab guruhlang."],
['m',"I was late ___ the traffic.",["because","because of","although"],1,"Ot oldidan: <b>because of</b> the traffic."],
['m',"Which sentence is punctuated correctly?",["However the price is high.","However, the price is high.","However the price, is high."],1,"Gap boshidagi «However» dan keyin vergul."]],
task:{type:'para',w:[90,120],time:15,prompt:`<p>Bitta paragraf yozing (<b>90–120 so'z</b>): <b>«Is it better to study at home or in a library?»</b><br>Har guruhdan kamida bitta bog'lovchi ishlating: qo'shish, qarama-qarshilik, natija, misol.</p>`,
frame:"Many students wonder whether … .\nStudying at home is comfortable because … .\nFor example, … .\nHowever, … .\nAs a result, … .\nTherefore, in my opinion, … .",
model:"Many students wonder whether it is better to study at home or in a library. Studying at home is comfortable because you do not waste time travelling. For example, you can start revising immediately after dinner. However, home is full of distractions, such as the television, social media and noisy family members. As a result, a two-hour session can easily become thirty minutes of real work. Libraries, in contrast, are quiet and create a serious atmosphere. Moreover, being surrounded by other students can be motivating. Therefore, in my opinion, the library is the better choice for important exams.",ml:'B2',
ck:["Qo'shish bog'lovchisi (Moreover / In addition)","Qarama-qarshilik (However / In contrast)","Natija (As a result / Therefore)","Misol (For example / such as)","Gap boshidagi bog'lovchidan keyin vergul"]}});

L({m:'m1',id:'m1l8',t:'Formal or informal?',uz:"Uslub: rasmiy va norasmiy",min:30,
goal:"Kimga yozayotganingizga qarab uslubni tanlash va norasmiy matnni rasmiyga aylantirish.",
th:[
{h:"Nega bu muhim",b:`<p>Multilevel imtihonida <b>bir vaziyat bo'yicha ikki xat</b> yozasiz: do'stga (Task 1.1) va rasmiy shaxsga (Task 1.2). Uslubni aralashtirish — «register» mezoni bo'yicha eng ko'p ball yo'qotiladigan joy.</p>`},
{h:"Farqlar jadvali",b:`<table><tr><th></th><th>Norasmiy (do'stga)</th><th>Rasmiy (tashkilotga)</th></tr>
<tr><td>Salom</td><td class="en">Hi Ali, / Hello Sara,</td><td class="en">Dear Mr Aliyev, / Dear Sir or Madam,</td></tr>
<tr><td>Qisqartma</td><td class="en">I'm, don't, can't</td><td class="en">I am, do not, cannot</td></tr>
<tr><td>So'zlar</td><td class="en">get, ask, a lot of, need, help</td><td class="en">receive, enquire, a great deal of, require, assist</td></tr>
<tr><td>Fe'l iboralari</td><td class="en">find out, put off, look into</td><td class="en">discover, postpone, investigate</td></tr>
<tr><td>Savollar</td><td class="en">When does it start?</td><td class="en">Could you tell me when it starts?</td></tr>
<tr><td>Belgilar</td><td class="en">! :) — dash</td><td>faqat nuqta va vergul</td></tr>
<tr><td>Yakun</td><td class="en">Best wishes, / Take care,</td><td class="en">Yours sincerely, / Yours faithfully,</td></tr></table>`},
{h:"Rasmiylashtirishning 4 usuli",b:`<ol><li><b>Qisqartmalarni oching:</b> I'm → I am.</li><li><b>So'zni almashtiring:</b> get → receive, buy → purchase, start → commence (ehtiyot bo'ling, haddan oshirmang).</li><li><b>Muloyim modal:</b> Send me… → <span class="en">Could you please send me…? / I would be grateful if you could send me…</span></li><li><b>Hissiyotni yumshating:</b> It was terrible! → <span class="en">I was extremely disappointed with…</span></li></ol>
<div class="warn">Rasmiy degani «qadimiy» emas. «Herewith I humbly beg…» kabi eskirgan iboralar kerak emas. Aniq, muloyim va professional bo'lsin.</div>`}],

task:{type:'1.2',w:[60,90],time:15,prompt:`<p>Quyidagi norasmiy xabarni <b>til markazi direktoriga rasmiy xat</b> qilib qayta yozing (<b>60–90 so'z</b>):</p><p><i>«Hi! I wanna join your IELTS course but the evening group is full. Can you open another group? I can't come in the mornings coz I work. Also how much is it? Thanks a lot!»</i></p>`,
frame:"Dear Sir or Madam,\n\nI am writing to enquire about … .\nUnfortunately, … .\nI would be grateful if you could … .\nCould you also tell me … ?\n\nI look forward to hearing from you.\n\nYours faithfully,\n…",
model:"Dear Sir or Madam,\n\nI am writing to enquire about your IELTS preparation course. I would like to join the evening group, but I understand that it is already full. Unfortunately, I am unable to attend morning classes because I work full-time. I would be grateful if you could consider opening an additional evening group. Could you also tell me how much the course costs?\n\nI look forward to hearing from you.\n\nYours faithfully,\nJasur Toshmatov",ml:'B2',
ck:["Dear Sir or Madam, … Yours faithfully, mos","Bitta ham qisqartma yo'q","«wanna, coz, thanks a lot» almashtirilgan","Savol muloyim shaklda (Could you tell me…)","Barcha ma'lumotlar saqlangan: guruh, vaqt, narx"]}});

L({m:'m1',id:'m1l9',t:'Typical mistakes of Uzbek learners',uz:"O'zbek o'quvchilarining tipik xatolari",min:30,
goal:"Ona tili ta'sirida qilinadigan 10 ta eng keng tarqalgan xatoni tanib, tuzatish.",
th:[
{h:"1. Artikllar: a / an / the",b:`<p>O'zbek tilida artikl yo'q, shuning uchun ular ko'pincha tushib qoladi.</p><ul><li>Birlikdagi sanaladigan ot oldidan doim nimadir kerak: <span class="en"><b>a</b> car, <b>the</b> car, <b>my</b> car</span>.</li><li>Birinchi marta — <b>a</b>, keyin — <b>the</b>: <span class="en">I bought <b>a</b> phone. <b>The</b> phone is great.</span></li><li>Kasb: <span class="en">She is <b>a</b> doctor.</span></li></ul>`},
{h:"2. Sanalmaydigan otlar",b:`<p>Bu so'zlar <b>ko'plik qo'shimchasini olmaydi</b> va «a» bilan kelmaydi: <span class="en">information, advice, news, homework, furniture, equipment, knowledge, luggage, research, money</span>.</p>
<div class="ex">Can you give me some <b>information</b>? &nbsp;·&nbsp; He gave me <b>a piece of advice</b>. &nbsp;·&nbsp; The news <b>is</b> good.</div>`},
{h:"3. Predloglar",b:`<table><tr><th>Xato</th><th>To'g'ri</th></tr>
<tr><td>discuss about the problem</td><td class="en">discuss the problem</td></tr>
<tr><td>explain me</td><td class="en">explain to me</td></tr>
<tr><td>listen music</td><td class="en">listen to music</td></tr>
<tr><td>married with</td><td class="en">married to</td></tr>
<tr><td>depend from</td><td class="en">depend on</td></tr>
<tr><td>interested about</td><td class="en">interested in</td></tr>
<tr><td>arrive to Tashkent</td><td class="en">arrive in Tashkent / at the station</td></tr>
<tr><td>in Monday</td><td class="en">on Monday</td></tr></table>`},
{h:"4. Boshqa «o'zbekcha» xatolar",b:`<ul><li><s>I am agree</s> → <span class="en">I agree</span> (agree — fe'l)</li><li><s>According to me</s> → <span class="en">In my opinion</span></li><li><s>In nowadays</s> → <span class="en">Nowadays</span></li><li><s>More better</s> → <span class="en">better</span></li><li><s>The most of people</s> → <span class="en">Most people</span></li><li><s>He go / She have</s> → <span class="en">He goes / She has</span></li><li><s>People is</s> → <span class="en">People are</span></li><li><s>Make a photo</s> → <span class="en">take a photo</span></li></ul>
<div class="tip">Avto-tekshiruv bu xatolarning ko'pini avtomatik topadi. Lekin eng yaxshi yo'l — ularni yodlab olish.</div>`}],
cmp:{bad:"In nowadays the most of young people use internet. According to me it is more better to read books. My teacher gave me many advices and explained me why.",good:"Nowadays, most young people use the internet. In my opinion, it is better to read books. My teacher gave me a lot of advice and explained to me why.",why:["<b>Nowadays</b>, <b>most young people</b>, <b>the internet</b>.","<b>In my opinion</b>, <b>better</b>.","<b>advice</b> — sanalmaydi; <b>explained to me</b>."]},

['x',"Can you give me some informations?",["Can you give me some information?"],"«information» — sanalmaydi."],
['x',"We discussed about the problem.",["We discussed the problem."],"«discuss» to'g'ridan-to'g'ri ot oladi."],

['x',"In nowadays people use phones all the time.",["Nowadays people use phones all the time.","Nowadays, people use phones all the time."],"«in» kerak emas."],

['x',"My father go to work by car.",["My father goes to work by car."],"3-shaxs birlik: <b>goes</b>."],
['x',"This phone is more better than mine.",["This phone is better than mine."],"«better» allaqachon qiyosiy daraja."]],
task:{type:'para',w:[60,90],time:12,prompt:`<p>Quyidagi matnda <b>8 ta xato</b> bor. Ularni tuzatib, matnni to'liq qayta yozing va oxiriga o'zingizdan <b>2 ta gap</b> qo'shing:</p><p><i>«In nowadays the most of students has smartphone. According to me it is useful because you can find informations quickly. But some students listen music during lessons and teachers is angry.»</i></p>`,
model:"Nowadays, most students have a smartphone. In my opinion, it is useful because you can find information quickly. However, some students listen to music during lessons, and teachers are angry about this. I think schools should create clear rules for phone use. For example, students could use their phones only during breaks or for special tasks that the teacher gives in class.",ml:'B1–B2',mnote:"Tuzatilganlar: In nowadays → Nowadays; the most of → most; has → have; smartphone → a smartphone; According to me → In my opinion; informations → information; listen music → listen to music; teachers is → teachers are.",
ck:["«Nowadays» — «in» siz","most students have a smartphone","In my opinion; information","listen to music; teachers are","O'zingizdan 2 ta yangi gap qo'shdingiz"]}});

task:{type:'para',w:[80,110],time:15,prompt:`<p>Topshiriq: <b>«Some people prefer to spend their holidays at home, while others like travelling. What do you prefer and why?»</b></p><p>Avval 2 daqiqa reja tuzing (kalit so'zlar), keyin <b>bitta paragraf</b> yozing (<b>80–110 so'z</b>). Rejani matndan oldin, «Reja:» deb yozib qo'ying — u so'z soniga kirmaydi deb hisoblang.</p>`,
frame:"Reja: [pozitsiya] … / [sabab 1] … / [sabab 2] … / [misol] …\n\nI prefer … because … .\nFirstly, … .\nFor example, … .\nIn addition, … .\nFor these reasons, … .",
model:"I prefer travelling during my holidays because it gives me new experiences that I cannot get at home. Firstly, visiting new places helps me understand different cultures and traditions. For example, last summer I spent a week in Khiva, and walking through the old city taught me more about history than any textbook. In addition, travelling helps me relax completely, as I forget about my daily problems and studies. Although staying at home is cheaper, I believe that memories from a trip are worth the money. For these reasons, I always try to go somewhere new.",ml:'B2',mnote:"Namunadagi reja: travel / new cultures / relax / Khiva example / cost (qarshi fikr).",
ck:["Avval reja yozdim (kalit so'zlar)","Pozitsiya birinchi gapda aniq","2 ta sabab va 1 ta aniq misol","Yakunlovchi gap bor","Matn rejaga mos"]}});

<p><b>Task 1.1</b>: shu vaziyat haqida <b>do'stingizga</b> norasmiy xat yozasiz. Do'stingiz ham shu klub a'zosi yoki shu voqeaga aloqador.</p>

{h:"Topshiriq odatda nimani so'raydi",b:`<p>Topshiriq oxirida bitta jumla bo'ladi, masalan:</p><div class="ex">Write a letter to your friend. Write about your feelings and what you think the club should do.</div>
<p>Bu yerda <b>ikki talab</b> bor: ① his-tuyg'ularingiz ② klub nima qilishi kerakligi haqida fikringiz. Ikkalasiga javob berish shart.</p>

task:{type:'1.1',w:[45,70],time:10,prompt:`<p><b>Vaziyat:</b> Siz qatnashadigan ingliz tili klubi e'lon qildi: endi mashg'ulotlar shanba kunlari emas, <b>yakshanba kuni soat 9:00 da</b> o'tadi.</p><p>Do'stingiz ham shu klubda. Unga xat yozing: <b>bu o'zgarish haqida qanday his qilyapsiz</b> va <b>nima qilmoqchisiz</b>. Taxminan 50 so'z.</p>`,

{h:"Rasmiy iboralar — taqiqlangan",b:`<p>Do'stga: <s>Dear Sir</s>, <s>I am writing to inform you</s>, <s>Yours sincerely</s>, <s>I look forward to hearing from you</s> — bularning hammasi uslub xatosi.</p>`}],

task:{type:'1.1',w:[45,70],time:10,prompt:`<p><b>Vaziyat:</b> Shahringizdagi kutubxona yangi qoida kiritdi: endi kitobni faqat <b>1 haftaga</b> olish mumkin (avval 1 oy edi).</p><p>Kitob o'qishni yaxshi ko'radigan do'stingizga yozing: <b>bu qoida haqida nima deb o'ylaysiz</b> va <b>endi qanday qilib ko'proq kitob o'qish mumkin</b>. Taxminan 50 so'z. Birinchi gap to'g'ridan-to'g'ri vaziyat haqida bo'lsin.</p>`,

{h:"Universal ramka (moslashtirib ishlating)",b:`<div class="ex">Hi [ism],<br>[Reaksiya: Have you seen / heard…? + his-tuyg'u]<br>[Talab ①] [Talab ②] [Talab ③]<br>[Savol yoki taklif]<br>[Best / Take care], [ism]</div>

task:{type:'1.1',w:[45,70],time:10,prompt:`<p><b>Imtihon sharoiti — taymerni 10 daqiqaga qo'ying!</b></p><p><b>Vaziyat:</b> Siz qatnashadigan suzish havzasi xabar berdi: ta'mirlash sababli havza <b>iyun va iyul oylarida yopiladi</b>. Shu vaqt ichida a'zolar boshqa shahardagi filialdan bepul foydalanishi mumkin.</p><p>Har hafta birga suzadigan do'stingizga yozing: <b>his-tuyg'ularingiz</b>, <b>filial taklifi haqida fikringiz</b> va <b>yozda nima qilishni taklif qilasiz</b>. Taxminan 50 so'z.</p>`,
model:"Hi Diyor,\n\nDid you read the email from Aqua Club? I can't believe they're closing for the whole summer! The free pass to the other branch is nice, but it's an hour away by bus, so it's not really practical. Why don't we try swimming in the lake on weekends instead?\n\nCheers,\nIslom",ml:'B2',
ck:["10 daqiqada yozdim","Uchala talabga javob berdim","45–70 so'z","Uslub boshidan oxirigacha norasmiy","Tekshiruv uchun vaqt qoldi"]}});

L({m:'m3',id:'m3l1',t:'The formal email format',uz:"Rasmiy xat formati: Dear …, Yours …",min:30,
goal:"Task 1.2 ning tuzilmasini, salomlashish va yakun juftliklarini, paragraflar vazifasini bilish.",
th:[
{h:"Task 1.2 nima",b:`<p>Xuddi shu vaziyat bo'yicha endi <b>rasmiy shaxsga</b> — menejer, direktor, tashkilotchi, muharrirga — yozasiz. Ko'pincha bu vaziyatdagi xatni yuborgan odamning o'zi.</p>
<table><tr><th>So'z</th><th>Vaqt</th><th>Uslub</th><th>Daraja</th></tr><tr><td>120–150</td><td>~20 daqiqa</td><td>rasmiy</td><td>B2</td></tr></table>`},
{h:"Salom va yakun juftliklari",b:`<table><tr><th>Salomlashish</th><th>Yakun</th><th>Qachon</th></tr>
<tr><td class="en">Dear Mr Rahimov, / Dear Ms Smith,</td><td class="en">Yours sincerely,</td><td>Ism ma'lum</td></tr>
<tr><td class="en">Dear Sir or Madam,</td><td class="en">Yours faithfully,</td><td>Ism noma'lum</td></tr>
<tr><td class="en">Dear Manager, / Dear Hiring Team,</td><td class="en">Kind regards,</td><td>Zamonaviy neytral</td></tr></table>
<div class="tip">Familiya bilan: <b>Dear Mr Karimov</b> (ism bilan emas: «Dear Mr Aziz» — xato). Ayollar uchun ishonchli variant: <b>Ms</b>.</div>`},
{h:"4 paragrafli tuzilma",b:`<ol><li><b>Maqsad</b> (1–2 gap): nega yozyapsiz. <span class="en">I am writing to express my concern about…</span></li><li><b>Asosiy qism 1</b>: birinchi fikr / muammo + tafsilot.</li><li><b>Asosiy qism 2</b>: ikkinchi fikr / taklif / so'rov.</li><li><b>Yakun</b> (1–2 gap): kutilgan harakat. <span class="en">I would be grateful if you could… I look forward to your reply.</span></li></ol>
<p>So'ng: yakun iborasi + <b>to'liq ism</b> (ism va familiya).</p>`},
{h:"Rasmiy uslubning 5 qoidasi",b:`<ul><li>Qisqartmalar yo'q: <span class="en">I am, do not, cannot</span>.</li><li>Undov yo'q, emoji yo'q.</li><li>Norasmiy so'zlar yo'q: <s>stuff, a lot of, guys, awesome</s>.</li><li>To'g'ridan-to'g'ri buyruq yo'q: <s>Fix it!</s> → <span class="en">I would appreciate it if you could resolve this issue.</span></li><li>Hissiyot muloyim: <s>terrible!!</s> → <span class="en">extremely disappointing</span>.</li></ul>`}],
an:{title:"Namuna: sport zalining yangi ish vaqti",sub:"Vaziyat: zal 20:00 da yopiladigan bo'ldi. Menejerga fikringiz va taklifingizni yozing.",text:"[[Dear Mr Hasanov,]]\n\n[[I am writing in response to your email regarding the new opening hours of Fit Life gym.]]\n\n[[I have been a member for three years, and I am concerned that closing at 8 pm will make it impossible for many working members to attend.]] [[Most of us finish work at six, which leaves very little time for a proper workout.]]\n\n[[I would therefore like to suggest keeping the gym open until 10 pm at least three evenings a week.]] [[Alternatively, you could consider opening earlier at weekends.]]\n\n[[I would be grateful if you could take these suggestions into account.]] [[I look forward to hearing from you.]]\n\n[[Yours sincerely,\nAziz Karimov]]",notes:["Ism ma'lum — Dear Mr + familiya.","1-paragraf: maqsad (in response to your email regarding…).","Kim ekaningiz (a'zolik) — fikringizga og'irlik beradi; muammo muloyim ifodalangan (I am concerned that…).","Muammo tafsiloti, nisbiy gap (which…).","Taklif: I would therefore like to suggest + -ing.","Muqobil taklif: Alternatively, you could consider + -ing.","Kutilgan harakat: I would be grateful if you could…","Standart yakun gapi.","Yours sincerely (Dear Mr … bilan) + to'liq ism. Jami ~125 so'z."]},
ex:[
['m',"You know the manager's name is Ms Brown. How do you start?",["Dear Sir or Madam,","Dear Ms Brown,","Hi Ms Brown,"],1,"Ism ma'lum: <b>Dear Ms Brown,</b>"],
['m',"«Dear Sir or Madam,» goes with…",["Yours sincerely,","Yours faithfully,","Best wishes,"],1,"<b>Yours faithfully</b>"],
['m',"«Dear Mr Tursunov,» goes with…",["Yours sincerely,","Yours faithfully,","Love,"],0,"<b>Yours sincerely</b>"],
['m',"The manager is Jasur Tursunov. How do you start?",["Dear Mr Jasur,","Dear Mr Tursunov,","Dear Jasur Tursunov sir,"],1,"Mr + <b>familiya</b>: Dear Mr Tursunov,"],
['s',[["I am writing to complain about…",0],["Hope you're well!",1],["I would be grateful if you could reply.",0],["Can't wait to hear from you!",1],["Please find attached my CV.",0],["Cheers,",1]],["Rasmiy","Norasmiy"],"Rasmiy xatda faqat chap ustundagilar."],
['o',["State your reason for writing","Explain the first point","Explain the second point","Say what action you expect","Yours sincerely + full name"],"Rasmiy xat tuzilmasi."],
['m',"How do you sign a formal email?",["Your first name only","Your full name","A nickname"],1,"To'liq ism: <b>Aziz Karimov</b>."],
['r',"Rasmiy qiling.","Fix the air conditioning now!",["I would appreciate it if you could fix the air conditioning as soon as possible.","I would be grateful if you could fix the air conditioning as soon as possible.","I would be grateful if you could repair the air conditioning as soon as possible.","I would appreciate it if you could repair the air conditioning as soon as possible.","Could you please fix the air conditioning as soon as possible?","Could you please repair the air conditioning as soon as possible?"],"Buyruq → muloyim iltimos."]],
task:{type:'1.2',w:[120,150],time:20,prompt:`<p><b>Vaziyat:</b> Ingliz tili klubi rahbari Ms Davis barcha a'zolarga yozdi: mashg'ulotlar shanbadan <b>yakshanba soat 9:00 ga</b> ko'chiriladi. U a'zolarning fikrini so'ragan.</p><p>Ms Davis ga xat yozing: <b>o'zgarish haqida fikringizni</b> bildiring, <b>bu sizga qanday ta'sir qilishini</b> tushuntiring va <b>taklif</b> bering. 120–150 so'z.</p>`,
frame:"Dear Ms Davis,\n\nI am writing in response to your email about … .\n\nI have been a member of the club for … . I am concerned that … , because … .\n\nI would therefore like to suggest … . Alternatively, … .\n\nI would be grateful if you could … . I look forward to hearing from you.\n\nYours sincerely,\n[Ism Familiya]",
model:"Dear Ms Davis,\n\nI am writing in response to your email about the new schedule for the English club.\n\nI have been a member of the club for almost a year, and I really value our Saturday sessions. However, I am concerned that moving them to 9 am on Sunday will make it difficult for many members to attend. Personally, I work six days a week, so Sunday morning is the only time I can rest and spend with my family.\n\nI would therefore like to suggest holding the sessions on Sunday afternoon instead. Alternatively, the club could offer an online option for those who cannot come in person.\n\nI would be grateful if you could consider these ideas before making a final decision. I look forward to hearing from you.\n\nYours sincerely,\nZarina Usmonova",ml:'B2',
ck:["Dear Ms Davis, … Yours sincerely, + to'liq ism","1-paragrafda maqsad aytilgan","O'zgarish sizga qanday ta'sir qilishi tushuntirilgan","Aniq taklif (+ muqobil)","Qisqartma va norasmiy so'z yo'q, 120–150 so'z"]}});

L({m:'m3',id:'m3l2',t:'Stating your purpose',uz:"Maqsadni bildirish: birinchi paragraf",min:25,
goal:"Birinchi 1–2 gapda nega yozayotganingizni aniq va rasmiy aytish.",
th:[

task:{type:'1.2',w:[120,150],time:20,prompt:`<p><b>Vaziyat:</b> Shahar kutubxonasi direktori Mr Nazarov xabar berdi: kitob olish muddati <b>1 oydan 1 haftaga</b> qisqartiriladi. U o'quvchilarning fikrini so'ramoqda.</p><p>Mr Nazarov ga xat yozing: <b>bu qaror haqida fikringiz</b>, <b>u kimlarga qiyinchilik tug'dirishi</b> va <b>muqobil yechim</b>. Birinchi paragrafga alohida e'tibor bering. 120–150 so'z.</p>`,
frame:"Dear Mr Nazarov,\n\nI am writing in response to … . As a regular reader … .\n\n… .\n\n… .\n\nI look forward to … .\n\nYours sincerely,\n…",
model:"Dear Mr Nazarov,\n\nI am writing in response to your announcement regarding the new borrowing period. As a regular reader at the city library for over five years, I would like to share my concerns.\n\nIn my view, one week is not enough time to read most books, especially long novels or academic texts. This change will be particularly difficult for students during exam periods and for elderly readers, who often read more slowly.\n\nI understand that the library wants more people to have access to popular books. Therefore, I would suggest keeping the one-week limit only for new and popular titles, while allowing a month for all other books. In addition, an online renewal system would be very helpful.\n\nI hope you will consider these suggestions. I look forward to hearing from you.\n\nYours sincerely,\nKamron Alimov",ml:'B2',
ck:["Birinchi gapda aniq maqsad","Kim ekaningiz qisqa aytilgan","Kimlarga qiyin bo'lishi tushuntirilgan","Muqobil yechim taklif qilingan","To'g'ri yakun, 120–150 so'z"]}});

goal:"Muammoni aniq tasvirlab, ta'sirini tushuntirib, aniq kompensatsiya yoki harakat so'rash.",
th:[
{h:"Shikoyat tuzilmasi",b:`<ol><li><b>Maqsad:</b> nima haqida shikoyat (qachon, qayerda).</li><li><b>Muammo(lar):</b> faktlar — sana, narx, nima bo'lgani.</li><li><b>Ta'sir:</b> bu sizga qanday noqulaylik tug'dirdi.</li><li><b>Talab:</b> nima qilinishini xohlaysiz — pulni qaytarish, almashtirish, uzr, muammoni hal qilish.</li></ol>`},
{h:"Ohang: kuchli, lekin muloyim",b:`<table><tr><th>Juda qo'pol</th><th>Rasmiy-muloyim</th></tr>

task:{type:'1.2',w:[120,150],time:20,prompt:`<p><b>Vaziyat:</b> Siz «Silk Road Tours» kompaniyasi bilan 3 kunlik Buxoro sayohatiga bordingiz. Reklamada «4 yulduzli mehmonxona va gid xizmati» deyilgan edi, lekin mehmonxona oddiy hostel bo'lib chiqdi, gid esa faqat birinchi kuni bo'ldi.</p><p>Kompaniya menejeriga shikoyat xati yozing: <b>nima va'da qilinganini</b>, <b>aslida nima bo'lganini</b>, <b>bu sizga qanday ta'sir qilganini</b> va <b>nima talab qilishingizni</b> yozing. 120–150 so'z.</p>`,
frame:"Dear Sir or Madam,\n\nI am writing to complain about … from … to … .\n\nAccording to your advertisement, … . However, … . To make matters worse, … .\n\nAs a result, … .\n\nI would therefore like to request … . I trust that … .\n\nYours faithfully,\n…",
model:"Dear Sir or Madam,\n\nI am writing to complain about the three-day tour to Bukhara that I took with your company from 14 to 16 September.\n\nAccording to your advertisement, the price included accommodation in a four-star hotel and a professional guide for the whole trip. However, we were taken to a basic hostel with shared bathrooms. To make matters worse, the guide only accompanied us on the first day, so we had to explore the city on our own.\n\nAs a result, the trip was far less enjoyable and informative than I had expected, especially as I had chosen your company because of these promises.\n\nI would therefore like to request a partial refund of at least 40% of the price. I trust that you will deal with this matter promptly.\n\nYours faithfully,\nSherzod Qodirov",ml:'B2',
ck:["Maqsad va aniq sanalar","Va'da va haqiqat taqqoslangan (According to… However…)","Ta'sir tushuntirilgan","Aniq talab (foiz / pul qaytarish)","Ohang muloyim; Dear Sir or Madam ↔ Yours faithfully"]}});

L({m:'m3',id:'m3l4',t:'Requests and enquiries',uz:"So'rov va ma'lumot so'rash: bilvosita savollar",min:30,
goal:"Rasmiy xatda savollarni bilvosita (indirect) shaklda, to'g'ri so'z tartibi bilan berish.",
th:[
{h:"To'g'ridan-to'g'ri savol — norasmiy",b:`<p>«How much is it? When does it start?» — rasmiy xatda qo'pol eshitiladi. Bilvosita savollardan foydalaning.</p>`},
{h:"Bilvosita savol formulasi",b:`<p><b>Kirish iborasi + so'roq so'zi + ega + fe'l</b> (oddiy gap tartibi!)</p>
<table><tr><th>To'g'ridan-to'g'ri</th><th>Bilvosita</th></tr>
<tr><td>When does the course start?</td><td class="en">Could you tell me when the course <b>starts</b>?</td></tr>
<tr><td>How much is it?</td><td class="en">I would like to know how much it <b>is</b>.</td></tr>
<tr><td>Is there parking?</td><td class="en">Could you let me know <b>whether</b> there is parking?</td></tr>
<tr><td>Can I pay by card?</td><td class="en">I was wondering <b>if</b> I could pay by card.</td></tr></table>
<div class="warn">Bilvosita savolda <b>do/does/did</b> ishlatilmaydi va ega fe'ldan oldin turadi: «Could you tell me when <s>does the course start</s>» — xato.</div>`},
{h:"Ha/yo'q savollari: if / whether",b:`<div class="ex">Do you offer discounts? → I would be grateful if you could tell me <b>whether</b> you offer discounts for students.</div>`},
{h:"So'rov iboralari",b:`<div class="ex">I would be grateful if you could send me… · Would it be possible to…? · I would appreciate it if you could… · Could you please provide more information about…?</div>
<div class="tip">Ko'p savol bo'lsa, ularni bir xil iborada boshlamang. Almashtiring: Could you tell me… / I would also like to know… / Finally, I was wondering whether…</div>`}],
ex:[
['r',"Bilvosita savol qiling: «Could you tell me …»","When does the museum open?",["Could you tell me when the museum opens?"],"Ega + fe'l: <b>the museum opens</b>."],

['r',"Bilvosita savol qiling: «Could you let me know whether …»","Is breakfast included?",["Could you let me know whether breakfast is included?"],"Ha/yo'q savol → <b>whether</b>."],

task:{type:'1.2',w:[120,150],time:20,prompt:`<p><b>Vaziyat:</b> «Global Bridge» o'quv markazi yozgi intensiv IELTS kursini e'lon qildi, lekin e'londa jadval, narx va guruh hajmi haqida ma'lumot yo'q.</p><p>Markaz koordinatoriga xat yozing: <b>o'zingizni qisqa tanishtiring</b>, <b>kursga qiziqishingiz sababini</b> ayting va <b>kamida 3 ta savolni bilvosita shaklda</b> bering. 120–150 so'z.</p>`,
frame:"Dear Sir or Madam,\n\nI am writing to enquire about … .\n\nI am … . I am interested in … because … .\n\nCould you tell me … ? I would also like to know … . Finally, I was wondering whether … .\n\nI would be grateful if you could … . I look forward to hearing from you.\n\nYours faithfully,\n…",
model:"Dear Sir or Madam,\n\nI am writing to enquire about the intensive summer IELTS course advertised on your website.\n\nI am a second-year student at Tashkent State University of Economics, and I am planning to apply for a master's programme in the United Kingdom next year. I therefore need to achieve an overall band of 7.0, and I believe an intensive course would help me prepare effectively.\n\nCould you tell me when the course starts and how many hours of classes there are each week? I would also like to know how much the course costs and whether there are any discounts for students. Finally, I was wondering how many students there are in each group.\n\nI would be grateful if you could send me this information at your earliest convenience. I look forward to hearing from you.\n\nYours faithfully,\nMalika Ergasheva",ml:'B2–C1',
ck:["Maqsad birinchi gapda","Qisqa tanishtiruv va sabab","Kamida 3 ta bilvosita savol, to'g'ri so'z tartibi","Kirish iboralari almashtirilgan (Could you… / I would also like… / I was wondering…)","Rasmiy yakun, 120–150 so'z"]}});

task:{type:'1.2',w:[120,150],time:20,prompt:`<p><b>Vaziyat:</b> Kollejingiz ma'muriyati talabalardan kollej oshxonasini yaxshilash bo'yicha takliflar so'radi. Hozir oshxonada navbat uzun, tanlov kam va narxlar qimmat.</p><p>Kollej direktori Mrs Akbarova ga xat yozing: <b>hozirgi muammolarni</b> qisqa tasvirlang va <b>kamida 2 ta taklif</b> bering — har birining <b>foydasini</b> tushuntiring. 120–150 so'z.</p>`,
frame:"Dear Mrs Akbarova,\n\nI am writing in response to … .\n\nAt present, … . In addition, … .\n\nFirstly, I would suggest … . This would … . Another option would be to … , which would … .\n\nI hope … . I look forward to … .\n\nYours sincerely,\n…",
model:"Dear Mrs Akbarova,\n\nI am writing in response to your request for suggestions on how to improve the college canteen.\n\nAt present, the main problem is the long queues at lunchtime, which mean that many students do not have enough time to eat before their next class. In addition, the choice of meals is limited and prices are quite high for students.\n\nFirstly, I would suggest introducing a pre-order system through the college website. This would allow students to collect their meals quickly and reduce queues. Another option would be to offer a cheaper daily set menu, which would make healthy food more affordable. Finally, the canteen could consider adding vegetarian dishes.\n\nI hope these ideas will be useful. I look forward to hearing about any changes.\n\nYours sincerely,\nOtabek Sobirov",ml:'B2',
ck:["Muammolar qisqa va aniq","Kamida 2 ta taklif","Har taklifning foydasi (This would…)","suggest/recommend + -ing to'g'ri","Rasmiy uslub, 120–150 so'z"]}});

L({m:'m3',id:'m3l6',t:'Expressing disagreement politely',uz:"Qarorga muloyim norozilik bildirish",min:30,
goal:"Tashkilot qaroriga qo'shilmaslikni hurmat bilan, dalillar bilan va konstruktiv taklif bilan ifodalash.",
th:[
{h:"Imtihonning eng ko'p uchraydigan Task 1.2 turi",b:`<p>Ko'pincha vaziyat: tashkilot <b>biror qaror qabul qilgan</b> (narx oshdi, xizmat yopildi, qoida o'zgardi) va siz unga rasmiy javob yozasiz. Muvaffaqiyat formulasi: <b>tushunish → xavotir → dalil → taklif</b>.</p>`},
{h:"Yumshatuvchi iboralar (hedging)",b:`<div class="ex">I understand that… / I appreciate that…, however… <br>While I recognise the need to…, I feel that… <br>I am not convinced that this is the best solution. <br>I would respectfully disagree with…</div>
<div class="tip">«I appreciate that the club needs to cover its costs; however…» — avval tashkilot nuqtai nazarini tan olish sizni oqilona va hurmatli ko'rsatadi.</div>`},
{h:"Dalil turlari",b:`<ul><li><b>Shaxsiy tajriba:</b> <span class="en">As a member for three years, I have noticed that…</span></li><li><b>Boshqalar ta'siri:</b> <span class="en">Many students rely on… / This will particularly affect…</span></li><li><b>Mantiqiy oqibat:</b> <span class="en">As a result, the club may lose members.</span></li></ul>`},
{h:"Kuchaytiruvchi va muloyim so'zlar",b:`<p><span class="en">particularly, especially, considerably, significantly</span> — fikrni kuchaytiradi. <span class="en">somewhat, rather, slightly</span> — yumshatadi: <span class="en">The new fee is <b>rather</b> high for students.</span></p>`}],
an:{title:"Tuzilma: tushunish → xavotir → dalil → taklif",text:"Dear Mr Lee,\n\nI am writing regarding your decision to close the college library at weekends.\n\n[[I appreciate that the college needs to reduce costs;]] [[however, I am concerned that this decision will seriously affect students' preparation for exams.]] [[Many of us live in shared flats where it is almost impossible to study quietly, so the library is our only option.]] [[As a result, I believe exam results may fall.]]\n\n[[Instead, would it be possible to open the library on Saturdays only, perhaps with volunteer staff?]]\n\nI would be grateful if you could reconsider this decision.\n\nYours sincerely,\nNodira Hamidova",notes:["Tushunish: tashkilot nuqtai nazarini tan olish.","Xavotir: muloyim, lekin aniq.","Dalil: boshqalarga ta'siri, aniq vaziyat.","Mantiqiy oqibat: As a result…","Konstruktiv taklif: bilvosita savol shaklida."]},
ex:[
['m',"Which opening of a disagreement is most polite?",["Your decision is stupid.","I appreciate that you need to cut costs; however, …","You are wrong."],1,"Avval tushunish."],
['f',"While I ___ the need to save money, I feel this is unfair. (tan olmoq)",["recognise","recognize","understand","appreciate"],"<b>While I recognise…</b>"],
['m',"I am not ___ that this is the best solution.",["convinced","convincing","convince"],0,"<b>I am not convinced that…</b>"],
['m',"Which word softens criticism?",["extremely","rather","totally"],1,"<b>rather</b> — biroz, ancha (yumshoq)."],
['o',["I understand that the club needs more money;","however, I feel that","the new fee is too high for students,","many of whom have part-time jobs."],"Tushunish → xavotir → dalil."],
['m',"What should follow your disagreement?",["Nothing","A constructive suggestion","A threat"],1,"Konstruktiv taklif."],
['x',"I am not agree with your decision.",["I do not agree with your decision.","I disagree with your decision."],"<b>I do not agree / I disagree</b> (rasmiyda qisqartmasiz)."],
['m',"This change will ___ affect elderly members.",["particularly","particular","particularity"],0,"Ravish: <b>particularly</b>."]],
task:{type:'1.2',w:[120,150],time:20,prompt:`<p><b>Vaziyat:</b> «Green City» sport majmuasi menejeri Mr Saidov a'zolarga xat yubordi: <b>suzish havzasi</b> ertalabki soatlarda faqat <b>professional sportchilar</b> uchun ochiq bo'ladi; oddiy a'zolar faqat soat 14:00 dan keyin suzishi mumkin.</p><p>Mr Saidov ga xat yozing: <b>qarorga munosabatingizni</b> bildiring, <b>bu kimlarga qiyinchilik tug'dirishini</b> tushuntiring va <b>murosali yechim</b> taklif qiling. 120–150 so'z.</p>`,
model:"Dear Mr Saidov,\n\nI am writing in response to your email regarding the new swimming pool timetable.\n\nI appreciate that professional athletes need quiet time to train; however, I am concerned that this decision is unfair to ordinary members. Many of us work or study during the day, so early morning is the only time we can swim. This change will particularly affect office workers and university students, who cannot come in the afternoon. As a result, the centre may lose a significant number of members.\n\nI would therefore like to suggest a compromise. Perhaps the pool could be divided, with three lanes reserved for athletes and the remaining lanes open to everyone. Alternatively, professional training could take place between 6 and 8 am only.\n\nI would be grateful if you could reconsider this decision.\n\nYours sincerely,\nDilshod Rahmonov",ml:'B2–C1',
ck:["Tashkilot nuqtai nazari tan olingan (I appreciate that…; however…)","Kimlarga ta'sir qilishi aniq","Mantiqiy oqibat (As a result…)","Murosali taklif","Muloyim, rasmiy uslub; 120–150 so'z"]}});

task:{type:'1.2',w:[120,150],time:20,prompt:`<p><b>Vaziyat:</b> Xalqaro yoshlar forumi Toshkentda bo'lib o'tadi va tashkilotchilar <b>ingliz tilini biladigan ko'ngilli yordamchilar</b> qidirmoqda. Vazifalar: mehmonlarni kutib olish, yo'l ko'rsatish, ro'yxatdan o'tkazish.</p><p>Tashkiliy qo'mitaga ariza yozing: <b>o'zingiz haqingizda</b>, <b>nega bu ishga mos ekaningiz</b> (tajriba va fazilatlar, isbot bilan) va <b>qachon bo'sh ekaningiz</b>. 120–150 so'z.</p>`,
model:"Dear Sir or Madam,\n\nI am writing to apply for a volunteer position at the International Youth Forum, which I saw advertised on your website.\n\nI am a third-year student of tourism at Silk Road University, and I have a good command of English, Russian and Uzbek. I believe I would be a suitable candidate for several reasons. Firstly, I have experience of working with international visitors: last summer, I worked as a volunteer guide in Samarkand, where I helped groups of tourists every day. In addition, I am well organised and calm under pressure, as I regularly help to run registration at university conferences.\n\nI am available for the whole week of the forum and would be happy to attend any training sessions beforehand.\n\nThank you for considering my application. I look forward to hearing from you.\n\nYours faithfully,\nShahnoza Yusupova",ml:'B2',
ck:["Maqsad + e'lon qayerda ko'ringani","O'qish/ish va tillar","Kamida 2 fazilat, har biri isbot bilan","Mavjudlik (qachon bo'shsiz)","Rasmiy yakun, 120–150 so'z"]}});

task:{type:'1.2',w:[120,150],time:20,prompt:`<p>Quyidagi norasmiy xatni <b>rasmiy xatga</b> aylantiring (120–150 so'z). Kamida <b>6 ta so'z almashtirish</b>, <b>1 ta passiv</b> va <b>1 ta nominalizatsiya</b> ishlating. Kerak bo'lsa, tafsilot qo'shing.</p><p><i>«Hi! I bought a washing machine from your shop last month and it broke after two weeks. I phoned you three times but nobody helped me. I need it fixed right away or I want my money back. Also your guys didn't tell me about the warranty. This is really bad! Thanks.»</i></p>`,
model:"Dear Sir or Madam,\n\nI am writing to complain about a washing machine which I purchased from your store on 3 October.\n\nUnfortunately, the machine stopped working after only two weeks. I have contacted your customer service department on three occasions; however, I have not received any assistance. Furthermore, I was not informed about the warranty conditions at the time of purchase, which I consider unacceptable.\n\nThe failure of the machine has caused me considerable inconvenience, as I have a young family and require it every day. I would therefore be grateful if you could arrange for the machine to be repaired immediately. If this is not possible, I would like to request a full refund.\n\nI trust that you will resolve this matter promptly. I look forward to your reply.\n\nYours faithfully,\nFarrukh Ismoilov",ml:'B2–C1',mnote:"Almashtirishlar: bought → purchased, phoned → contacted, helped → assistance, didn't tell → was not informed (passiv), need → require, right away → immediately, money back → refund, bad → unacceptable. Nominalizatsiya: «The failure of the machine…»",
ck:["Kamida 6 ta so'z almashtirildi","Passiv bor (was not informed…)","Nominalizatsiya bor (The failure of…)","Barcha ma'lumotlar saqlangan","Rasmiy format, 120–150 so'z"]}});

task:{type:'1.2',w:[120,150],time:25,prompt:`<p><b>Vaziyat:</b> Siz qatnashadigan «Smart Kids» robototexnika to'garagi (ukangiz uchun) rahbari Mr Holmatov ota-onalarga xat yubordi: <b>to'garak narxi 2 barobar oshadi</b>, lekin endi darslar haftasiga 2 emas, 3 marta bo'ladi.</p><p>Avval o'zingiz uchun do'stingizga ~50 so'zli xatni (Task 1.1) xayolan rejalang. So'ng <b>Mr Holmatov ga rasmiy xat</b> yozing: <b>o'zgarish haqida fikringiz</b>, <b>oilalar uchun ta'siri</b> va <b>taklifingiz</b>. 120–150 so'z.</p>`,
model:"Dear Mr Holmatov,\n\nI am writing in response to your letter regarding the changes to the Smart Kids robotics club.\n\nMy younger brother has attended the club for a year and has made excellent progress, so I appreciate the decision to offer an extra lesson each week. However, I am concerned that doubling the fee will make the club unaffordable for many families, particularly those with more than one child. As a result, some talented children may have to leave.\n\nI would therefore like to suggest offering parents a choice between the current two-lesson plan and the new three-lesson plan. Alternatively, the club could introduce a discount for siblings or for families who pay for a whole term in advance.\n\nI hope you will consider these options. I look forward to hearing from you.\n\nYours sincerely,\nJamshid Normatov",ml:'B2–C1',
ck:["Ijobiy tomon tan olingan","Oilalarga ta'siri aniq","Konstruktiv taklif (+ muqobil)","Uslub to'liq rasmiy","120–150 so'z"]}});

task:{type:'1.2',w:[120,150],time:20,prompt:`<p><b>Imtihon sharoiti — taymerni 20 daqiqaga qo'ying!</b></p><p><b>Vaziyat:</b> «City Express» avtobus kompaniyasi xabar berdi: universitet yonidagi bekatdan o'tadigan <b>№45 yo'nalish yopiladi</b>. Talabalarga boshqa yo'nalishdan foydalanish taklif qilindi, lekin u bekat universitetdan 2 km uzoqda.</p><p>Kompaniya menejeriga xat yozing: <b>qaror haqida fikringiz</b>, <b>talabalar uchun oqibatlari</b> va <b>takliflaringiz</b>. 120–150 so'z.</p>`,
model:"Dear Sir or Madam,\n\nI am writing to express my concern about your decision to cancel bus route 45, which serves the area around the National University.\n\nWhile I appreciate that some routes may not be profitable, I believe this decision will cause serious problems for thousands of students. The nearest alternative stop is two kilometres from the campus, which means a long walk in all weather conditions. Not only will students arrive late for morning lectures, but many may also feel unsafe walking back after evening classes.\n\nI would therefore like to suggest keeping route 45 during peak hours only, for example from 7 to 10 am and from 5 to 8 pm. Alternatively, the company could extend another route to pass the university.\n\nI would be grateful if you could reconsider this decision.\n\nYours faithfully,\nAkmal Bakirov",ml:'C1',
ck:["20 daqiqada yozdim","Fikr + oqibatlar + taklif — uchalasi bor","Kamida bitta «ball oshiruvchi» tuzilma","Salom ↔ yakun to'g'ri","120–150 so'z"]}});

L({m:'m4',id:'m4l1',t:'Meet Part 2',uz:"Part 2 bilan tanishuv: forum posti va insho",min:30,
goal:"Part 2 formati, C1 darajasidan nima kutilishi va 4 paragrafli tuzilmani tushunish.",
th:[
{h:"Part 2 nima",b:`<p>Part 2 da sizga <b>umumiy ijtimoiy mavzu</b> bo'yicha savol beriladi (ta'lim, texnologiya, atrof-muhit, shahar hayoti, sog'liq, ish, oila…). Siz <b>onlayn muhokamada post</b> (yoki insho) yozasiz: fikringizni bildirasiz va asoslaysiz.</p>
<table><tr><th>So'z</th><th>Vaqt</th><th>Uslub</th><th>Daraja</th></tr><tr><td>180–200</td><td>~30 daqiqa</td><td>neytral-rasmiy, akademik</td><td>C1</td></tr></table>
<div class="ex">You are taking part in an online discussion about technology. Write your post answering the question: <b>«Should children under 12 be allowed to have smartphones?»</b> Give reasons and examples. Write 180–200 words.</div>`},
{h:"4 paragrafli tuzilma",b:`<ol><li><b>Kirish</b> (~35 so'z): mavzuni o'z so'zlaringiz bilan qayta ayting + <b>aniq pozitsiya</b>.</li><li><b>Asosiy 1</b> (~65 so'z): 1-dalil → tushuntirish → misol.</li><li><b>Asosiy 2</b> (~65 so'z): 2-dalil (yoki qarama-qarshi fikr va unga javob) → misol.</li><li><b>Xulosa</b> (~30 so'z): pozitsiyani boshqa so'zlar bilan takrorlash + yakuniy fikr.</li></ol>`},
{h:"C1 darajasi nimani anglatadi",b:`<ul><li><b>Aniq pozitsiya</b> boshidan oxirigacha, ziddiyatsiz.</li><li><b>Rivojlangan dalillar</b>: faqat «because it is good» emas — sabab → oqibat → misol.</li><li><b>Xilma-xil bog'lovchilar</b> va mantiqiy o'tishlar.</li><li><b>Akademik lug'at</b>: <span class="en">significant, beneficial, inevitable, consequently</span>.</li><li><b>Murakkab grammatika</b>: shart gaplar, passiv, nisbiy gaplar — xatosiz.</li></ul>`},
{h:"Forum posti ≠ xat",b:`<p>Part 2 da «Dear…» yoki «Yours sincerely» <b>yozilmaydi</b>. To'g'ridan-to'g'ri mavzudan boshlang. Qisqartmalardan qoching — uslub neytral-rasmiy bo'lsin.</p>
<div class="warn">Imtihonda eng katta xato — savolning faqat bir qismiga javob berish. «Do you agree? <b>What can be done?</b>» kabi ikki qismli savollarda ikkala qismga ham javob bering.</div>`}],
an:{title:"Namuna post anatomiyasi",sub:"Savol: Should children under 12 be allowed to have smartphones?",text:"[[The question of whether young children should own smartphones divides many parents.]] [[In my view, children under twelve should not have their own smartphones, although limited supervised use can be beneficial.]]\n\n[[The main reason is that smartphones can seriously harm children's development.]] [[Spending hours on games and social media reduces the time they spend reading, playing outside and talking to family.]] [[For example, many teachers in Tashkent report that pupils who use phones late at night struggle to concentrate in class.]]\n\n[[Admittedly, phones help parents stay in touch with their children.]] [[However, a basic phone without internet access would achieve this goal without the risks.]]\n\n[[In conclusion, I believe the disadvantages of giving young children smartphones clearly outweigh the benefits.]] [[Parents should wait until their children are mature enough to use technology responsibly.]]",notes:["Mavzuni o'z so'zlari bilan aytish (paraphrase).","Aniq pozitsiya + nozik qo'shimcha (although…) — C1 belgisi.","1-dalilning asosiy gapi.","Tushuntirish: qanday zarar.","Aniq, real misol — mahalliy kontekst.","Qarama-qarshi fikrni tan olish (Admittedly…).","Unga javob (rebuttal) — pozitsiyani mustahkamlaydi.","Xulosa: pozitsiya boshqa so'zlar bilan.","Yakuniy tavsiya. Jami ~150 so'z (imtihonda 180–200 kerak)."]},

['m',"The question is: «Is tourism good for local communities? What can be done to reduce its negative effects?» How many parts must you answer?",["One","Two","Three"],1,"① yaxshimi? ② nima qilish mumkin?"],
['m',"Which is the best example sentence?",["Many people think so.","For instance, after the new metro line opened in Tashkent, traffic on Amir Temur Street decreased.","Examples are everywhere."],1,"Aniq, real misol."],
