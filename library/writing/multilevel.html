{h:"3 bosqichli tahrir",b:`<ol><li><b>Katta rasm</b> (1 daq): Har talabga javob bormi? Pozitsiya izchilmi? Paragraflar mantiqiymi?</li><li><b>Gap darajasi</b> (1–2 daq): Har gapda ega va kesim bormi? Comma splice? Juda uzun gaplar?</li><li><b>So'z darajasi</b> (1–2 daq): shaxsiy xatolar ro'yxatingiz bo'yicha.</li></ol>`},
{h:"Shaxsiy xatolar ro'yxati",b:`<p>Har bir o'quvchi bir xil xatolarni takrorlaydi. O'zingiznikini bilib, ularni maqsadli qidiring. Eng keng tarqalganlari:</p><table><tr><th>Tur</th><th>Tekshiring</th></tr><tr><td>Artikl</td><td>Birlikdagi sanaladigan ot oldida a/an/the bormi?</td></tr><tr><td>3-shaxs -s</td><td>he/she/it, the government, everyone + fe'l<b>s</b></td></tr><tr><td>Ko'plik</td><td>many/several/a number of + ko'plik</td></tr><tr><td>Sanalmaydigan</td><td>information, advice, research — -s siz</td></tr><tr><td>Zamon</td><td>Aniq o'tgan vaqt → Past Simple</td></tr><tr><td>Predlog</td><td>interested in, depend on, discuss (—)</td></tr><tr><td>Imlo</td><td>government, environment, necessary, which, their/there</td></tr></table>`},
{h:"Imlosi qiyin 20 so'z",b:`<div class="ex">accommodation · government · environment · necessary · definitely · beginning · recommend · business · separate · successful · believe · receive · advertisement · opportunity · responsibility · committee · occurred · different · knowledge · tomorrow</div>`}],
ex:[
['x',"The government have to solve this problems.",["The government has to solve these problems.","The government has to solve this problem."],"Birlik/ko'plik moslashuvi."],
['x',"I am interested on learn new languages.",["I am interested in learning new languages."],"<b>interested in + -ing</b>"],
['m',"Correct spelling:",["goverment","government","govermant"],1,"<b>government</b>"],
['m',"Correct spelling:",["neccessary","necessary","necesary"],1,"<b>necessary</b> (bitta c, ikkita s)"],
['x',"Everyone want a good job.",["Everyone wants a good job."],"«Everyone» — birlik: <b>wants</b>."],
['x',"Many student have part-time job.",["Many students have part-time jobs.","Many students have a part-time job."],"many + ko'plik."],
['m',"Correct spelling:",["recieve","receive","receeve"],1,"<b>receive</b> (c dan keyin ei)"],
['x',"There are a lot of researches about this topic.",["There is a lot of research on this topic.","There is a lot of research about this topic."],"«research» — sanalmaydi."],
['m',"What should you check FIRST when editing?",["Spelling of difficult words","Whether every point of the task is answered","Commas"],1,"Katta rasmdan boshlang."]],
task:{type:'p2',w:[180,200],time:20,prompt:`<p>Quyidagi postda <b>12 ta xato</b> bor (grammatika, imlo, tinish belgilari, uslub). Uni tahrirlab, to'liq qayta yozing (180–200 so'z). Kerak bo'lsa, gaplarni yaxshilang.</p><p><i>«Nowadays a lot of people thinks that children spend too much time on video games. In my opinion this is true, but games also have some advantages.<br><br>Firstly, games can be harmful for health. Children who plays for many hours dont move enough, and this can lead to serious problems. For example my neighbour's son plays every day after school and he has problem with his eyes. Also, games can be addictive and children forget about there homework.<br><br>On the other hand, some games are useful. They can improve logical thinking and teach children to work in team. Moreover many games are in English, so children learns new words.<br><br>In conclusion, I am agree that children spend too much time on games. Parents should control the time, but they should not ban games completely becouse some games are educational.»</i></p>`,
model:"Nowadays, many people think that children spend too much time playing video games. In my opinion, this is true, although games also have some advantages.\n\nFirstly, games can be harmful to health. Children who play for many hours do not move enough, and this can lead to serious problems such as obesity and poor eyesight. For example, my neighbour's son plays every day after school, and he now has problems with his eyes. In addition, games can be addictive, and children often forget about their homework, which affects their results at school.\n\nOn the other hand, some games are genuinely useful. They can improve logical thinking and teach children to work in a team. Moreover, many games are in English, so children learn new words without even noticing. A number of teachers even use educational games in their lessons to make learning more enjoyable.\n\nIn conclusion, I agree that children spend too much time on games. Parents should limit their screen time, but they should not ban games completely, because some of them are educational and can help children develop important skills for the future.",ml:'C1',mnote:"Asosiy tuzatishlar: thinks → think; Nowadays, (vergul); harmful to; plays → play; dont → do not; problem → problems; For example, ; Also → In addition (uslub); there → their; in a team; learns → learn; I am agree → I agree; becouse → because.",
ck:["Grammatik xatolar tuzatildi (thinks, plays, learns, I am agree)","Imlo (their, because, do not)","Tinish belgilari (Nowadays, / For example, / Moreover,)","Uslub yaxshilandi (Also → In addition)","180–200 so'z, 4 paragraf"]}});

task:{type:'p2',w:[180,200],time:30,prompt:`<p><b>Yakuniy mashq.</b> Bu darsni tugatgach, <b>Mock imtihonlar</b> bo'limida birinchi to'liq 60 daqiqalik imtihonni ishlang. Hozir esa Part 2 ni 28 daqiqada yozing:</p><p>You are taking part in an online discussion about society. Write your post answering the question:</p><p><b>«Many older people live alone, far from their families. Why is this happening, and what can be done to help them?»</b></p><p>Write <b>180–200 words</b>.</p>`,
model:"In many countries, including Uzbekistan, a growing number of elderly people now live alone. In my view, this trend is mainly caused by economic changes, but both families and communities can do a great deal to support older people.\n\nThe main reason is migration for work. Young people increasingly move to big cities or abroad in search of better salaries, while their parents prefer to stay in their home towns. In addition, modern flats are often too small for three generations to live together comfortably. As a result, many pensioners spend most of their days without company, which can lead to loneliness and health problems.\n\nSeveral measures could improve the situation. Firstly, families should stay in regular contact through video calls and visit as often as possible. Secondly, local authorities could open day centres where older people can meet, exercise and learn new skills, such as using smartphones. For example, some mahallas already organise weekly gatherings for pensioners, and these have proved very popular.\n\nIn conclusion, although economic pressures separate many families, a combination of personal effort and community support can ensure that older people do not feel forgotten.",ml:'C1',
ck:["28 daqiqada yozdim","Ikkala savol qismiga javob (nega + nima qilish kerak)","Har asosiy paragrafda misol","Pozitsiya va xulosa izchil","180–200 so'z"]}});

t11:`<p><b>Task 1.1.</b> Your friend is also a member of the library. Write a letter to your friend. Write about your feelings and what you think about the changes. Write about <b>50 words</b>.</p>`,
t12:`<p><b>Task 1.2.</b> Write a letter to the manager. Say how the changes will affect you and other members, and suggest what the library could do instead. Write <b>120–150 words</b>.</p>`,
p2:`<p><b>Part 2.</b> You are taking part in an online discussion. Write your post answering the question:</p><p><b>«Some people think that printed books will disappear in the future. Do you agree?»</b></p><p>Give reasons and examples. Write <b>180–200 words</b>.</p>`,
m11:"Hi Aziza,\n\nHave you seen the email from the library? I can't believe it's going to be closed at weekends! Saturday is the only day I can go there. And now we have to pay too, although at least students get a discount. Shall we write to the manager together?\n\nLove,\nMadina",
m12:"Dear Ms Bennett,\n\nI am writing in response to your email regarding the changes to the library's opening hours and fees.\n\nI understand that the library is facing financial difficulties; however, I am concerned that closing at weekends will prevent many members from using it. Most working adults and school pupils are busy on weekdays, so Saturday and Sunday are the only days they can visit. As a result, the number of readers may fall significantly.\n\nInstead of closing at weekends, I would suggest opening on Saturdays and closing on one weekday, such as Monday, when the library is usually quiet. In addition, the library could raise money by renting out its meeting rooms or organising paid workshops.\n\nI would be grateful if you could consider these suggestions. I look forward to hearing from you.\n\nYours sincerely,\nMadina Rakhimova",
mp2:"With the rapid growth of e-books and audiobooks, some people predict that printed books will soon become a thing of the past. However, I strongly disagree with this view, as paper books offer advantages that digital formats cannot replace.\n\nThe main reason is that many readers simply prefer the physical experience of reading. Holding a book, turning its pages and seeing it on a shelf create a personal connection that a screen cannot provide. Moreover, reading on paper is less tiring for the eyes and helps people concentrate without notifications. For example, sales of printed books in bookshops across Tashkent have remained stable, and new bookshops with cafés have become popular meeting places for young people.\n\nAdmittedly, e-books are cheaper and more convenient for travelling, since hundreds of titles can be stored on one device. Nevertheless, this convenience is more likely to make digital and printed books exist side by side than to replace paper entirely, just as radio survived the arrival of television.\n\nIn conclusion, although digital reading will continue to grow, I am convinced that printed books will remain an important part of our culture for many years to come."});

MK({t:'Language school goes online',
sit:`<span class="from">From: Mr David Clarke, Director, Bright Future Language School · Subject: New online format</span>Dear Students,

We are pleased to announce that from next term all our evening courses will take place online via video calls. The fee will stay the same, but students will no longer need to travel to the school. Speaking clubs and exams will also be held online.

If you have any questions or comments, please let us know.

David Clarke`,
t11:`<p><b>Task 1.1.</b> Your friend studies in the same evening group. Write a letter to your friend. Write about your feelings about the news and what you are going to do. Write about <b>50 words</b>.</p>`,
t12:`<p><b>Task 1.2.</b> Write a letter to the director. Give your opinion about the new format, explain any problems it may cause, and make suggestions. Write <b>120–150 words</b>.</p>`,
p2:`<p><b>Part 2.</b> You are taking part in an online discussion about education. Write your post answering the question:</p><p><b>«Is online learning as effective as learning in a classroom?»</b></p><p>Give reasons and examples. Write <b>180–200 words</b>.</p>`,
m11:"Hi Jasur,\n\nDid you get the email from the school? All our evening classes are going online! I'm not very happy because I learn much better face to face, and my internet at home is quite slow. I think I'll ask if we can keep one classroom lesson a week. What about you?\n\nBest,\nOtabek",
m12:"Dear Mr Clarke,\n\nI am writing in response to your email about moving all evening courses online.\n\nAlthough I appreciate that online lessons will save students travelling time, I have some concerns about the new format. Firstly, speaking practice is much less effective on video calls, as only one person can talk at a time and connection problems often interrupt conversations. Secondly, not all students have a reliable internet connection or a quiet place to study at home.\n\nFurthermore, since the fee will remain the same while the school's costs will be lower, I believe a small reduction would be fair.\n\nI would therefore like to suggest a mixed format, with two online lessons and one classroom lesson each week. In addition, it would be helpful if exams could still be taken at the school.\n\nI look forward to hearing from you.\n\nYours sincerely,\nOtabek Yusupov",
mp2:"Since the pandemic, online learning has become a normal part of education around the world. While it offers clear benefits, I believe it is not yet as effective as traditional classroom teaching for most learners.\n\nThe main reason is that face-to-face lessons create better conditions for concentration and interaction. In a classroom, teachers can immediately see when students are confused and adapt their explanations. Online, however, many students switch off their cameras and become distracted by their phones or social media. For example, many teachers in Uzbekistan reported that pupils' results fell during the period of distance learning, especially among younger children.\n\nAdmittedly, online courses have made education more accessible. Students in remote villages can now attend lessons given by excellent teachers in Tashkent or even abroad, and working adults can study at times that suit them. Nevertheless, these benefits mainly apply to motivated, independent learners rather than to the majority of students.\n\nIn conclusion, although online learning is a valuable tool, I am convinced that it cannot fully replace the classroom. The most effective approach is probably a combination of both, using technology to support face-to-face teaching rather than to replace it."});

MK({t:'Football club ticket prices',
sit:`<span class="from">From: Mr Rustam Aliev, Commercial Director, FC Samarkand Lions · Subject: New season ticket prices</span>Dear Supporters,

Next season, the price of a season ticket will increase from 600,000 to 1,000,000 sum. The student discount will no longer be available. The extra money will be used to buy new players and to improve the stadium's seats and lighting.

We hope you will continue to support the team.

Rustam Aliev`,
t11:`<p><b>Task 1.1.</b> Your friend goes to all the home matches with you. Write a letter to your friend. Write about your feelings and what you plan to do next season. Write about <b>50 words</b>.</p>`,
t12:`<p><b>Task 1.2.</b> Write a letter to the commercial director. Give your opinion about the changes, explain how they will affect supporters, and suggest alternatives. Write <b>120–150 words</b>.</p>`,
p2:`<p><b>Part 2.</b> You are taking part in an online discussion about cities. Write your post answering the question:</p><p><b>«Should local governments spend money on big sports stadiums or on public parks and sports grounds?»</b></p><p>Give reasons and examples. Write <b>180–200 words</b>.</p>`,
m11:"Hi Sardor,\n\nHave you seen the new season ticket prices? A million sum, and no student discount any more! I'm really annoyed because we've supported the Lions for years. I think I'll just buy tickets for the big matches next season. Or shall we watch the others at the café?\n\nCheers,\nBekzod",
m12:"Dear Mr Aliev,\n\nI am writing to express my concern about the new season ticket prices announced in your recent email.\n\nI have been a season ticket holder for five years, and I understand that the club needs money to compete at a higher level. However, increasing the price by more than 60% and removing the student discount will make matches unaffordable for many loyal supporters, particularly students and young families. As a result, the stadium may be half empty, which would harm both the atmosphere and the club's income.\n\nI would therefore like to suggest keeping a reduced price for students and children. Alternatively, the club could introduce a cheaper ticket for seats behind the goals, or allow supporters to pay in monthly instalments.\n\nI hope you will reconsider this decision. I look forward to your reply.\n\nYours sincerely,\nBekzod Hamroev",
mp2:"Local authorities often have to choose between investing in large stadiums and creating smaller sports facilities for everyday use. In my view, public parks and local sports grounds should be the priority, as they benefit a far greater number of people.\n\nThe main reason is that neighbourhood facilities encourage regular physical activity among ordinary citizens. A stadium is used by professional players a few times a month, while a park with running tracks and outdoor gyms can be used every day by children, adults and pensioners. As a result, more people exercise, which in turn reduces health problems such as obesity and heart disease. For example, the new walking paths and sports grounds in several Tashkent districts are crowded every morning and evening.\n\nAdmittedly, big stadiums bring prestige and can attract international events, which create jobs and income from tourism. However, these benefits are often short-term, and many stadiums built for major tournaments around the world now stand empty.\n\nIn conclusion, although stadiums have their place, I firmly believe that public money should first be spent on facilities that improve the health and quality of life of the whole community."});

MK({t:'Hotel feedback',
sit:`<span class="from">From: Ms Kamila Saidova, Guest Relations Manager, Grand Silk Hotel, Bukhara · Subject: Your recent stay</span>Dear Guest,

Thank you for staying at the Grand Silk Hotel last weekend. We are always trying to improve our service, so we would be grateful if you could tell us about your experience: your room, our restaurant and our staff.

As a thank-you, all guests who reply will receive a 15% discount on their next stay.

Kamila Saidova`,
t11:`<p><b>Task 1.1.</b> Your friend is planning a trip to Bukhara and asked you about the hotel. Write a letter to your friend. Tell them what you liked and what you didn't like, and whether you recommend the hotel. Write about <b>50 words</b>.</p>`,
t12:`<p><b>Task 1.2.</b> Write a letter to the guest relations manager. Describe your experience (both positive and negative), and suggest how the hotel could improve. Write <b>120–150 words</b>.</p>`,
p2:`<p><b>Part 2.</b> You are taking part in an online discussion about travel. Write your post answering the question:</p><p><b>«Is tourism more harmful than beneficial for historic cities?»</b></p><p>Give reasons and examples. Write <b>180–200 words</b>.</p>`,
m11:"Hi Nodira,\n\nYou asked about the Grand Silk Hotel. The location is perfect, just five minutes from the old city, and the breakfast was amazing! The only problem was the noisy air conditioning in our room. So yes, I'd recommend it, but ask for a quiet room when you book.\n\nHave a great trip!\nLola",
m12:"Dear Ms Saidova,\n\nThank you for your email. I am writing to share my feedback on my stay at the Grand Silk Hotel from 12 to 14 October.\n\nOverall, I was very satisfied with my visit. The hotel's location is excellent, and the receptionists were extremely friendly and helpful, especially when we needed advice about local restaurants. The breakfast buffet was also of excellent quality.\n\nHowever, there were a few problems. The air conditioning in my room was so noisy that it was difficult to sleep, and the Wi-Fi connection was extremely weak on the third floor. In addition, the restaurant closed at 9 pm, which is rather early for tourists returning from sightseeing.\n\nI would suggest checking the air conditioning units regularly and installing additional Wi-Fi routers. It might also be a good idea to keep the restaurant open later during the tourist season.\n\nYours sincerely,\nLola Karimova",
mp2:"Historic cities such as Bukhara, Venice and Kyoto attract millions of visitors every year. Although mass tourism creates some serious problems, I believe that, if it is managed properly, its benefits are greater than its harms.\n\nAdmittedly, large numbers of tourists can damage ancient buildings and change the character of old neighbourhoods. Crowds wear down historic streets, and in some cities local residents are forced to move out as homes are turned into hotels and souvenir shops. As a result, the old town may start to feel like a museum rather than a living community.\n\nHowever, tourism also provides the money that is needed to protect historic sites. Entrance fees and taxes from hotels pay for restoration work that local governments could not otherwise afford. Moreover, tourism creates thousands of jobs for local people, from guides and drivers to traditional craftsmen. For example, in Bukhara many families earn a living by producing and selling handmade carpets, ceramics and embroidery to visitors.\n\nIn conclusion, while uncontrolled tourism can harm historic cities, I am convinced that its economic and cultural benefits outweigh the drawbacks. The key is to limit visitor numbers and invest tourism income back into preservation."});

MK({t:'Four-day working week',
sit:`<span class="from">From: Ms Dilfuza Nurmatova, HR Manager, TechNova LLC · Subject: Trial of a new working schedule</span>Dear Colleagues,

From next month, the company will test a four-day working week for three months. Employees will work from Monday to Thursday, ten hours a day, instead of five eight-hour days. Salaries will not change. At the end of the trial, we will decide whether to continue.

Please send us your views before the trial begins.

Dilfuza Nurmatova`,
t11:`<p><b>Task 1.1.</b> Your friend also works at TechNova. Write a letter to your friend. Write about your feelings about the trial and how you will spend your extra day off. Write about <b>50 words</b>.</p>`,
t12:`<p><b>Task 1.2.</b> Write a letter to the HR manager. Give your opinion about the new schedule, mention any possible problems, and make suggestions for the trial. Write <b>120–150 words</b>.</p>`,
p2:`<p><b>Part 2.</b> You are taking part in an online discussion about work. Write your post answering the question:</p><p><b>«Should the standard working week be shortened to four days?»</b></p><p>Give reasons and examples. Write <b>180–200 words</b>.</p>`,
m11:"Hi Kamol,\n\nHave you read the email about the four-day week? I'm so excited! Ten-hour days will be tiring, but a three-day weekend sounds amazing. I'm going to use my Fridays for my driving lessons and visiting my parents in Jizzakh. Shall we go hiking one Friday?\n\nBest,\nAnvar",
m12:"Dear Ms Nurmatova,\n\nI am writing in response to your email regarding the trial of a four-day working week.\n\nI strongly support the idea of testing a new schedule, as a longer weekend would give employees more time to rest and spend with their families. I believe this could improve motivation and productivity.\n\nHowever, I am concerned that ten-hour working days may be exhausting, particularly for colleagues with long journeys to the office or young children to collect from school. In addition, clients may expect us to be available on Fridays.\n\nI would therefore like to suggest offering flexible start times during the trial, so that employees can choose to work from 8 am to 6 pm or from 9 am to 7 pm. It might also be a good idea to organise a team that answers urgent client requests on Fridays on a rotating basis.\n\nYours sincerely,\nAnvar Tursunov",
mp2:"In recent years, several companies around the world have experimented with a four-day working week. In my opinion, this model should become the standard, as it benefits both employees and employers.\n\nThe main reason is that shorter weeks improve workers' health and wellbeing. With three days off, employees have more time to rest, exercise and spend with their families. As a result, they return to work with more energy and are less likely to suffer from stress or burnout. For example, companies that took part in a large trial in the United Kingdom reported that staff took fewer sick days and felt more satisfied with their jobs.\n\nCritics argue that a four-day week would reduce productivity and harm the economy. However, evidence suggests the opposite: when people have less time, they tend to work more efficiently and waste less time in unnecessary meetings. Moreover, companies can save money on electricity and office costs.\n\nIn conclusion, although the four-day week may not suit every profession, such as healthcare, I am convinced that it should be introduced wherever possible. Governments and businesses should work together to test it carefully and adapt it to different industries."});

MK({t:'Student exchange cancelled',
sit:`<span class="from">From: Dr Anna Weber, International Office, Westbridge College · Subject: Spring exchange programme</span>Dear Students,

Unfortunately, the two-week spring exchange trip to our partner college in Germany has been cancelled because of rising travel costs. Instead, we will organise a virtual exchange: weekly online meetings with German students for two months. Students who have already paid the deposit will receive a full refund.

Dr Anna Weber`,
t11:`<p><b>Task 1.1.</b> Your friend was also planning to go on the exchange. Write a letter to your friend. Write about your feelings and what you think about the virtual exchange. Write about <b>50 words</b>.</p>`,
t12:`<p><b>Task 1.2.</b> Write a letter to Dr Weber. Explain why the trip was important to you, give your opinion about the virtual exchange, and suggest how the real trip could still happen in the future. Write <b>120–150 words</b>.</p>`,
p2:`<p><b>Part 2.</b> You are taking part in an online discussion about education. Write your post answering the question:</p><p><b>«Is studying abroad worth the cost and effort for young people?»</b></p><p>Give reasons and examples. Write <b>180–200 words</b>.</p>`,
m11:"Hi Gulnora,\n\nDid you see that the Germany trip has been cancelled? I'm really disappointed because I've been saving for it all year! The virtual exchange sounds OK, but chatting online isn't the same as visiting a real college. Maybe we could plan our own trip in the summer?\n\nLove,\nZilola",
m12:"Dear Dr Weber,\n\nI am writing in response to your email about the cancellation of the spring exchange programme.\n\nI was extremely disappointed to hear this news, as the trip was one of the main reasons I chose Westbridge College. I am studying German and hope to do a master's degree in Germany, so experiencing student life there was very important to me.\n\nWhile I appreciate the effort to organise a virtual exchange, I am not convinced that online meetings can replace real contact with the language and culture.\n\nIn order to make the trip possible in the future, I would like to suggest that the college apply for international education grants. Alternatively, students could be offered the option of paying in instalments, or the trip could be shortened to one week to reduce costs.\n\nI would be grateful if you could consider these ideas.\n\nYours sincerely,\nZilola Qosimova",
mp2:"Every year, thousands of young people from Uzbekistan go abroad to study, often at great financial cost to their families. In my view, studying abroad is generally worth the investment, although it is not the right choice for everyone.\n\nThe main reason is that international education offers experience that cannot be gained at home. Students not only receive a degree from a respected university, but they also become fluent in a foreign language and learn to live independently. As a result, they often return with skills and contacts that make them very attractive to employers. For example, many graduates of programmes in South Korea, Germany and the United Kingdom now hold senior positions in Uzbek banks and technology companies.\n\nAdmittedly, studying abroad is expensive, and some students struggle with loneliness, culture shock or difficult courses. However, these problems can be reduced through scholarships, careful preparation and support from student communities abroad.\n\nIn conclusion, although the cost and effort are considerable, I am convinced that studying abroad is a valuable investment for motivated young people. Families should research scholarships and choose programmes carefully to make sure that the experience brings long-term benefits."});

MK({t:'Park or shopping centre',
sit:`<span class="from">From: Mr Bahodir Yuldashev, City Development Department · Subject: Plans for Navruz Park</span>Dear Residents,

The city council is planning to build a modern shopping and entertainment centre on part of Navruz Park. About 40% of the park's area, including the children's playground and the football pitch, will be used for the project. The centre will create 500 new jobs.

Residents are invited to send their opinions before 30 April.

Bahodir Yuldashev`,
t11:`<p><b>Task 1.1.</b> Your friend lives near the park too. Write a letter to your friend. Write about your feelings about the plan and what you think residents should do. Write about <b>50 words</b>.</p>`,
t12:`<p><b>Task 1.2.</b> Write a letter to Mr Yuldashev. Give your opinion about the plan, explain how it would affect local residents, and suggest an alternative. Write <b>120–150 words</b>.</p>`,
p2:`<p><b>Part 2.</b> You are taking part in an online discussion about cities. Write your post answering the question:</p><p><b>«Should green spaces in cities be protected, even if more land is needed for housing and business?»</b></p><p>Give reasons and examples. Write <b>180–200 words</b>.</p>`,
m11:"Hi Dilshod,\n\nHave you heard about the plan for Navruz Park? They want to build a shopping centre on the playground and the football pitch! I'm really upset because our kids play there every day. I think we should collect signatures and go to the residents' meeting. Are you in?\n\nBest,\nSherzod",
m12:"Dear Mr Yuldashev,\n\nI am writing in response to your letter regarding the plans to build a shopping centre in Navruz Park.\n\nWhile I appreciate that the project would create new jobs, I strongly oppose the decision to use the playground and football pitch. Navruz Park is the only large green space in our district, and hundreds of families use it every day. Losing these facilities would leave children with nowhere safe to play. Moreover, a large shopping centre would increase traffic and noise in what is currently a quiet residential area.\n\nI would therefore like to suggest building the centre on the empty industrial site near the railway station, which is only two kilometres away. This would still create jobs without destroying the park.\n\nI hope that the council will take residents' views into account. I look forward to hearing from you.\n\nYours sincerely,\nSherzod Mirzaev",
mp2:"As cities grow, the demand for new homes, offices and shops puts increasing pressure on parks and other green areas. In my view, green spaces must be protected, because they are essential for the health and wellbeing of urban residents.\n\nThe main reason is that parks improve both physical and mental health. Trees reduce air pollution and noise, while open spaces encourage people to walk, play sports and spend time outdoors. As a result, residents who live near parks tend to suffer less from stress and heart disease. For example, the renovated parks in Tashkent are full of families, runners and elderly people every evening, which shows how much citizens need such places.\n\nAdmittedly, cities need more housing, especially as young people move from the regions. However, building on parks is not the only solution. Governments can redevelop old industrial areas, construct higher buildings on existing sites, and improve transport so that people can live in suburbs.\n\nIn conclusion, I firmly believe that green spaces are too valuable to sacrifice for short-term development. Once a park is destroyed, it is almost never replaced, so city planners should protect these areas and find other ways to meet the demand for land."});

MK({t:'Festival date change',
sit:`<span class="from">From: Silk Road Music Festival Team · Subject: New festival dates</span>Dear Ticket Holder,

Due to the construction of a new stage, the Silk Road Music Festival will move from 5–7 June to 18–20 September. All tickets will remain valid for the new dates. Ticket holders who cannot attend may receive a 70% refund if they apply before 1 May.

We apologise for any inconvenience.

The Festival Team`,
t11:`<p><b>Task 1.1.</b> You bought tickets with a friend. Write a letter to your friend. Write about your feelings about the change and what you would like to do. Write about <b>50 words</b>.</p>`,
t12:`<p><b>Task 1.2.</b> Write a letter to the festival organisers. Explain how the change affects you, give your opinion about the refund policy, and say what you would like them to do. Write <b>120–150 words</b>.</p>`,
p2:`<p><b>Part 2.</b> You are taking part in an online discussion about education. Write your post answering the question:</p><p><b>«Should music and art be compulsory subjects at school?»</b></p><p>Give reasons and examples. Write <b>180–200 words</b>.</p>`,
m11:"Hi Shahlo,\n\nHave you seen the email? The festival has moved to September! I'm gutted because I start my new job then and probably can't take time off. And they're only giving back 70% of the money. Do you still want to go? If not, let's ask for a refund together.\n\nLove,\nMuxlisa",
m12:"Dear Festival Team,\n\nI am writing regarding your email about the change of dates for the Silk Road Music Festival.\n\nI bought two tickets in January and had already booked accommodation and train tickets for June. Unfortunately, I will not be able to attend in September because I am starting a new job and cannot take holiday during the first months.\n\nI understand that the construction of a new stage was necessary. However, I find the offer of only a 70% refund unfair, since the change was made by the organisers and not by the ticket holders. In addition, I will lose money on the hotel booking, which cannot be cancelled.\n\nI would therefore like to request a full refund of the ticket price. I would also appreciate it if you could extend the deadline for applications.\n\nI look forward to your prompt reply.\n\nYours faithfully,\nMuxlisa Abdullaeva",
mp2:"In many schools, music and art lessons are the first to be cut when timetables become crowded with exam subjects. In my opinion, however, these subjects should remain compulsory, at least until the end of secondary school.\n\nThe main reason is that creative subjects develop important skills that other lessons often ignore. Learning an instrument improves memory, concentration and discipline, while drawing and painting encourage imagination and problem-solving. As a result, pupils who study music and art often perform better in academic subjects as well. Moreover, these lessons give children a way to express their emotions, which can reduce stress during exam periods.\n\nCritics argue that schools should focus on subjects such as mathematics, science and languages, which are more useful for future careers. However, the creative industries, including design, advertising, film and gaming, are among the fastest-growing sectors of the modern economy. For example, many young Uzbek designers and animators now work successfully for international companies.\n\nIn conclusion, I am convinced that music and art are not a luxury but an essential part of a balanced education. Schools should therefore keep them in the curriculum and provide well-trained teachers and proper equipment."});

MK({t:'New recycling rules',
sit:`<span class="from">From: Mrs Saodat Ergasheva, Chair, Yangiobod Mahalla Committee · Subject: New waste collection rules</span>Dear Residents,

From next month, all households must separate their waste into three bins: plastic, paper and general waste. Waste will be collected only twice a week instead of every day. Households that do not separate their waste may receive a fine.

Bins will be delivered to each building next week.

Saodat Ergasheva`,
t11:`<p><b>Task 1.1.</b> Your friend lives in the same mahalla. Write a letter to your friend. Write about your feelings about the new rules and what you are going to do. Write about <b>50 words</b>.</p>`,
t12:`<p><b>Task 1.2.</b> Write a letter to Mrs Ergasheva. Give your opinion about the new rules, mention any problems, and suggest how the committee could help residents. Write <b>120–150 words</b>.</p>`,
p2:`<p><b>Part 2.</b> You are taking part in an online discussion about the environment. Write your post answering the question:</p><p><b>«Who is more responsible for protecting the environment: individuals or governments?»</b></p><p>Give reasons and examples. Write <b>180–200 words</b>.</p>`,
m11:"Hi Feruza,\n\nDid you read the notice about the new recycling rules? I think separating rubbish is a great idea, but collection only twice a week will be a problem in summer — it'll smell terrible! I'm going to buy a small bin for plastic for the kitchen. Shall we explain the rules to our neighbours?\n\nTake care,\nDurdona",
m12:"Dear Mrs Ergasheva,\n\nI am writing in response to your notice about the new waste collection rules.\n\nI fully support the introduction of recycling, as it will help reduce pollution and teach residents, especially children, to care for the environment.\n\nHowever, I am concerned about reducing collections to twice a week. In hot weather, general waste may begin to smell and attract insects within a day or two, which could create health problems. Furthermore, many elderly residents may not understand how to separate their waste correctly, and fining them immediately would seem unfair.\n\nI would therefore like to suggest collecting general waste at least every other day during the summer months. In addition, the committee could organise a short information meeting and put clear posters near the bins. A warning before any fine would also be reasonable.\n\nI look forward to hearing from you.\n\nYours sincerely,\nDurdona Sultanova",
mp2:"Environmental problems such as pollution, waste and climate change affect everyone, but there is disagreement about who should take the lead in solving them. In my view, governments carry the greater responsibility, although individuals also have an important role to play.\n\nThe main reason is that governments have the power to make changes on a large scale. They can introduce laws that limit pollution from factories, invest in renewable energy and build public transport systems. As a result, millions of people change their behaviour at the same time. For example, when several countries banned single-use plastic bags, the amount of plastic waste in their rivers fell dramatically within a few years.\n\nAdmittedly, individual actions also matter. People can recycle, use less water and choose to walk or cycle instead of driving. However, without proper infrastructure, such as recycling bins and safe bike lanes, even the most environmentally conscious citizens find it difficult to live sustainably.\n\nIn conclusion, while everyone should make an effort to protect the planet, I am convinced that governments must lead the way. Only by creating the right laws and facilities can they make it easy for individuals to make environmentally friendly choices."});

MK({t:'Online shop delivery',
sit:`<span class="from">From: Customer Service, ShopTez Online · Subject: Changes to our delivery service</span>Dear Customer,

From 1 November, free delivery will only be available for orders over 500,000 sum. For smaller orders, a delivery fee of 25,000 sum will apply. In addition, delivery times outside Tashkent will increase from 2 days to 5 days.

Thank you for shopping with us.

ShopTez Customer Service`,
t11:`<p><b>Task 1.1.</b> Your friend often shops on ShopTez too. Write a letter to your friend. Write about your feelings about the changes and what you plan to do. Write about <b>50 words</b>.</p>`,
t12:`<p><b>Task 1.2.</b> Write a letter to ShopTez customer service. Explain how the changes affect you as a regular customer, and suggest how the company could keep its customers satisfied. Write <b>120–150 words</b>.</p>`,
p2:`<p><b>Part 2.</b> You are taking part in an online discussion about shopping. Write your post answering the question:</p><p><b>«Will online shopping completely replace traditional shops in the future?»</b></p><p>Give reasons and examples. Write <b>180–200 words</b>.</p>`,
m11:"Hi Akmal,\n\nHave you seen the new ShopTez delivery rules? Free delivery only over 500,000 sum, and five days to Samarkand! That's so annoying because I usually order small things like books. I think I'll try the new shop Uzum Market instead. Have you used it?\n\nBest,\nIsmoil",
m12:"Dear Sir or Madam,\n\nI am writing regarding your recent email about changes to your delivery service.\n\nI have been a regular customer of ShopTez for three years and live in Samarkand. I usually place small orders two or three times a month, such as books, phone accessories and household items. As a result, the new delivery fee will significantly increase my costs. In addition, waiting five days for delivery will make your service much less convenient than visiting local shops.\n\nI understand that delivery costs have risen. However, I would suggest introducing a loyalty programme, which would offer free delivery to customers who order regularly. Another option would be to create collection points in regional cities, where customers could pick up their orders at a lower cost.\n\nI hope you will consider these suggestions, as I would like to continue shopping with you.\n\nYours faithfully,\nIsmoil Raximov",
mp2:"Online shopping has grown rapidly over the past decade, and many people now buy everything from clothes to groceries through their phones. However, I do not believe that it will completely replace traditional shops, as physical stores offer experiences that the internet cannot.\n\nThe main reason is that many products are difficult to buy without seeing or touching them first. Customers usually want to try on clothes and shoes, test furniture or check the freshness of fruit and vegetables. Moreover, shopping is a social activity for many people. For example, bazaars such as Chorsu in Tashkent remain crowded every weekend, not only because of their prices but also because people enjoy the atmosphere and the chance to talk to sellers.\n\nAdmittedly, online shops are convenient and often cheaper, which is why many small stores have already closed. Nevertheless, the most successful retailers are now combining both approaches, allowing customers to order online and collect their goods in a shop.\n\nIn conclusion, although online shopping will continue to grow, I am convinced that traditional shops will survive by changing their role. Instead of disappearing, they are likely to become places for experiences, advice and personal service."});

MK({t:'Cooking course changes',
sit:`<span class="from">From: Mr Timur Rasulov, Owner, Tasty Academy Cooking School · Subject: Your cooking course</span>Dear Students,

We are sorry to inform you that Chef Malika, who teaches the Uzbek cuisine course, will leave the school next month. Her lessons will be taken over by a new chef who specialises in European cuisine. The course will therefore focus on European dishes, and the price will increase by 20% because of the more expensive ingredients.

Timur Rasulov`,
t11:`<p><b>Task 1.1.</b> Your friend attends the same course. Write a letter to your friend. Write about your feelings about the news and whether you will continue the course. Write about <b>50 words</b>.</p>`,
t12:`<p><b>Task 1.2.</b> Write a letter to Mr Rasulov. Explain why you joined the course, give your opinion about the changes, and say what you would like the school to do. Write <b>120–150 words</b>.</p>`,
p2:`<p><b>Part 2.</b> You are taking part in an online discussion about education. Write your post answering the question:</p><p><b>«Should schools teach practical life skills, such as cooking and managing money, instead of some academic subjects?»</b></p><p>Give reasons and examples. Write <b>180–200 words</b>.</p>`,
m11:"Hi Mohira,\n\nDid you get the email from Tasty Academy? Chef Malika is leaving, and the course is switching to European food! I'm really sad because I joined to learn proper Uzbek dishes like manti and somsa. I don't think I'll continue. Maybe we could ask Malika for private lessons?\n\nLove,\nRayhona",
m12:"Dear Mr Rasulov,\n\nI am writing in response to your email about the changes to the Uzbek cuisine course.\n\nI joined Tasty Academy specifically to learn traditional Uzbek cooking, as I would like to open a small family café next year. Chef Malika's lessons have been extremely useful, and I was very disappointed to hear that she is leaving.\n\nWhile I understand that staff changes are sometimes unavoidable, I do not think it is fair to change the content of a course that students have already paid for. Furthermore, a 20% price increase for a course I did not choose seems unreasonable.\n\nI would therefore be grateful if you could find another chef who specialises in Uzbek cuisine. If this is not possible, I would like to request a refund for the remaining lessons.\n\nI look forward to hearing from you.\n\nYours sincerely,\nRayhona Hakimova",
mp2:"Many young people leave school with excellent knowledge of algebra and history but no idea how to cook a healthy meal or plan a monthly budget. In my view, schools should include practical life skills in the curriculum, even if this means reducing time for some academic subjects.\n\nThe main reason is that these skills are essential for independent adult life. Young people who cannot cook tend to rely on fast food, which damages their health, while those who do not understand money often fall into debt. For example, many university students who move to Tashkent from the regions admit they struggle to manage their stipend and run out of money before the end of the month.\n\nAdmittedly, academic subjects are important for entering university and developing critical thinking. However, practical lessons do not have to replace them completely. Schools could reduce the amount of memorisation in some subjects and use the time for short courses in cooking, personal finance and first aid.\n\nIn conclusion, I firmly believe that a modern education should prepare students not only for exams but also for everyday life. Including practical skills in the timetable would produce healthier, more confident and more responsible young adults."});

MK({t:'Summer camp volunteers',
sit:`<span class="from">From: Ms Zarina Holmatova, Volunteer Coordinator, Bright Kids Foundation · Subject: Summer camp 2026</span>Dear Volunteers,

This year, our summer camp for children from low-income families will last four weeks instead of two. All volunteers will now need to stay for the whole four weeks and complete a two-day training course in May. Unfortunately, we can no longer pay for volunteers' transport to the camp.

Please confirm whether you can take part by 15 April.

Zarina Holmatova`,
t11:`<p><b>Task 1.1.</b> Your friend volunteered at the camp with you last year. Write a letter to your friend. Write about your feelings about the changes and whether you will volunteer this year. Write about <b>50 words</b>.</p>`,
t12:`<p><b>Task 1.2.</b> Write a letter to Ms Holmatova. Give your opinion about the changes, explain any difficulties they may cause for volunteers, and suggest solutions. Write <b>120–150 words</b>.</p>`,
p2:`<p><b>Part 2.</b> You are taking part in an online discussion about society. Write your post answering the question:</p><p><b>«Should young people be required to do unpaid community work as part of their education?»</b></p><p>Give reasons and examples. Write <b>180–200 words</b>.</p>`,
m11:"Hi Kamron,\n\nHave you seen the email about the summer camp? It's four weeks now, and we have to pay for our own transport! I really want to go again because the kids were amazing last year, but I can't miss my summer job for a whole month. Are you going?\n\nBest,\nJahongir",
m12:"Dear Ms Holmatova,\n\nI am writing in response to your email about the changes to the summer camp.\n\nI volunteered at the camp last year and found it extremely rewarding, so I am pleased that the children will now have four weeks of activities. However, I am concerned that the new requirements may reduce the number of volunteers. Many of us are students with summer jobs or family responsibilities and cannot stay for a whole month. In addition, the cost of transport may be too high for some volunteers.\n\nI would therefore like to suggest allowing volunteers to choose either two or four weeks, with different groups for each half of the camp. It might also be possible to find a local business that would sponsor a bus for volunteers.\n\nI would be grateful if you could consider these ideas. I look forward to hearing from you.\n\nYours sincerely,\nJahongir Ahmedov",
mp2:"In some countries, secondary school students must complete a certain number of hours of community service before they graduate. In my opinion, this is a valuable policy, and unpaid community work should be part of every young person's education.\n\nThe main reason is that volunteering develops skills and values that are difficult to learn in a classroom. When teenagers help in hospitals, care homes or environmental projects, they learn teamwork, responsibility and empathy. As a result, they often become more confident and better prepared for working life. For example, students who help organise charity events in their mahalla learn how to plan, communicate with adults and solve unexpected problems.\n\nCritics argue that compulsory volunteering is a contradiction, since helping others should come from personal choice. Moreover, students already have heavy workloads. However, schools can offer a wide range of options and allow students to choose projects that match their interests, so that the experience feels meaningful rather than forced.\n\nIn conclusion, I am convinced that community work benefits both young people and society. If schools organise it flexibly and connect it to students' interests, it can help create a generation of active and caring citizens."});

function autoCheck(text,task){const R=[],add=(l,m)=>R.push([l,m]);const t=text.trim();const n=wcount(t);const w=task.w||[0,9999];const low=' '+t.toLowerCase().replace(/[’]/g,"'")+' ';

  const ty=task.type||'free';const first=t.split('\n').map(s=>s.trim()).filter(Boolean)[0]||'';const lines=t.split('\n').map(s=>s.trim()).filter(Boolean);const last=lines.slice(-2).join(' ').toLowerCase();
  if(ty==='1.1'){if(!/^(hi|hello|hey|dear)\b/i.test(first))add('err',"Salomlashish yo'q. Boshlang: «Hi Anna,» yoki «Dear Tom,»");else add('ok','Salomlashish bor.');

  if(ty==='1.2'){if(!/^dear\s+(mr|mrs|ms|miss|dr|sir|madam|manager|editor|hiring|team|[A-Z])/i.test(first))add('err',"Rasmiy salomlashish yo'q: «Dear Mr Smith,» yoki «Dear Sir or Madam,»");else add('ok','Rasmiy salomlashish bor.');

    if(/dear sir or madam/i.test(t)&&/yours sincerely/i.test(t))add('warn',"«Dear Sir or Madam» bilan «Yours faithfully» ishlatiladi (ism noma'lum).");

  if(ty==='1.2'||ty==='p2'){const c=t.match(CONTR)||[];if(c.length)add('warn',`Qisqartmalar (${[...new Set(c.map(x=>x.toLowerCase()))].slice(0,5).join(', ')}) rasmiy uslubda to'liq yoziladi: «do not», «I am».`);
    const inf=INFORMAL.filter(x=>low.includes(' '+x)||(x==='!!'&&t.includes('!!')));if(inf.length)add('warn',`Norasmiy so'zlar: ${inf.slice(0,5).map(x=>'«'+x.trim()+'»').join(', ')}. Rasmiy matnda ularni almashtiring.`);
    if((t.match(/!/g)||[]).length>1)add('warn',"Undov belgisi (!) rasmiy matnda deyarli ishlatilmaydi.")}
  if(ty==='p2'){const paras=t.split(/\n\s*\n|\n/).map(s=>s.trim()).filter(s=>wcount(s)>3);if(paras.length<4)add('warn',`Paragraflar soni: ${paras.length}. Part 2 uchun 4 paragraf tavsiya: kirish, 2 ta asosiy, xulosa.`);else add('ok',`Paragraflar: ${paras.length}.`);

    if(!/(in conclusion|to sum up|to conclude|overall|all in all|to summarise|to summarize)/i.test(t))add('warn',"Xulosa iborasi yo'q: «In conclusion, …» / «Overall, …»");

  if(ty==='1.1'||ty==='1.2'||ty==='p2'||(ty==='para'&&w[1]>=60)){const L=LINKERS.filter(x=>new RegExp('\\b'+x.replace(/ /g,'\\s+')+'\\b','i').test(t));const need=ty==='1.1'?1:ty==='para'?2:ty==='1.2'?4:7;

  const vc=(low.match(/\bvery\b/g)||[]).length;if(vc>2)add('warn',`«very» ${vc} marta. Kuchliroq so'z tanlang: very big → huge, very good → excellent.`);
  if(ty!=='sent'){const STOP=new Set('the a an and or but to of in on at for with is are was were be been it this that i you he she we they my your our their me him her them have has had do does did not will would can could should so as by from about if than then there here also very more most some any all what which who when where why how its just one'.split(' '));
    const cnt={};(low.match(/[a-z']+/g)||[]).forEach(x=>{if(x.length>3&&!STOP.has(x))cnt[x]=(cnt[x]||0)+1});const ctx=String((task.prompt||'')+' '+(task.ctx||'')).toLowerCase();const lim=n>150?4:3;const rep=Object.entries(cnt).filter(([k,v])=>v>(ctx.includes(k.replace(/s$/,''))?lim*2:lim)).sort((a,b)=>b[1]-a[1]).slice(0,3);
    if(rep.length)add('warn',`Takrorlangan so'zlar: ${rep.map(([k,v])=>`«${k}» ×${v}`).join(', ')}. Sinonim ishlating.`)}
  const it=(low.match(/\bi think\b/g)||[]).length;if(it>2)add('warn',`«I think» ${it} marta. Almashtiring: I believe, In my view, It seems to me…`);
  LERR.forEach(([re,m])=>{if(re.test(t))add('err',m)});
  if(task.need)task.need.forEach(([re,m])=>{if(!new RegExp(re,'i').test(t))add('warn',m)});
  return R}

function lsteps(l){const st=[['th','Qoida']];if(l.an)st.push(['an','Tahlil']);st.push(['ex','Mashq']);st.push(['wr','Yozish']);return st}
function lesson(l,step){if(!unlocked(l)){toast('Bu dars hali yopiq');return go('')}setAccent(l.mod.c);topbar(`${l.mod.t} · ${l.i+1}-dars`,'');
  const st=lsteps(l);step=step||'th';if(!st.find(s=>s[0]===step))step='th';

  const stepDone={th:true,an:true,ex:exOK,wr:wrOK};
  let h=`<div class="card lh" style="padding-bottom:16px"><div class="k">${esc(l.mod.ic+' '+l.mod.t)} · ${l.min||25} daqiqa</div><h1>${esc(l.t)}</h1><div class="uz">${esc(l.uz)}</div>${l.goal?`<div class="goal"><b>Maqsad:</b> ${l.goal}</div>`:''}</div>`;
  h+=`<div class="steps">${st.map(([k,n],i)=>`<button data-s="${k}" class="${k===step?'on':''} ${(k==='ex'&&exOK)||(k==='wr'&&wrOK)?'dn':''}" ${k==='wr'&&!exOK&&!wrOK&&S.unlock<LESSONS.length?'disabled title="Avval mashqdan o\'ting"':''}><b>${(k==='ex'&&exOK)||(k==='wr'&&wrOK)?'✓':i+1}</b>${n}</button>`).join('')}</div><div id="body"></div>`;
  $('#app').innerHTML=h+FOOT;
  $$('[data-s]').forEach(b=>b.onclick=()=>go(`l/${l.id}/${b.dataset.s}`));
  const B=$('#body');const nextStep=()=>{const i=st.findIndex(s=>s[0]===step);return st[i+1]&&st[i+1][0]};
  if(step==='th'){B.innerHTML=`<div class="card th">${l.th.map(x=>`<h3>${esc(x.h)}</h3>${x.b}`).join('')}${l.cmp?cmpHTML(l.cmp):''}</div><button class="btn wide" id="nx">Keyingisi: ${st[1][1]} →</button>`;$('#nx').onclick=()=>go(`l/${l.id}/${nextStep()}`)}
  else if(step==='an'){B.innerHTML=anHTML(l.an)+`<button class="btn wide" id="nx">Keyingisi: Mashq →</button>`;wireAn();$('#nx').onclick=()=>go(`l/${l.id}/ex`)}

const norm=s=>String(s).replace(/[’‘`]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim();
const loose=s=>norm(s).toLowerCase().replace(/[.,!?;:"]/g,'').replace(/\s+/g,' ').trim();

  function show(){if(k>=X.length)return finish();const x=X[k];let body='';const typ=x[0];

    if(typ==='m'){const ord=shuffle(x[2].map((_,i)=>i),seed+k);body=`<div class="qt">${fmtQ(x[1])}</div>`+ord.map(i=>`<button class="opt" data-i="${i}">${esc(x[2][i])}</button>`).join('')}
    else if(typ==='f'){body=`<div class="qt">${fmtQ(x[1])}</div><input class="inp" id="a" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Javobingiz"><div class="row"><button class="btn" id="chk">Tekshirish</button></div>`}
    else if(typ==='x'){body=`<div class="src">${esc(x[1])}</div><textarea class="inp" id="a" spellcheck="false" placeholder="To'g'ri gapni yozing">${esc(x[1])}</textarea><div class="row"><button class="btn" id="chk">Tekshirish</button></div>`}
    else if(typ==='r'){body=`<div class="qt" style="font-family:var(--ui);font-size:16px;font-weight:700">${esc(x[1])}</div><div class="src">${esc(x[2])}</div><textarea class="inp" id="a" spellcheck="false" placeholder="Yangi variant"></textarea><div class="row"><button class="btn" id="chk">Tekshirish</button></div>`}
    else if(typ==='o'){body=`<div class="chips" id="ans"></div><div class="chips pool" id="pool"></div><div class="row"><button class="btn g" id="clr">↺ Tozalash</button><button class="btn" id="chk" disabled>Tekshirish</button></div>`}
    else if(typ==='s'){body=x[1].map((it,i)=>`<div class="sortrow"><span>${esc(it[0])}</span><div class="sg" data-r="${i}">${x[2].map((c,j)=>`<button data-c="${j}">${esc(c)}</button>`).join('')}</div></div>`).join('')+`<div class="row"><button class="btn" id="chk" disabled>Tekshirish</button></div>`}
    B.innerHTML=`<div class="card">${head}<div class="qq">${lab}</div>${body}<div id="fb"></div></div>`;
    const done=(ok,ans)=>{if(ok)right++;else{wrongs.push(x);bankPush(x,l)}const why=x[typ==='m'?4:typ==='r'?4:typ==='o'||typ==='s'?2:3];
      $('#fb').innerHTML=`<div class="fb ${ok?'c':'x'}"><b>${ok?"✓ To'g'ri":"✗ Noto'g'ri"}</b>${!ok&&ans?`<div class="ra">${esc(ans)}</div>`:''}${why?`<div>${why}</div>`:''}</div><button class="btn wide" id="nx">${k+1<X.length?'Keyingi savol →':'Natijani ko\'rish'}</button>`;$('#nx').focus();$('#nx').onclick=()=>{k++;show()}};
    if(typ==='m'){$$('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,ok=i===x[3];$$('.opt').forEach(o=>{o.disabled=true;if(+o.dataset.i===x[3])o.classList.add('c')});if(!ok)b.classList.add('x');done(ok)})}
    if(typ==='f'||typ==='x'||typ==='r'){const inp=$('#a');inp.focus();if(typ==='x'){inp.setSelectionRange(inp.value.length,inp.value.length)}const acc=typ==='r'?x[3]:x[2];
      const chk=()=>{const v=inp.value;if(!v.trim())return;let ok;if(typ==='f')ok=acc.some(a=>loose(a)===loose(v));else ok=acc.some(a=>norm(a)===norm(v));
        let note='';if(!ok&&typ!=='f'&&acc.some(a=>loose(a)===loose(v))){note="Deyarli! So'zlar to'g'ri, lekin katta harf yoki tinish belgisini tekshiring.";}
        inp.disabled=true;$('#chk').disabled=true;done(ok,ok?'':(note?note+' To\'g\'ri javob: ':'To\'g\'ri javob: ')+acc[0])};
      $('#chk').onclick=chk;if(typ==='f')inp.onkeydown=e=>{if(e.key==='Enter')chk()}}
    if(typ==='o'){const parts=x[1];let order=shuffle(parts.map((_,i)=>i),seed+k);if(order.every((v,i)=>v===i)&&parts.length>1)order.reverse();const picked=[];
      const draw=()=>{$('#ans').innerHTML=picked.map((i,j)=>`<button class="chip" data-j="${j}">${esc(parts[i])}</button>`).join('')||'<span class="sub" style="padding:6px">Bu yerga yig\'iladi</span>';$('#pool').innerHTML=order.filter(i=>!picked.includes(i)).map(i=>`<button class="chip" data-i="${i}">${esc(parts[i])}</button>`).join('');
        $$('#pool .chip').forEach(b=>b.onclick=()=>{picked.push(+b.dataset.i);draw()});$$('#ans .chip').forEach(b=>b.onclick=()=>{picked.splice(+b.dataset.j,1);draw()});$('#chk').disabled=picked.length!==parts.length};
      draw();$('#clr').onclick=()=>{picked.length=0;draw()};$('#chk').onclick=()=>{const ok=picked.every((v,i)=>parts[v]===parts[i]);$$('.chip').forEach(c=>c.disabled=true);$('#chk').disabled=true;$('#clr').disabled=true;done(ok,ok?'':'To\'g\'ri tartib: '+parts.join(' '))}}
    if(typ==='s'){const sel={};$$('.sg button').forEach(b=>b.onclick=()=>{const r=b.parentNode.dataset.r;sel[r]=+b.dataset.c;b.parentNode.querySelectorAll('button').forEach(o=>o.classList.toggle('on',o===b));$('#chk').disabled=Object.keys(sel).length!==x[1].length});
      $('#chk').onclick=()=>{let ok=true;x[1].forEach((it,i)=>{const g=$(`.sg[data-r="${i}"]`);g.querySelectorAll('button').forEach(o=>{o.disabled=true;o.classList.remove('on');const c=+o.dataset.c;if(c===it[1])o.classList.add('c');else if(c===sel[i])o.classList.add('x')});if(sel[i]!==it[1])ok=false});$('#chk').disabled=true;done(ok)}}}
  function finish(){const p=Math.round(right/X.length*100);if(onFinish)return onFinish(p,right,X.length,wrongs);
    const best=Math.max(S.ex[l.id]||0,p);S.ex[l.id]=best;save();const pass=p>=PASS;
    B.innerHTML=`<div class="card score"><div class="big ${pass?'pass':'fail'}">${p}%</div><p style="font-weight:800;font-size:18px;margin:10px 0 4px">${pass?"Mashqdan o'tdingiz!":"Yana bir urinib ko'ring"}</p><p class="sub">${right} / ${X.length} to'g'ri · o'tish uchun kamida ${PASS}%${best>p?` · eng yaxshi natija: ${best}%`:''}</p>

    <div class="row">${pass||best>=PASS?`<button class="btn ok" id="w">Yozish topshirig'iga o'tish →</button>`:''}<button class="btn g" id="re">↺ Qaytadan ishlash</button></div></div>`;

function acHTML(R){return `<ul class="ac">${R.map(([lv,m])=>`<li class="a-${lv}"><i>${lv==='err'?'✗':lv==='warn'?'!':'✓'}</i><span>${m}</span></li>`).join('')}</ul><div class="sub">Avto-tekshiruv faqat yordamchi: u mazmun va fikrni baholay olmaydi. Namuna va mezonlar bilan solishtiring.</div>`}
function resultHTML(l,sub){const T=l.task;const nx=LESSONS[l.i+1];const done=isDone(l);
  return `<div class="card" id="res"><h2 style="font-size:21px">Sizning matningiz va namuna</h2><div class="sub" style="margin:4px 0 12px">Solishtiring: tuzilma, iboralar, bog'lovchilar. Namunadan 2–3 ta yaxshi iborani o'zingizniki qiling.</div>
  <b>Siz yozdingiz</b> <span class="sub">(${sub.n} so'z · ${sub.at})</span><div class="mine" style="margin:6px 0 14px">${esc(sub.t)}</div>
  <b>Namuna javob</b>${T.ml?`<span class="mlv">${esc(T.ml)}</span>`:''}<div class="model" style="margin-top:6px">${esc(T.model)}</div>
  ${T.mnote?`<div class="tip">${T.mnote}</div>`:''}
  <div class="row"><button class="btn g" onclick="copyText(teacherText('${l.id}'))">📋 O'qituvchi uchun nusxalash</button></div>
  ${done?`<div class="done"><i>🎉</i><div>Dars bajarildi!${nx?`<br><span class="sub">Keyingi dars ochildi: ${esc(nx.t)}</span>`:''}</div></div>${nx?`<div class="row"><button class="btn wide" onclick="go('l/${nx.id}')">Keyingi dars →</button></div>`:`<div class="row"><button class="btn wide dk" onclick="go('mocks')">Mock imtihonlarga →</button></div>`}`:`<div class="warn">Dars tugashi uchun mashqdan ham kamida ${PASS}% oling.</div>`}</div>`}
function teacherText(id){const l=LI[id],w=S.wr[id];return `Enzo Writing — ${S.name||"(ism kiritilmagan)"}\nDars ${l.i+1}: ${l.t}\nSana: ${w.at} · ${w.n} so'z · mashq: ${S.ex[id]||0}%\n\nTopshiriq: ${l.task.prompt.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}\n\n${w.t}\n\n© Enzo Academy`}

/* ---------- mocks ---------- */
function mockList(){if(!mocksOpen()){toast('Mocklar hali yopiq');return go('')}setAccent('#1B2433');topbar('Mock imtihonlar','');
  let h=`<div class="card"><h1 style="font-size:26px">Mock imtihonlar</h1><p class="sub" style="margin:6px 0 0">Haqiqiy imtihon kabi: 60 daqiqa, 3 ta topshiriq. Tavsiya: Task 1.1 — 10 daq, Task 1.2 — 20 daq, Part 2 — 30 daq. Oxirida o'zingizni mezonlar bo'yicha baholaysiz va namunalarni ko'rasiz.</p></div><div class="card">`;
  h+=MOCKS.map((m,i)=>{const r=S.mk[i];return `<div class="mrow"><span class="ls"><span class="no" style="${r&&r.fin?'background:var(--ok);border-color:var(--ok);color:#fff':''}">${r&&r.fin?'✓':i+1}</span></span><div class="tx"><b>${i+1}. ${esc(m.t)}</b><small>${r&&r.fin?`Natija: ${r.lv} · ${r.pc}% · ${r.at}`:r?'Boshlangan — davom ettiring':'Hali ishlanmagan'}</small></div><button class="btn ${r&&r.fin?'g':''}" data-m="${i}">${r&&r.fin?'Ko\'rish':r?'Davom':'Boshlash'}</button></div>`}).join('');
  $('#app').innerHTML=h+`</div>`+FOOT;$$('[data-m]').forEach(b=>b.onclick=()=>go('mock/'+b.dataset.m))}
const MT=[['t11','Task 1.1','~50 so\'z',{type:'1.1',w:[45,70]},10],['t12','Task 1.2','120–150',{type:'1.2',w:[120,150]},20],['p2','Part 2','180–200',{type:'p2',w:[180,200]},30]];
function mock(i,tab){if(!mocksOpen())return go('');const M=MOCKS[i];setAccent('#1B2433');topbar(`Mock ${i+1}: ${M.t}`,'mocks');
  let R=S.mk[i];if(R&&R.fin)return mockResult(i);
  if(!R){$('#app').innerHTML=`<div class="card"><h1 style="font-size:26px">Mock ${i+1}: ${esc(M.t)}</h1><ul style="margin:12px 0;padding-left:20px"><li>Jami <b>60 daqiqa</b>. Taymer to'xtatilmaydi.</li><li>3 ta topshiriq: Task 1.1 (~50 so'z), Task 1.2 (120–150 so'z), Part 2 (180–200 so'z).</li><li>Matnlar avtomatik saqlanadi — sahifani yopsangiz ham yo'qolmaydi.</li><li>Iboralar banki va avto-tekshiruv imtihon vaqtida ishlamaydi.</li></ul><button class="btn dk wide" id="st">▶ Imtihonni boshlash</button></div>`+FOOT;$('#st').onclick=()=>{S.mk[i]={st:Date.now(),t:{t11:'',t12:'',p2:''}};save();mock(i,'t11')};return}
  tab=tab||'t11';const T=MT.find(x=>x[0]===tab)||MT[0];
  let h=`<details class="card" open><summary>📩 Vaziyat (Task 1.1 va 1.2 uchun)</summary><div class="mk-sit" style="margin-top:10px">${M.sit}</div></details>`;
  h+=`<div class="mtabs">${MT.map(x=>`<button data-t="${x[0]}" class="${x[0]===tab?'on':''}">${x[1]}<small>${wcount(R.t[x[0]])} / ${x[2]}</small></button>`).join('')}</div>`;
  h+=`<div class="card"><div class="prompt">${M[tab]}</div><div class="meta"><span>📝 ${T[2]} so'z</span><span>⏱ tavsiya: ${T[4]} daqiqa</span></div>${editorHTML('ta',T[3],R.t[tab])}</div><button class="btn ok wide" id="fin">✓ Imtihonni yakunlash</button>`;
  $('#app').innerHTML=h+FOOT;
  const ta=wireEditor('ta',T[3],v=>{R.t[tab]=v;const b=$(`.mtabs [data-t="${tab}"] small`);if(b)b.textContent=`${wcount(v)} / ${T[2]}`;clearTimeout(ta._t);ta._t=setTimeout(save,400)});
  $$('.mtabs button').forEach(b=>b.onclick=()=>{save();mock(i,b.dataset.t)});
  if(CLOCK){clearInterval(CLOCK);CLOCK=null}$$('.clock').forEach(e=>e.remove());const ck=document.createElement('div');ck.className='clock';document.body.appendChild(ck);
  const tick=()=>{const left=Math.max(0,3600-Math.floor((Date.now()-R.st)/1000));ck.textContent=`⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;ck.classList.toggle('low',left<300);if(left<=0){clearInterval(CLOCK);CLOCK=null;save();R.end=1;toast('⏰ Vaqt tugadi');mockSelf(i)}};tick();CLOCK=setInterval(tick,1000);
  $('#fin').onclick=()=>{const empty=MT.filter(x=>wcount(R.t[x[0]])<10).map(x=>x[1]);if(empty.length&&!confirm(`${empty.join(', ')} deyarli bo'sh. Baribir yakunlaysizmi?`))return;save();mockSelf(i)}}
const CRIT={t11:[['Topshiriq','Xatdagi barcha savollarga javob berdim, so\'z soni ~50'],['Uslub','Do\'stona, norasmiy: Hi …, qisqartmalar, Best wishes'],['Tuzilma','Salom → reaksiya → javoblar → yakun'],['Grammatika va imlo','Zamonlar to\'g\'ri, katta harf va tinish belgilari joyida']],
 t12:[['Topshiriq','Har bir talabga javob berdim, 120–150 so\'z'],['Uslub','To\'liq rasmiy: Dear …, qisqartmasiz, Yours sincerely/faithfully'],['Tuzilma','Maqsad → asosiy paragraflar → kutilgan harakat → yakun'],['Lug\'at','Rasmiy iboralar: I am writing to…, I would be grateful if…'],['Grammatika va imlo','Murakkab gaplar xatosiz, tinish belgilari to\'g\'ri']],
 p2:[['Topshiriq','Savolga aniq pozitsiya bilan javob, 180–200 so\'z'],['Dalillar','2 ta asosiy fikr, har biri tushuntirish va aniq misol bilan'],['Tuzilma','4 paragraf: kirish, 2 ta asosiy, xulosa'],['Bog\'liqlik','Turli bog\'lovchilar: however, moreover, as a result…'],['Lug\'at','Akademik so\'zlar, takrorlanmaydi, sinonimlar'],['Grammatika','Murakkab tuzilmalar: shart gaplar, passiv, nisbiy gaplar']]};
function mockSelf(i){const M=MOCKS[i],R=S.mk[i];if(CLOCK){clearInterval(CLOCK);CLOCK=null}$$('.clock').forEach(e=>e.remove());R.self=R.self||{};scrollTo(0,0);
  let h=`<div class="card"><h1 style="font-size:24px">O'zingizni baholang</h1><p class="sub">Har topshiriqda o'z matningizni namuna bilan solishtiring va har mezon bo'yicha halol baho bering. Bu rasmiy ball emas, taxminiy ko'rsatkich.</p></div>`;
  MT.forEach(([k,n,wn,task])=>{const n2=wcount(R.t[k]);h+=`<div class="card"><h2 style="font-size:20px">${n} <span class="sub">(${n2} so'z)</span></h2><details style="margin:8px 0"><summary class="sub" style="cursor:pointer;font-weight:800">Matnim va namuna</summary><div class="mine" style="margin:8px 0">${esc(R.t[k])||'<i>bo\'sh</i>'}</div><div class="model">${esc(M['m'+k.replace('t','')]||M['m'+k]||'')}</div></details><details style="margin:8px 0"><summary class="sub" style="cursor:pointer;font-weight:800">🔍 Avto-tekshiruv natijasi</summary>${acHTML(autoCheck(R.t[k]||'',Object.assign({ctx:M.sit+' '+M[k]},task)))}</details>`+
    CRIT[k].map(([cn,cd],j)=>{const v=R.self[k+j];return `<div class="crit"><b>${cn}</b><small>${cd}</small><div class="seg" data-k="${k+j}">${['Yo\'q','Qisman','Ha'].map((s,q)=>`<button data-v="${q}" class="${v===q?'on':''}">${s}</button>`).join('')}</div></div>`}).join('')+`</div>`});
  h+=`<button class="btn ok wide" id="ok" disabled>Natijani hisoblash</button>`;
  $('#app').innerHTML=h+FOOT;const need=MT.reduce((a,x)=>a+CRIT[x[0]].length,0);
  const chk=()=>{$('#ok').disabled=Object.keys(R.self).length<need};chk();
  $$('.seg button').forEach(b=>b.onclick=()=>{const k=b.parentNode.dataset.k;R.self[k]=+b.dataset.v;b.parentNode.querySelectorAll('button').forEach(o=>o.classList.toggle('on',o===b));save();chk()});
  $('#ok').onclick=()=>{const sc={};let tot=0,max=0;MT.forEach(([k,n,wn,task])=>{let s=0;CRIT[k].forEach((_,j)=>s+=R.self[k+j]);const m=CRIT[k].length*2;const wc=wcount(R.t[k]);let f=1;if(wc<task.w[0]*.6)f=.5;else if(wc<task.w[0]*.85)f=.8;sc[k]=Math.round(s/m*f*100);const wt={t11:5,t12:6,p2:6}[k];tot+=s/m*f*wt;max+=wt});
    const pc=Math.round(tot/max*100);const lv=pc>=85?'C1':pc>=65?'B2':pc>=45?'B1':'B1 dan past';Object.assign(R,{fin:1,sc,pc,lv,at:today()});save();mockResult(i)}}
function mockResult(i){scrollTo(0,0);const M=MOCKS[i],R=S.mk[i];setAccent('#1B2433');topbar(`Mock ${i+1}: ${M.t}`,'mocks');
  let h=`<div class="card score"><div class="sub">Taxminiy daraja</div><div style="margin:8px 0"><span class="lvl">${R.lv}</span></div><div class="res"><div><b>${R.sc.t11}%</b><small>Task 1.1</small></div><div><b>${R.sc.t12}%</b><small>Task 1.2</small></div><div><b>${R.sc.p2}%</b><small>Part 2</small></div></div><p class="sub">Umumiy: ${R.pc}% · ${R.at}. Bu o'z-o'zini baholash asosidagi taxmin, rasmiy ball emas. Aniq bahoni o'qituvchingiz beradi.</p>
  <div class="row"><button class="btn" id="cp">📋 O'qituvchiga nusxalash</button><button class="btn g" id="dl">⬇ .txt yuklab olish</button><button class="btn g" id="rt">↺ Qayta ishlash</button></div></div>`;
  MT.forEach(([k,n])=>{h+=`<div class="card"><h2 style="font-size:20px">${n}</h2><div class="prompt" style="margin:10px 0;font-size:15.5px">${M[k]}</div><b>Siz yozdingiz</b> <span class="sub">(${wcount(R.t[k])} so'z)</span><div class="mine" style="margin:6px 0 12px">${esc(R.t[k])||'—'}</div><b>Namuna</b><span class="mlv">${k==='t11'?'B2':'C1'}</span><div class="model" style="margin-top:6px">${esc(M['m'+k.replace('t','')]||M['m'+k])}</div></div>`});
  $('#app').innerHTML=h+FOOT;
  const txt=()=>`Enzo Writing — MOCK ${i+1}: ${M.t}\nO'quvchi: ${S.name||'(ism kiritilmagan)'}\nSana: ${R.at} · o'z bahosi: ${R.lv} (${R.pc}%)\n\n`+MT.map(([k,n])=>`=== ${n} (${wcount(R.t[k])} so'z) ===\n${R.t[k]}`).join('\n\n')+'\n\n© Enzo Academy';
  $('#cp').onclick=()=>copyText(txt());$('#dl').onclick=()=>download(`Mock${i+1}_${(S.name||'oquvchi').replace(/\W+/g,'_')}.txt`,txt());
  $('#rt').onclick=()=>{if(confirm("Oldingi matnlaringiz o'chadi. Qayta boshlaysizmi?")){delete S.mk[i];save();mock(i)}}}

/* ---------- other pages ---------- */
function phraseBank(){setAccent('#1D4ED8');topbar('Iboralar banki','');
  let h=`<div class="card pb"><h1 style="font-size:26px;margin-bottom:6px">Iboralar banki</h1><p class="sub" style="margin:0 0 10px">Tayyor iboralar: bosib nusxalang. <span class="pbi" style="display:inline;border:0;padding:0"><span class="t t-i">norasmiy</span> <span class="t t-f">rasmiy</span> <span class="t t-n">ikkalasi</span></span></p><input id="q" placeholder="Qidirish: opinion, sorry, request, fikr…" aria-label="Qidirish"></div><div class="card pbc" id="pl"></div>`;
  $('#app').innerHTML=h+FOOT;
  const draw=q=>{q=(q||'').toLowerCase();$('#pl').innerHTML=PB.map(c=>{const cm=(c.id+' '+c.t+' '+c.uz).toLowerCase().includes(q);const it=c.items.filter(i=>!q||cm||i.join(' ').toLowerCase().includes(q));if(!it.length)return '';return `<h3>${esc(c.t)}</h3><div class="uz">${esc(c.uz)}</div>`+it.map(i=>`<div class="pbi"><span class="t t-${i[2]||'n'}">${{f:'rasmiy',i:'norasmiy',n:'ikkalasi'}[i[2]||'n']}</span><div class="e"><b>${esc(i[0])}</b><small>${esc(i[1])}</small></div><button data-c="${esc(i[0])}">Nusxa</button></div>`).join('')}).join('')||'<div class="empty">Hech narsa topilmadi</div>';$$('#pl [data-c]').forEach(b=>b.onclick=()=>copyText(b.dataset.c))};
  draw();$('#q').oninput=e=>draw(e.target.value)}
function rubric(){setAccent('#1D4ED8');topbar('Baholash mezonlari','');
  $('#app').innerHTML=`<div class="card th"><h1 style="font-size:26px;margin-bottom:8px">Imtihon tuzilmasi va baholash</h1>
  <table><tr><th>Qism</th><th>Nima yoziladi</th><th>So'z</th><th>Vaqt</th><th>Daraja</th></tr><tr><td><b>Task 1.1</b></td><td>Do'stga norasmiy xat (email)</td><td>~50</td><td>~10 daq</td><td>B1</td></tr><tr><td><b>Task 1.2</b></td><td>Rasmiy xat (email): tashkilot, menejer, muharrirga</td><td>120–150</td><td>~20 daq</td><td>B2</td></tr><tr><td><b>Part 2</b></td><td>Forum posti / insho: fikr bildirish va asoslash</td><td>180–200</td><td>~30 daq</td><td>C1</td></tr></table>
  <p>Task 1.1 va 1.2 bitta vaziyatga asoslanadi: sizga xat yoki e'lon beriladi va ikki kishiga — do'stga va rasmiy shaxsga — yozasiz. Jami vaqt <b>60 daqiqa</b>.</p>
  <h3>Imtihonchilar nimaga qaraydi</h3><ul><li><b>Topshiriqni bajarish</b> — eng muhimi. Har bir savolga javob berilganmi? So'z soni to'g'rimi?</li><li><b>Uslub (register)</b> — do'stga norasmiy, tashkilotga rasmiy. Aralashtirish katta xato.</li><li><b>Tuzilma va bog'liqlik</b> — paragraflar, mantiqiy ketma-ketlik, bog'lovchilar.</li><li><b>Lug'at</b> — aniq va xilma-xil so'zlar, takrorsiz.</li><li><b>Grammatika</b> — oddiy va murakkab gaplar, xatolar soni.</li><li><b>Imlo va tinish belgilari</b> — katta harf, vergul, nuqta.</li></ul>
  <h3>Ball yo'qotishning 7 ta keng tarqalgan sababi</h3><ol><li>Xatdagi bitta savolga javob bermaslik.</li><li>So'z sonidan ancha kam yoki ancha ko'p yozish.</li><li>Rasmiy xatda «Hi», «Thanks a lot», «can't» kabi norasmiy so'zlar.</li><li>Part 2 da pozitsiyaning aniq emasligi.</li><li>Misolsiz, umumiy gaplar.</li><li>Bitta paragrafli «devor» matn.</li><li>Yodlangan, mavzuga mos kelmaydigan shablon.</li></ol>
  <div class="tip">Bu kursdagi mock natijasi — o'z-o'zini baholash asosidagi taxmin. Rasmiy ballni faqat imtihon beradi.</div></div>`+FOOT}
function myWork(){setAccent('#1D4ED8');topbar('Yozganlarim','');
  const ws=Object.entries(S.wr).map(([id,w])=>[LI[id],w]).filter(x=>x[0]);
  let h=`<div class="card"><h1 style="font-size:26px">Yozganlarim</h1><p class="sub" style="margin:6px 0 0">${ws.length} ta topshiriq · jami ${ws.reduce((a,x)=>a+x[1].n,0)} so'z</p><div class="row"><button class="btn" id="all" ${ws.length?'':'disabled'}>⬇ Hammasini .txt qilib yuklab olish</button></div></div><div class="card">`;
  h+=ws.length?ws.map(([l,w])=>`<div class="mrow"><div class="tx"><b>${l.i+1}. ${esc(l.t)}</b><small>${w.at} · ${w.n} so'z</small></div><button class="btn g" data-l="${l.id}">Ochish</button><button class="btn g" data-c="${l.id}">📋</button></div>`).join(''):'<div class="empty">Hali topshiriq yo\'q. Birinchi darsdan boshlang!</div>';
  $('#app').innerHTML=h+'</div>'+FOOT;
  $$('[data-l]').forEach(b=>b.onclick=()=>go(`l/${b.dataset.l}/wr`));$$('[data-c]').forEach(b=>b.onclick=()=>copyText(teacherText(b.dataset.c)));
  $('#all').onclick=()=>download(`Enzo_Writing_${(S.name||'oquvchi').replace(/\W+/g,'_')}.txt`,ws.map(([l])=>teacherText(l.id)).join('\n\n------------------------\n\n'))}
function mistakes(){setAccent('#A61E4D');topbar('Xatolar banki','');
  if(!S.bank.length){$('#app').innerHTML=`<div class="card empty">Xatolar banki bo'sh. Mashqlarda xato qilgan savollaringiz shu yerga tushadi va takrorlab olasiz.</div>`+FOOT;return}
  $('#app').innerHTML=`<div class="card"><h1 style="font-size:26px">Xatolar banki</h1><p class="sub" style="margin:6px 0 0">${S.bank.length} ta savol. To'g'ri javob berganingiz bankdan o'chadi.</p></div><div id="body"></div>`+FOOT;
  const list=S.bank.slice(-15).map(b=>b.x);
  exercises(null,$('#body'),list,(p,r,n,wr)=>{const wk=new Set(wr.map(x=>hstr(JSON.stringify(x))));S.bank=S.bank.filter(b=>!list.some(x=>hstr(JSON.stringify(x))===b.k)||wk.has(b.k));save();
    $('#body').innerHTML=`<div class="card score"><div class="big ${p>=PASS?'pass':'fail'}">${p}%</div><p class="sub">${r} / ${n} to'g'ri · bankda ${S.bank.length} ta savol qoldi</p><div class="row"><button class="btn" onclick="render()">↺ Yana takrorlash</button><button class="btn g" onclick="go('')">Bosh sahifa</button></div></div>`})}
function teacher(){setAccent('#1B2433');topbar("O'qituvchi paneli",'');
  if(!sessionStorage.getItem('mlw_t')){$('#app').innerHTML=`<div class="card"><h1 style="font-size:24px;margin-bottom:10px">O'qituvchi paneli</h1><input class="inp" type="password" id="pw" placeholder="Parol"><div class="row"><button class="btn dk" id="in">Kirish</button></div></div>`+FOOT;
    const f=()=>{if(hstr($('#pw').value)===TH){try{sessionStorage.setItem('mlw_t','1')}catch(e){}teacher()}else toast("Parol noto'g'ri")};$('#in').onclick=f;$('#pw').onkeydown=e=>{if(e.key==='Enter')f()};return}
  $('#app').innerHTML=`<div class="card"><h1 style="font-size:24px">O'qituvchi paneli</h1><p class="sub">O'quvchi: <b>${esc(S.name||'—')}</b> · ${nDone()}/${LESSONS.length} dars · ${Object.keys(S.wr).length} ta yozma ish</p>
  <label style="font-weight:800;display:block;margin-top:12px">Qaysi darsgacha ochish:</label><select class="inp" id="un"><option value="0">Ketma-ket (standart)</option>${LESSONS.slice(1).map(l=>`<option value="${l.i}" ${S.unlock===l.i?'selected':''}>${l.i+1}. ${esc(l.t)}</option>`).join('')}<option value="${LESSONS.length}" ${S.unlock>=LESSONS.length?'selected':''}>Hammasi + mocklar</option></select>
  <div class="row"><button class="btn dk" id="sv">Saqlash</button><button class="btn g" id="ex">⬇ Barcha ishlarni yuklab olish</button><button class="btn g" id="rs" style="color:var(--red)">Progressni o'chirish</button></div></div>
  <div class="card"><b>Mock natijalari</b>${MOCKS.map((m,i)=>S.mk[i]&&S.mk[i].fin?`<div class="mrow"><div class="tx"><b>${i+1}. ${esc(m.t)}</b><small>${S.mk[i].at} · ${S.mk[i].lv} · ${S.mk[i].pc}%</small></div></div>`:'').join('')||'<div class="empty">Hali yo\'q</div>'}</div>`+FOOT;
  $('#sv').onclick=()=>{S.unlock=+$('#un').value;save();toast('Saqlandi')};
  $('#ex').onclick=()=>{const t=[...Object.keys(S.wr).filter(id=>LI[id]).map(teacherText),...MOCKS.map((m,i)=>S.mk[i]&&S.mk[i].fin?`MOCK ${i+1}: ${m.t} (${S.mk[i].lv})\n`+MT.map(([k,n])=>`=== ${n} ===\n${S.mk[i].t[k]}`).join('\n\n'):'').filter(Boolean)].join('\n\n------------------------\n\n');download(`Enzo_Writing_${(S.name||'oquvchi').replace(/\W+/g,'_')}_hammasi.txt`,t||"Hali ish yo'q")};
  $('#rs').onclick=()=>{if(confirm("Bu qurilmadagi barcha progress va matnlar o'chadi. Ishonchingiz komilmi?")){localStorage.removeItem(KEY);location.hash='';location.reload()}}}
render();
