task:{type:'p2',w:[180,200],time:30,prompt:`<p>You are taking part in an online discussion about education. Write your post answering the question:</p><p><b>«Should school uniforms be compulsory?»</b></p><p>Give reasons and examples. Write <b>180–200 words</b>. 4 paragraf: kirish (pozitsiya), 2 ta asosiy, xulosa. Paragraflar orasida bo'sh qator qoldiring.</p>`,
frame:"The question of whether … is often debated. In my view, … .\n\nThe main reason is that … . This means that … . For example, … .\n\nAdmittedly, … . However, … .\n\nIn conclusion, … .",
model:"The question of whether pupils should be required to wear school uniforms is often debated by parents and teachers. In my view, uniforms should remain compulsory, as their advantages outweigh the drawbacks.\n\nThe main reason is that uniforms reduce social pressure among students. When everyone wears the same clothes, children from poorer families do not feel embarrassed, and nobody is judged by expensive brands. As a result, pupils can focus on their studies rather than their appearance. For example, in many Uzbek schools, teachers notice fewer conflicts about clothing since uniforms became standard.\n\nAdmittedly, critics argue that uniforms limit self-expression and can be expensive for large families. However, schools can solve these problems by choosing simple, affordable designs and allowing students to express their personality through hobbies, clubs and projects. Moreover, a uniform is usually cheaper than buying a fashionable wardrobe for every day of the week, so it can actually save families money.\n\nIn conclusion, I firmly believe that compulsory uniforms create a fairer and more focused learning environment. Rather than abolishing them, schools should make them comfortable and affordable for every family.",ml:'C1',
ck:["Kirishda aniq pozitsiya","Ikkita asosiy paragraf, har birida dalil + tushuntirish","Kamida bitta aniq misol","Xulosada pozitsiya boshqa so'zlar bilan","4 paragraf, 180–200 so'z, qisqartmasiz"]}});

L({m:'m4',id:'m4l2',t:'Analysing the question',uz:"Savolni tahlil qilish: savol turlari",min:30,
goal:"Part 2 savolining turini aniqlash va har bir tur uchun mos tuzilmani tanlash.",
th:[
{h:"5 asosiy savol turi",b:`<table><tr><th>Tur</th><th>Savol namunasi</th><th>Nima qilish kerak</th></tr>
<tr><td><b>Fikr</b> (agree/disagree)</td><td class="en">Do you agree that…? / Should…?</td><td>Aniq pozitsiya, 2 dalil</td></tr>
<tr><td><b>Ikki fikr</b> (discuss)</td><td class="en">Some people think…, others believe… Discuss both views and give your opinion.</td><td>Ikkala tomon + o'z fikringiz</td></tr>
<tr><td><b>Afzallik / kamchilik</b></td><td class="en">What are the advantages and disadvantages of…?</td><td>Ikkala tomon (+ qaysi biri ustun)</td></tr>
<tr><td><b>Muammo / yechim</b></td><td class="en">What problems does… cause? How can they be solved?</td><td>Muammolar + yechimlar</td></tr>
<tr><td><b>Ikki qismli</b></td><td class="en">Why is this happening? Is it positive or negative?</td><td>Har bir savolga alohida paragraf</td></tr></table>`},
{h:"Kalit so'zlarni belgilash",b:`<p>Savolni o'qib, uch narsani belgilang:</p><ol><li><b>Mavzu</b> (topic): <span class="en">online learning</span></li><li><b>Aniq yo'nalish</b> (focus): <span class="en">for university students</span></li><li><b>Topshiriq so'zi</b>: <span class="en">Do you agree? / Discuss / What are…</span></li></ol>
<div class="ex">«Online learning is better than classroom learning <b>for university students</b>. Do you agree?» — faqat <b>universitet talabalari</b> haqida yozing, maktab o'quvchilari haqida emas.</div>`},
{h:"Mavzudan chetga chiqmaslik",b:`<div class="warn">Savol «shahardagi transport» haqida bo'lsa, umuman «shahar hayoti» haqida yozish — «off-topic». Har paragrafni yozib bo'lgach, savolga qaytib qarang.</div>`}],
ex:[
['m',"«Some people think university should be free; others disagree. Discuss both views and give your opinion.» Type?",["Problem / solution","Discuss both views","Advantages / disadvantages"],1,"«Discuss both views»."],
['m',"«What problems are caused by traffic in big cities, and how can they be solved?» Type?",["Problem / solution","Agree / disagree","Discuss both views"],0,"Muammo + yechim."],
['m',"«Do you agree that social media does more harm than good?» Type?",["Opinion (agree/disagree)","Advantages / disadvantages","Two-part"],0,"Fikr turi."],
['m',"«Online learning is better for university students.» What is the FOCUS?",["Online learning","University students","Learning in general"],1,"Faqat universitet talabalari."],
['m',"«Why do young people move to cities? Is this a positive or negative trend?» How many questions?",["One","Two","Three"],1,"① nega? ② ijobiymi yoki salbiy?"],
['m',"For «advantages and disadvantages», which plan fits best?",["Body 1: advantages, Body 2: disadvantages","Only advantages","Only a story"],0,"Har tomonga bitta paragraf."],

['m',"What is the danger of ignoring the focus words?",["None","Writing off-topic and losing marks","Writing too little"],1,"Off-topic — task balini yo'qotish."]],
task:{type:'para',w:[60,100],time:12,prompt:`<p>Quyidagi 3 ta savolning har biri uchun yozing: <b>savol turi</b>, <b>mavzu va fokus</b>, <b>4 paragraf rejasi</b> (kalit so'zlar). Jami 60–100 so'z.</p><ol><li>«Some people believe that robots will take most jobs in the future. Do you agree?»</li><li>«What are the advantages and disadvantages of living with your parents as an adult?»</li><li>«Many rivers and lakes are polluted. What are the causes and what can be done?»</li></ol>`,
model:"1. Opinion question. Topic: robots and jobs; focus: most jobs, future. Plan: intro, partly disagree; body 1, robots will replace routine jobs such as factory work; body 2, new jobs will appear, for example in IT; conclusion.\n\n2. Advantages and disadvantages. Topic: living with parents; focus: adults. Plan: intro; body 1, saving money and family support; body 2, less independence and privacy; conclusion, advantages are stronger.\n\n3. Problem and solution. Topic: water pollution; focus: causes and solutions. Plan: intro; body 1, factories and farming chemicals; body 2, strict laws and recycling; conclusion.",ml:'B2–C1',
ck:["Har savol turi to'g'ri aniqlangan","Fokus so'zlari belgilangan","Har biri uchun 4 qismli reja","Ikki qismli savolda ikkala qism rejada bor","Kalit so'zlar — to'liq gaplar shart emas"]}});

L({m:'m4',id:'m4l3',t:'Writing the introduction',uz:"Kirish paragrafi: paraphrase + pozitsiya",min:30,
goal:"2–3 gapli kuchli kirish yozish: mavzuni qayta aytish, pozitsiya va (ixtiyoriy) reja.",
th:[
{h:"Kirish formulasi",b:`<ol><li><b>Umumiy gap / paraphrase</b> — savolni o'z so'zlaringiz bilan.</li><li><b>Pozitsiya</b> — aniq fikringiz.</li><li><b>(Ixtiyoriy) reja</b> — qaysi dalillarni ko'rib chiqasiz.</li></ol>
<div class="ex">Savol: «Should the government spend more money on public transport than on roads?»<br><br>Kirish: <b>Deciding how to invest in transport is one of the main challenges for modern cities.</b> <b>In my opinion, public transport deserves greater funding than roads,</b> <b>as it reduces traffic and pollution and benefits a wider part of society.</b></div>`},
{h:"Kirishda nima qilmaslik kerak",b:`<ul><li>Savolni so'zma-so'z ko'chirish — ko'chirilgan so'zlar hisoblanmaydi.</li><li>«Nowadays, technology is developing very fast» kabi har mavzuga mos «universal» gaplar.</li><li>Juda uzun kirish (60+ so'z) — asosiy qismga joy qolmaydi.</li><li>Pozitsiyasiz kirish: «There are many opinions about this.» — bu hech narsa demaydi.</li></ul>`},
{h:"Pozitsiya iboralari",b:`<div class="ex">In my view, … · I strongly believe that… · I would argue that… · I partly agree with this idea: … · While there are some benefits, I believe the drawbacks are more significant.</div>
<div class="tip">«Discuss both views» savolida ham pozitsiya kirishda bo'lishi mumkin: <span class="en">Although both views have merit, I tend to agree with those who…</span></div>`}],
cmp:{bad:"Nowadays, technology is developing very fast and it is very important in our life. Many people have different opinions about whether children should have smartphones. In this essay I will discuss this question.",good:"Smartphones have become part of daily life even for very young children. However, I believe that children under twelve should not own one, as the risks to their health and concentration outweigh the benefits.",why:["Universal, mazmunsiz birinchi gap almashtirildi.","«Many people have different opinions» — pozitsiya emas. O'ng tomonda aniq fikr bor.","Qisqa sabab (as…) — o'quvchiga keyingi paragraflarni oldindan ko'rsatadi."]},
ex:[
['m',"Which is the best first sentence for «Should university education be free?»",["Nowadays, education is very important.","The cost of higher education has become a major concern for many families.","Should university education be free?"],1,"Mavzuga aniq, ko'chirilmagan."],
['m',"Which sentence states a clear position?",["There are many opinions about this.","I strongly believe that university should be free for talented students.","This essay will discuss it."],1,"Aniq pozitsiya."],
['m',"What is wrong with copying the question in the introduction?",["Nothing","Copied words do not show your language ability","It is too short"],1,"O'z so'zlaringiz kerak."],
['o',["Working from home has become increasingly common.","In my view, it benefits both employees and companies,","as it saves time and reduces costs."],"Umumiy gap → pozitsiya → sabab."],
['f',"I ___ agree with this idea: technology helps, but it cannot replace teachers. (qisman)",["partly","partially"],"<b>I partly agree…</b>"],
['m',"How long should the introduction be?",["About 10 words","About 30–40 words","About 100 words"],1,"~35 so'z."],

task:{type:'para',w:[30,55],time:10,prompt:`<p>Quyidagi savol uchun <b>faqat kirish paragrafini</b> yozing (<b>30–55 so'z</b>): mavzuni o'z so'zlaringiz bilan ayting va aniq pozitsiya bildiring.</p><p><b>«Some people think that young people should travel and work for a year before starting university. Do you agree?»</b></p>`,
model:"Taking a gap year between school and university has become increasingly popular in many countries. In my view, spending a year working or travelling can be extremely valuable for young people, as it helps them become more independent and choose their future career more wisely.",ml:'C1',
ck:["Savol so'zma-so'z ko'chirilmagan","Aniq pozitsiya","Qisqa sabab yoki reja","«Nowadays technology…» kabi universal gap yo'q","30–55 so'z"]}});

L({m:'m4',id:'m4l4',t:'The art of paraphrasing',uz:"Paraphrase san'ati: sinonim, so'z shakli, tuzilma",min:30,
goal:"Fikrni boshqa so'zlar bilan ifodalashning uch usulini egallash — kirish va xulosa uchun zarur.",
th:[
{h:"1-usul: sinonimlar",b:`<table><tr><th>So'z</th><th>Sinonimlar</th></tr><tr><td>important</td><td class="en">essential, vital, crucial, significant</td></tr><tr><td>problem</td><td class="en">issue, challenge, difficulty</td></tr><tr><td>people</td><td class="en">individuals, citizens, the public</td></tr><tr><td>children</td><td class="en">young people, minors, pupils</td></tr><tr><td>increase</td><td class="en">rise, grow, go up</td></tr><tr><td>help</td><td class="en">benefit, support, assist</td></tr><tr><td>think</td><td class="en">believe, argue, claim, maintain</td></tr><tr><td>nowadays</td><td class="en">these days, in modern society, today</td></tr></table>
<div class="warn">Sinonim ma'nosi aynan mos bo'lsin. «Children» → «kids» (norasmiy), «babies» (noto'g'ri).</div>`},
{h:"2-usul: so'z turkumini o'zgartirish",b:`<div class="ex">Technology <b>develops</b> rapidly. → The rapid <b>development</b> of technology…<br>Pollution is <b>harmful</b>. → Pollution <b>harms</b>… / causes <b>harm</b>…<br>People <b>depend</b> on cars. → People's <b>dependence</b> on cars…</div>`},
{h:"3-usul: tuzilmani o'zgartirish",b:`<div class="ex">Active → Passive: Governments should fund public transport. → Public transport should <b>be funded</b> by governments.<br>Gap tartibi: Many people believe that… → <b>It is widely believed that…</b><br>Ergash gap: Because prices are high, … → <b>Due to high prices</b>, …</div>
<div class="tip">Eng yaxshi paraphrase 2–3 usulni birlashtiradi: <span class="en">«Many young people move to cities to find work.» → «The search for employment is driving a growing number of young people to urban areas.»</span></div>`}],
ex:[
['m',"Best synonym for «important» in academic writing:",["big","crucial","nice"],1,"<b>crucial</b>"],
['m',"«The problem of pollution» — best paraphrase of «problem»:",["the issue of pollution","the trouble thing of pollution","the bad of pollution"],0,"<b>the issue of</b>"],
['r',"Nominalizatsiya qiling: «The rapid …» bilan boshlang.","Technology develops rapidly, and this changes our lives.",["The rapid development of technology changes our lives.","The rapid development of technology is changing our lives.","The rapid development of technology has changed our lives."],"develops → <b>development</b>"],
['r',"«It is widely believed that …» bilan qayta yozing.","Many people believe that exercise improves mood.",["It is widely believed that exercise improves mood."],"Shaxssiz tuzilma."],
['r',"Passivga aylantiring.","Governments should fund public transport.",["Public transport should be funded by governments.","Public transport should be funded by the government."],"<b>should be funded</b>"],
['m',"Which paraphrase keeps the meaning of «Children spend too much time online»?",["Young people spend an excessive amount of time on the internet.","Babies love computers.","Kids are online sometimes."],0,"Ma'no saqlangan, akademik."],
['f',"Due ___ high prices, fewer people buy new cars.",["to"],"<b>Due to</b> + ot."],
['m',"Which is NOT a good synonym for «people» in an essay?",["individuals","citizens","guys"],2,"<b>guys</b> — norasmiy."]],
task:{type:'para',w:[50,90],time:12,prompt:`<p>Har bir gapni <b>kamida 2 usul</b> bilan (sinonim + tuzilma yoki so'z turkumi) paraphrase qiling. Har biri yangi qatordan. Jami 50–90 so'z.</p><ol><li>Many young people find it difficult to buy a house.</li><li>The government should do more to protect the environment.</li><li>Children who read a lot usually do better at school.</li><li>Fast food is becoming more popular in Uzbekistan.</li></ol>`,
model:"1. Purchasing a home has become a serious challenge for a growing number of young adults.\n2. It is essential that the authorities take stronger action to protect the natural environment.\n3. Pupils who read regularly tend to achieve better academic results.\n4. The popularity of fast food is rising rapidly across Uzbekistan, especially among teenagers.",ml:'C1',
ck:["Har gapda kamida 2 usul","Ma'no o'zgarmagan","Norasmiy sinonim yo'q","Kamida bitta nominalizatsiya yoki passiv","Grammatika to'g'ri"]}});

L({m:'m4',id:'m4l5',t:'Body paragraphs: PEEL',uz:"Asosiy paragraf: PEEL usuli",min:35,
goal:"Har asosiy paragrafni Point → Explain → Example → Link tuzilmasi bilan to'liq rivojlantirish.",
th:[
{h:"PEEL",b:`<table><tr><th>Harf</th><th>Nima</th><th>Iboralar</th></tr>
<tr><td><b>P</b>oint</td><td>Asosiy fikr (topic sentence)</td><td class="en">The main reason is that… / Firstly, …</td></tr>
<tr><td><b>E</b>xplain</td><td>Nega? Qanday? Natija?</td><td class="en">This is because… / This means that… / As a result, …</td></tr>
<tr><td><b>E</b>xample</td><td>Aniq misol</td><td class="en">For example, … / A clear example of this is…</td></tr>
<tr><td><b>L</b>ink</td><td>Savolga / pozitsiyaga qaytish</td><td class="en">Therefore, … / This shows that…</td></tr></table>`},
{h:"Tushuntirishni chuqurlashtirish",b:`<p>B1 va C1 orasidagi asosiy farq — <b>tushuntirish chuqurligi</b>. «Sport is good because it is healthy» — yuzaki. Zanjir qiling: <b>sabab → oqibat → oqibatning oqibati</b>.</p>
<div class="ex">Regular exercise strengthens the heart. <b>As a result,</b> people are less likely to suffer from heart disease, <b>which in turn</b> reduces the pressure on hospitals and healthcare budgets.</div>`},
{h:"Bitta paragraf — bitta asosiy fikr",b:`<p>Bir paragrafga 3–4 ta dalilni tiqishtirmang. Ikkita yaxshi rivojlangan dalil > beshta yuzaki dalil.</p>`}],
an:{title:"PEEL amalda",sub:"Savol: Should cities ban cars from the centre?",text:"[[Firstly, banning cars from city centres would significantly improve air quality.]] [[Vehicle emissions are one of the main sources of pollution in large cities, and they are linked to asthma and other breathing problems.]] [[If fewer cars entered the centre, pollution levels would fall, which in turn would reduce the number of people needing medical treatment.]] [[For example, after Madrid restricted traffic in its central district, levels of nitrogen dioxide dropped noticeably within a year.]] [[This shows that a car-free centre is an effective way to protect public health.]]",notes:["P — Point: aniq asosiy fikr.","E — Explain 1: nega? (sabab).","E — Explain 2: oqibat zanjiri (which in turn…).","E — Example: aniq, real misol.","L — Link: pozitsiyaga qaytish."]},
ex:[
['o',["Online courses make education more accessible.","This is because students can study from anywhere at any time.","For example, a student in a small village can take a course from a top university.","Therefore, online learning helps reduce inequality."],"P → E → E → L"],
['m',"Which sentence develops an explanation most deeply?",["Sport is good.","Sport is healthy because it is good.","Exercise lowers stress hormones, so people sleep better and perform better at work."],2,"Sabab → oqibat zanjiri."],
['f',"This means fewer accidents, which in ___ reduces pressure on hospitals.",["turn"],"<b>which in turn</b> — bu esa o'z navbatida."],
['m',"What does the «L» in PEEL do?",["Lists more ideas","Links back to the question or your position","Leaves the topic"],1,"Savol / pozitsiyaga qaytish."],
['m',"How many main ideas should one body paragraph have?",["One","Four","As many as possible"],0,"Bitta asosiy fikr."],
['s',[["The main reason is that tourism creates jobs.",0],["This is because hotels and restaurants need staff.",1],["For instance, Khiva's hotels employ hundreds of locals.",2],["Therefore, tourism benefits local communities.",3]],["Point","Explain","Example","Link"],"Har gapning vazifasi."],
['m',"Which link sentence is best for a paragraph arguing for free public transport?",["I like buses.","This shows that free public transport would benefit the whole city.","Buses are blue."],1,"Pozitsiyaga qaytish."]],
task:{type:'para',w:[60,90],time:12,prompt:`<p>Savol: <b>«Should students be allowed to use their phones in class?»</b></p><p>PEEL usulida <b>bitta asosiy paragraf</b> yozing (<b>60–90 so'z</b>). Tushuntirishda kamida bitta oqibat zanjiri (<i>As a result, … which in turn …</i>) bo'lsin.</p>`,
frame:"[P] The main reason is that … .\n[E] This is because … . As a result, … , which in turn … .\n[E] For example, … .\n[L] Therefore, … .",
model:"The main reason why phones should not be allowed in class is that they seriously reduce concentration. This is because notifications constantly interrupt students' attention. As a result, they miss important explanations, which in turn leads to lower test results. For example, a teacher at my lyceum noticed that marks improved after the school introduced phone boxes at the classroom door. Therefore, banning phones during lessons helps students learn more effectively.",ml:'C1',
ck:["Aniq asosiy gap (Point)","Tushuntirish oqibat zanjiri bilan","Aniq misol","Link — pozitsiyaga qaytish","60–90 so'z, bitta asosiy fikr"]}});

L({m:'m4',id:'m4l6',t:'Evidence and examples',uz:"Dalil va misollar: ishonchli qilish",min:30,
goal:"Imtihonda ishonchli, aniq misollarni tez topish va soxta statistika ishlatmaslik.",
th:[
{h:"Misol turlari",b:`<ol><li><b>Shaxsiy tajriba:</b> <span class="en">When I started using a planner app, my productivity improved noticeably.</span></li><li><b>Mahalliy misol:</b> <span class="en">In Tashkent, the expansion of the metro has made commuting easier for thousands of workers.</span></li><li><b>Xalqaro misol:</b> <span class="en">Countries such as Finland, where homework is limited, still achieve excellent results.</span></li><li><b>Gipotetik misol:</b> <span class="en">If a family spends two hours a day on their phones, they lose more than 700 hours of time together each year.</span></li></ol>`},
{h:"Soxta statistika — xavfli",b:`<div class="warn">«According to research, 87.3% of students…» — imtihonchi bu raqamni to'qilgan deb biladi. Aniq raqam o'rniga ehtiyotkor iboralar: <span class="en">many studies suggest…, a growing number of…, the majority of…</span></div>`},
{h:"Ehtiyotkor (hedging) til",b:`<p>C1 yozuvchi mutlaq gaplardan qochadi:</p><table><tr><th>Mutlaq</th><th>Ehtiyotkor</th></tr><tr><td>Phones destroy children's brains.</td><td class="en">Excessive phone use may harm children's development.</td></tr><tr><td>Everyone hates homework.</td><td class="en">Many students find homework stressful.</td></tr><tr><td>This will solve the problem.</td><td class="en">This would help to reduce the problem.</td></tr></table>`},
{h:"Misolni kiritish iboralari",b:`<div class="ex">For example, … · For instance, … · A good example of this is… · This can be seen in… · Take, for instance, … · such as + ot</div>`}],
ex:[
['m',"Which example is most convincing in an exam?",["According to research, 92.4% of people agree.","For instance, many families in Uzbekistan now order groceries online, which saves them hours every week.","Everyone knows this."],1,"Real, aniq, to'qilmagan."],
['m',"Which sentence uses cautious (hedged) language?",["Video games destroy children.","Video games may affect children's sleep if they play late at night.","Video games are 100% bad."],1,"<b>may</b> + shart — ehtiyotkor."],
['f',"Take, ___ instance, the city of Seoul.",["for"],"<b>Take, for instance, …</b>"],
['r',"Ehtiyotkor qiling («Excessive … may …»).","Social media destroys teenagers' self-esteem.",["Excessive use of social media may damage teenagers' self-esteem.","Excessive use of social media may harm teenagers' self-esteem.","Excessive social media use may damage teenagers' self-esteem.","Excessive social media use may harm teenagers' self-esteem.","Excessive use of social media may lower teenagers' self-esteem."],"<b>may</b> + yumshoqroq fe'l."],
['m',"Instead of «87% of people», what can you write?",["the majority of people","exactly 87.000%","all people"],0,"<b>the majority of</b>"],
['s',[["When I joined a football club, I made many new friends.",0],["In Samarkand, tourism has created thousands of jobs.",1],["Countries such as Japan have very efficient trains.",2],["If every family recycled one bottle a day, cities would save tonnes of plastic.",3]],["Shaxsiy","Mahalliy","Xalqaro","Gipotetik"],"Misol turlari."],
['m',"Which phrase introduces an example?",["As a result,","A good example of this is","In conclusion,"],1,"Misol iborasi."]],
task:{type:'para',w:[60,90],time:12,prompt:`<p>Savol: <b>«Is it better to live in a big city or in the countryside?»</b></p><p>Pozitsiyangizni tanlang va bitta asosiy paragraf yozing (<b>60–90 so'z</b>). Unda <b>2 xil turdagi misol</b> (masalan, shaxsiy + mahalliy) va kamida bitta <b>ehtiyotkor ibora</b> (may, tend to, many…) bo'lsin. Soxta statistika ishlatmang.</p>`,
model:"In my opinion, big cities offer far better opportunities for young people. Universities, hospitals and well-paid jobs tend to be concentrated in urban areas. For example, most international companies in Uzbekistan have their offices in Tashkent, so graduates from the regions often have to move there. My own cousin left his village after university and found a job in a bank within a month. Therefore, for those who want to build a career, the city may be the most practical choice.",ml:'C1',
ck:["Pozitsiya aniq","2 xil turdagi misol","Ehtiyotkor ibora bor (tend to, may, often…)","To'qilgan aniq statistika yo'q","60–90 so'z"]}});

L({m:'m4',id:'m4l7',t:'Writing the conclusion',uz:"Xulosa paragrafi",min:25,
goal:"2–3 gapli xulosa: pozitsiyani qayta aytish, asosiy dalillarni umumlashtirish va yakuniy fikr.",
th:[
{h:"Xulosa formulasi",b:`<ol><li><b>Signal + pozitsiya</b> (boshqa so'zlar bilan): <span class="en">In conclusion, I firmly believe that…</span></li><li><b>Asosiy dalillar xulosasi</b> (bitta gapda): <span class="en">…because it improves health and reduces costs.</span></li><li><b>Yakuniy fikr</b>: tavsiya, bashorat yoki chaqiriq: <span class="en">Governments should therefore… / In the future, …</span></li></ol>`},
{h:"Xulosada nima qilmaslik kerak",b:`<ul><li><b>Yangi dalil</b> qo'shmang — u asosiy qismda bo'lishi kerak edi.</li><li><b>Pozitsiyani o'zgartirmang</b>: kirishda «agree», xulosada «disagree» — eng og'ir mantiqiy xato.</li><li>Kirishni <b>so'zma-so'z takrorlamang</b>.</li></ul>`},
{h:"Signal iboralari",b:`<div class="ex">In conclusion, · To sum up, · Overall, · All things considered, · Taking everything into account, · For these reasons,</div>`}],
cmp:{bad:"In conclusion, school uniforms should be compulsory. Also, uniforms are good for the economy because factories make money. That's why I disagree with uniforms.",good:"In conclusion, I am convinced that compulsory uniforms create a fairer and calmer learning environment. Rather than abolishing them, schools should focus on making them affordable for every family.",why:["Chapda yangi dalil (economy) qo'shilgan — xulosada mumkin emas.","Chapda pozitsiya o'zgargan (should be compulsory → I disagree) — mantiqsiz.","O'ngda: pozitsiya boshqa so'zlar bilan + yakuniy tavsiya."]},
ex:[
['m',"What should a conclusion NOT contain?",["A restated opinion","A brand-new argument","A final recommendation"],1,"Yangi dalil — yo'q."],
['m',"Introduction: «I believe homework should be limited.» Which conclusion is consistent?",["In conclusion, more homework is the answer.","To sum up, limiting homework would give students more time to rest and develop other skills.","Overall, I have no opinion."],1,"Pozitsiya bir xil."],
['f',"All things ___, I believe the advantages are greater. (hisobga olinganda)",["considered"],"<b>All things considered</b>"],
['o',["In conclusion, I firmly believe that cycling should be encouraged,","as it improves health and reduces traffic.","City councils should therefore build more bike lanes."],"Pozitsiya → dalillar → tavsiya."],
['m',"Which is the best final sentence?",["That's all.","If these measures are taken, our cities will become cleaner and healthier places to live.","Thank you for reading!"],1,"Kelajakka nazar — kuchli yakun."],
['m',"How long should the conclusion be?",["One word","About 25–40 words","About 100 words"],1,"~30 so'z."],
['x',"In conclusion, I am agree that technology helps students.",["In conclusion, I agree that technology helps students."],"<b>I agree</b>"]],
task:{type:'para',w:[25,50],time:8,prompt:`<p>Quyidagi kirish va asosiy fikrlar uchun <b>faqat xulosa paragrafini</b> yozing (<b>25–50 so'z</b>).</p><p><i>Kirish:</i> «I strongly believe that learning to cook should be a compulsory subject at school.»<br><i>Asosiy 1:</i> sog'lom ovqatlanish, fast-food kamayadi.<br><i>Asosiy 2:</i> mustaqillik, pul tejash.</p>`,
model:"In conclusion, I am convinced that cooking lessons should be part of every school timetable. They would teach young people to eat more healthily and help them become independent adults who can manage their money wisely.",ml:'C1',
ck:["Signal ibora (In conclusion / To sum up…)","Pozitsiya boshqa so'zlar bilan, o'zgarmagan","Ikki asosiy fikr qisqa umumlashtirilgan","Yangi dalil yo'q","25–50 so'z"]}});

L({m:'m4',id:'m4l8',t:'Opinion questions: agree or disagree',uz:"Fikr savollari: qo'shilasizmi?",min:35,
goal:"«Do you agree?» va «To what extent…?» savollariga to'liq, izchil post yozish.",
th:[
{h:"Uch xil pozitsiya",b:`<table><tr><th>Pozitsiya</th><th>Kirish iborasi</th><th>Tuzilma</th></tr>
<tr><td>To'liq qo'shilish</td><td class="en">I completely agree that…</td><td>Asosiy 1: dalil · Asosiy 2: dalil</td></tr>
<tr><td>To'liq qarshi</td><td class="en">I strongly disagree with the idea that…</td><td>Asosiy 1: dalil · Asosiy 2: dalil</td></tr>
<tr><td>Qisman</td><td class="en">I partly agree: although…, I believe…</td><td>Asosiy 1: rozi tomon · Asosiy 2: qarshi tomon (asosiysi)</td></tr></table>
<div class="tip">Eng xavfsiz va kuchli usul: <b>bitta tomonga</b> qo'shiling, lekin asosiy 2 da qarshi fikrni qisqa tan olib, uni rad eting (concession + rebuttal).</div>`},
{h:"Concession + rebuttal",b:`<div class="ex"><b>Admittedly / It is true that</b> online shopping can be convenient. <b>However,</b> this convenience comes at a cost to local businesses, many of which are forced to close.</div><div class="ex"><b>Critics may argue that</b> uniforms are expensive. <b>Nevertheless,</b> they are usually cheaper than fashionable clothes.</div>`},
{h:"«To what extent…?»",b:`<p>Bu savol darajani so'raydi: <span class="en">To a large extent, … · To some extent, … · I agree only to a limited extent.</span> Pozitsiyangizni shu iboralar bilan aniq qiling.</p>`}],
ex:[
['m',"Which phrase shows a partial opinion?",["I completely agree.","I agree only to a limited extent.","I strongly disagree."],1,"<b>to a limited extent</b>"],
['f',"___, public transport can be crowded. However, it is far cheaper than driving. (tan olish)",["Admittedly","Admittedly,"],"<b>Admittedly,</b> — concession."],
['o',["Critics may argue that video games are a waste of time.","Nevertheless, many games improve problem-solving skills","and teach players to work in teams."],"Concession → rebuttal."],
['m',"Your introduction says «I strongly disagree». What should Body 2 do?",["Agree completely","Either give another reason against, or admit an opposing point and reject it","Change the topic"],1,"Izchil pozitsiya."],
['m',"«To what extent do you agree?» Which answer fits?",["Yes.","To a large extent, I agree, although there are some exceptions.","Maybe."],1,"Daraja ko'rsatilgan."],
['r',"Concession qiling («It is true that …, but …» bilan).","Working from home saves time. It can make people feel isolated.",["It is true that working from home saves time, but it can make people feel isolated."],"Tan olish + qarshi fikr."],
['m',"Which is the strongest rebuttal word in formal writing?",["but","Nevertheless,","and"],1,"<b>Nevertheless,</b>"]],
task:{type:'p2',w:[180,200],time:30,prompt:`<p>You are taking part in an online discussion about modern life. Write your post answering the question:</p><p><b>«Some people say that social media does more harm than good. Do you agree?»</b></p><p>Give reasons and examples. Write <b>180–200 words</b>. Asosiy 2 da concession + rebuttal ishlating.</p>`,
model:"Social media has transformed the way people communicate, share news and spend their free time. In my view, it does more harm than good, particularly for young people.\n\nThe main reason is that social media damages mental health. Platforms are designed to keep users scrolling for as long as possible, and constant comparison with others' perfect photos can make people feel inadequate. As a result, many teenagers suffer from anxiety and poor sleep, which in turn affects their studies. For example, several of my classmates admit that they check Instagram late at night and then struggle to wake up for lessons.\n\nAdmittedly, social media helps people stay in touch with relatives abroad and allows small businesses to advertise cheaply. However, these benefits could be achieved with far less time online. Moreover, the spread of false information on these platforms can cause real harm, from health myths to panic during emergencies.\n\nIn conclusion, although social media has some useful functions, I believe its negative effects on mental health and public trust outweigh them. Users, especially young people, should learn to limit the time they spend online.",ml:'C1',
ck:["Kirishda aniq pozitsiya","Asosiy 1: PEEL (dalil + tushuntirish + misol)","Asosiy 2: concession + rebuttal","Xulosa pozitsiyaga mos","180–200 so'z, 4 paragraf"]}});

L({m:'m4',id:'m4l9',t:'Discuss both views',uz:"Ikki fikrni muhokama qilish + o'z fikringiz",min:35,
goal:"«Discuss both views and give your opinion» savoliga muvozanatli va aniq yakunlangan post yozish.",
th:[
{h:"Tuzilma",b:`<ol><li><b>Kirish:</b> ikki fikrni qisqa ayting + o'z pozitsiyangiz (yoki «xulosada aytaman» deb).</li><li><b>Asosiy 1:</b> birinchi fikr tarafdorlari nima deydi va nega (siz qo'shilmasangiz ham — adolatli yozing).</li><li><b>Asosiy 2:</b> ikkinchi fikr — odatda <b>siz qo'shilgan</b> tomon, kuchliroq dalillar bilan.</li><li><b>Xulosa:</b> o'z fikringiz aniq.</li></ol>`},
{h:"Boshqalarning fikrini aytish iboralari",b:`<div class="ex">Supporters of this view argue that… · Those who believe… point out that… · On the one hand, some people claim that… · It is often argued that…</div><div class="ex">On the other hand, others maintain that… · Opponents of this idea believe that…</div>`},
{h:"O'z fikringizni ajratib ko'rsatish",b:`<p>Asosiy 1 da boshqalarning fikri — <b>«they argue»</b>. Asosiy 2 va xulosada — <b>«I believe»</b>. Bu farq o'quvchiga kimning fikri ekanini aniq ko'rsatadi.</p>
<div class="warn">Eng ko'p xato: ikki tomonni tasvirlab, o'z fikrini umuman aytmaslik. Topshiriq «give your opinion» desa, bu majburiy.</div>`}],
ex:[
['m',"«Discuss both views and give your opinion.» What is compulsory?",["Only one view","Both views AND your opinion","Only your opinion"],1,"Ikkala fikr + o'z fikringiz."],
['f',"Supporters of this view ___ that exams motivate students. (ta'kidlaydi)",["argue","claim","believe","maintain"],"<b>argue / claim</b>"],
['m',"Which phrase introduces the second view?",["For example,","On the other hand,","In conclusion,"],1,"<b>On the other hand,</b>"],
['m',"In Body 1 (the view you disagree with), which verb is best?",["I believe","Some people argue","I am sure"],1,"Boshqalarning fikri — «they argue»."],
['o',["Some people believe that children should start school at five,","while others think seven is a better age.","Although both views have merit,","I believe that starting later is more beneficial."],"Kirish: ikki fikr + pozitsiya."],
['m',"Where must your opinion be stated clearly?",["Nowhere","At least in the conclusion (ideally also in the introduction)","Only in the title"],1,"Kamida xulosada."],
['f',"Those who support homework point ___ that it builds discipline.",["out"],"<b>point out that…</b>"]],
task:{type:'p2',w:[180,200],time:30,prompt:`<p>You are taking part in an online discussion about education. Write your post answering the question:</p><p><b>«Some people think that students should choose subjects they enjoy at university. Others believe they should choose subjects that lead to well-paid jobs. Discuss both views and give your opinion.»</b></p><p>Write <b>180–200 words</b>.</p>`,
model:"Choosing a university subject is one of the most important decisions a young person makes. While some argue that students should follow their interests, others believe that future income should come first. In my view, passion should be the main factor.\n\nThose who prioritise salary point out that education is expensive, and graduates need to support themselves and their families. Subjects such as computer science or finance usually lead to secure, well-paid careers. For example, many parents in Uzbekistan encourage their children to study economics because of the strong demand for accountants and bankers.\n\nOn the other hand, students who study what they enjoy tend to work harder and achieve better results. Moreover, people who love their jobs are more likely to become experts, which often leads to high earnings in the long run. A student who chooses medicine only for money, for instance, may struggle to cope with years of difficult study.\n\nIn conclusion, although financial security is important, I believe that genuine interest leads to greater success and satisfaction. Ideally, students should look for a subject that combines what they enjoy with good career prospects.",ml:'C1',
ck:["Kirishda ikkala fikr + pozitsiya","Asosiy 1: birinchi fikr adolatli, «they argue» bilan","Asosiy 2: ikkinchi fikr + misol","Xulosada o'z fikringiz aniq","180–200 so'z, 4 paragraf"]}});

L({m:'m4',id:'m4l10',t:'Advantages and disadvantages',uz:"Afzallik va kamchiliklar",min:35,
goal:"«What are the advantages and disadvantages…?» va «Do the advantages outweigh…?» savollariga post yozish.",
th:[
{h:"Ikki xil savol",b:`<table><tr><th>Savol</th><th>Pozitsiya kerakmi</th></tr><tr><td class="en">What are the advantages and disadvantages of…?</td><td>Shart emas, lekin xulosada qisqa baho — plyus</td></tr><tr><td class="en">Do the advantages outweigh the disadvantages?</td><td><b>Ha, majburiy</b>: qaysi tomon ustun?</td></tr></table>`},
{h:"Tuzilma",b:`<p>Kirish → Asosiy 1: afzalliklar (1–2 ta, misol bilan) → Asosiy 2: kamchiliklar (1–2 ta) → Xulosa: qaysi biri ustun va nega.</p>
<div class="tip">«Outweigh» savolida ustun deb hisoblagan tomoningizni <b>ikkinchi</b> asosiy paragrafga qo'ying — u oxirida qoladi va kuchliroq ta'sir qiladi.</div>`},
{h:"Lug'at",b:`<div class="ex">One major advantage of… is that… · Another benefit is… · A further drawback is… · The main disadvantage is… · On the downside, … · The benefits clearly outweigh the drawbacks. · …far outweigh…</div>`}],
ex:[
['m',"«Do the advantages outweigh the disadvantages?» — is an opinion required?",["No","Yes, you must say which side is stronger","Only if you want"],1,"Majburiy."],
['f',"One major ___ of online shopping is convenience. (afzallik)",["advantage","benefit"],"<b>advantage / benefit</b>"],
['m',"A synonym for «disadvantage» is…",["drawback","benefit","merit"],0,"<b>drawback</b>"],
['m',"«The benefits clearly ___ the drawbacks.»",["outweigh","overweight","outwait"],0,"<b>outweigh</b>"],
['s',[["It saves time.",0],["It can be addictive.",1],["It is cheaper.",0],["It reduces face-to-face contact.",1],["It is available 24/7.",0]],["Afzallik","Kamchilik"],"Onlayn xizmatlar haqida."],
['m',"Where should you place the side you think is stronger?",["In Body 1","In Body 2, closer to the conclusion","In the introduction only"],1,"Oxirida — kuchliroq ta'sir."],
['f',"On the ___, flying is one of the most polluting forms of travel. (salbiy tomondan)",["downside"],"<b>On the downside,</b>"]],
task:{type:'p2',w:[180,200],time:30,prompt:`<p>You are taking part in an online discussion about work. Write your post answering the question:</p><p><b>«More and more people are working from home. Do the advantages of this trend outweigh the disadvantages?»</b></p><p>Write <b>180–200 words</b>.</p>`,
model:"Since the pandemic, working from home has become a normal part of life for millions of employees. Although this trend has some drawbacks, I believe its advantages are far more significant.\n\nAdmittedly, remote work can be isolating. Employees miss informal conversations with colleagues, which may reduce teamwork and creativity. In addition, some people find it difficult to separate their job from family life, especially in small flats where there is no quiet space to work.\n\nHowever, the benefits are considerable. Firstly, workers save the time and money they would otherwise spend commuting. For example, an employee in Tashkent who travels an hour each way gains ten extra hours every week, which can be spent with family or on exercise. Secondly, companies can reduce office costs and hire talented people from any region, not only from the capital. As a result, both businesses and employees become more flexible and productive.\n\nIn conclusion, while working from home is not perfect, I am convinced that its benefits outweigh its disadvantages. A combination of home and office days may offer the best of both worlds.",ml:'C1',
ck:["Kirishda qaysi tomon ustunligi aytilgan","Kamchiliklar bitta paragrafda (concession)","Afzalliklar ikkinchi paragrafda, misol bilan","Xulosada «outweigh» haqida aniq javob","180–200 so'z, 4 paragraf"]}});

L({m:'m4',id:'m4l11',t:'Problems, causes and solutions',uz:"Muammo, sabab va yechim savollari",min:35,
goal:"Sabab/muammo va yechimlarni bir-biriga bog'langan holda yozish.",
th:[
{h:"Savol variantlari",b:`<div class="ex">What problems does X cause? How can they be solved?<br>What are the causes of X? What can be done about it?<br>Why is X happening? What measures could be taken?</div><p>Tuzilma: <b>Kirish → Asosiy 1: sabablar/muammolar → Asosiy 2: yechimlar → Xulosa</b>.</p>`},
{h:"Yechim muammoga mos bo'lsin",b:`<p>Eng kuchli postda har bir yechim aniq bir muammoga javob beradi:</p><table><tr><th>Muammo</th><th>Yechim</th></tr><tr><td class="en">Factories release waste into rivers.</td><td class="en">Stricter laws and heavy fines for polluting companies.</td></tr><tr><td class="en">People are unaware of the damage.</td><td class="en">Public awareness campaigns in schools and media.</td></tr></table>`},
{h:"Lug'at",b:`<div class="ex">One of the main causes of… is… · …is largely due to… · …has led to… · This problem could be tackled by… · One effective solution would be to… · The government should introduce… · Individuals can also play a role by…</div>
<div class="tip">Yechimlarni turli darajada bering: <b>davlat</b> (laws, investment), <b>jamiyat</b> (schools, companies), <b>shaxs</b> (individuals). Bu chuqurlik ko'rsatadi.</div>`}],
ex:[
['m',"Traffic jams are largely ___ the rise in car ownership.",["due to","because","so"],0,"<b>due to</b> + ot."],
['f',"This problem could be ___ by improving public transport. (hal qilmoq)",["tackled","solved","addressed"],"<b>tackled / addressed</b>"],
['m',"Which solution matches «People throw rubbish in parks because there are few bins»?",["Build more roads","Install more bins and fine people who litter","Close the parks"],1,"Yechim muammoga mos."],
['o',["One of the main causes of obesity is fast food.","Cheap, high-calorie meals are available everywhere.","One effective solution would be to tax sugary products,","which would encourage healthier choices."],"Sabab → tushuntirish → yechim → natija."],
['m',"Which shows solutions at different levels?",["Government laws, school programmes and individual habits","Only one idea","No solutions"],0,"Davlat, jamiyat, shaxs."],
['f',"The rise in online shopping has ___ to the closure of many small shops.",["led"],"<b>has led to</b>"],
['m',"Two-part question: «Why…? What can be done?» Which plan is correct?",["Body 1: causes, Body 2: solutions","Body 1 and 2: only causes","Only a conclusion"],0,"Har qismga paragraf."]],
task:{type:'p2',w:[180,200],time:30,prompt:`<p>You are taking part in an online discussion about cities. Write your post answering the question:</p><p><b>«In many cities, air pollution is becoming a serious problem. What are the main causes, and what can be done to improve the situation?»</b></p><p>Write <b>180–200 words</b>.</p>`,
model:"Air pollution has become one of the most serious threats to public health in many growing cities, including Tashkent. In my view, it is mainly caused by traffic and outdated heating systems, but it can be reduced through a combination of government action and individual responsibility.\n\nThe main cause is the rapid increase in the number of cars. Many vehicles are old and burn fuel inefficiently, releasing harmful gases into the air. In addition, during winter, some households and small businesses still burn coal for heating, which creates thick smog. As a result, more people suffer from asthma and other breathing problems.\n\nSeveral measures could tackle this problem. Firstly, the government should invest in clean public transport, such as electric buses and new metro lines, so that fewer people need to drive. Secondly, stricter emission standards and financial support for modern heating systems would reduce coal burning. Individuals can also play a role, for example by sharing cars or cycling short distances.\n\nIn conclusion, air pollution is largely caused by transport and heating, but with determined action from both authorities and citizens, our cities can become much healthier places to live.",ml:'C1',
ck:["Ikkala savol qismiga javob (sabablar va yechimlar)","Har yechim aniq sababga mos","Yechimlar turli darajada (davlat / shaxs)","Misollar bor","180–200 so'z, 4 paragraf"]}});

L({m:'m4',id:'m4l12',t:'Part 2 under exam conditions',uz:"Part 2: 30 daqiqalik strategiya",min:40,
goal:"Part 2 ni 30 daqiqada reja, yozish va tekshiruv bilan yakunlash.",
th:[
{h:"30 daqiqa rejasi",b:`<table><tr><th>Vaqt</th><th>Nima qilasiz</th></tr><tr><td>0–5 daq</td><td>Savol turi, fokus so'zlari, pozitsiya, 2 dalil + 2 misol (kalit so'zlar)</td></tr><tr><td>5–25 daq</td><td>Yozish: kirish (3 daq) → asosiy 1 (7) → asosiy 2 (7) → xulosa (3)</td></tr><tr><td>25–30 daq</td><td>Tekshirish</td></tr></table>`},
{h:"Fikr kelmasa: «SPEECH» usuli",b:`<p>Har qanday mavzu uchun dalillarni shu sohalardan qidiring: <b>S</b>ociety (jamiyat), <b>P</b>ersonal (shaxsiy rivojlanish), <b>E</b>conomy (iqtisod, pul), <b>E</b>nvironment (atrof-muhit), <b>C</b>ulture/education (madaniyat, ta'lim), <b>H</b>ealth (sog'liq).</p>`},
{h:"Oxirgi 5 daqiqa tekshiruvi",b:`<ol><li>Savolning har qismiga javob bormi?</li><li>Pozitsiya kirish va xulosada bir xilmi?</li><li>4 paragraf, har birida bitta asosiy fikr?</li><li>180–200 so'z?</li><li>Qisqartmalar yo'qmi? Takrorlangan so'zlar?</li><li>3-shaxs -s, artikllar, ko'plik, zamonlar.</li></ol>`},
{h:"Mavzu banki",b:`<p>Ko'p uchraydigan mavzular: <b>ta'lim</b> (onlayn ta'lim, uy vazifasi, imtihonlar), <b>texnologiya</b> (sun'iy intellekt, telefonlar, ijtimoiy tarmoqlar), <b>atrof-muhit</b> (plastik, transport, iqlim), <b>shahar</b> (urbanizatsiya, uy-joy), <b>ish</b> (masofaviy ish, ish-hayot muvozanati), <b>sog'liq</b> (sport, fast-food), <b>madaniyat</b> (turizm, an'analar), <b>oila</b> (avlodlar, bolalar tarbiyasi).</p>`}],
ex:[
['m',"How long should you plan Part 2?",["About 5 minutes","15 minutes","None"],0,"~5 daqiqa."],
['m',"You can't think of arguments. Which method helps?",["Write about something else","Check areas like society, economy, environment and health","Stop writing"],1,"SPEECH usuli."],
['m',"Your intro says «agree», your conclusion says «disagree». This is…",["Fine","A serious coherence problem","A sign of C1"],1,"Pozitsiya izchil bo'lishi shart."],
['o',["Identify question type and focus","Decide position and plan","Write introduction and body paragraphs","Write conclusion","Check and correct"],"Part 2 algoritmi."],
['m',"Which is NOT part of the final check?",["Word count","Counting the number of letters in each word","Contractions"],1,"Mantiqiy tekshiruv kerak."],
['m',"Your post has 240 words. What do you do?",["Leave it — more is better","Cut repetition to get close to 200","Add 50 more words"],1,"Talab 180–200."],
['m',"Approximately how many minutes for each body paragraph?",["1","7","20"],1,"~7 daqiqa."]],
task:{type:'p2',w:[180,200],time:30,prompt:`<p><b>Imtihon sharoiti — taymerni 30 daqiqaga qo'ying!</b></p><p>You are taking part in an online discussion about technology and education. Write your post answering the question:</p><p><b>«Artificial intelligence tools can now write essays and solve homework. Should schools and universities ban them?»</b></p><p>Give reasons and examples. Write <b>180–200 words</b>.</p>`,
model:"Artificial intelligence tools that can write essays in seconds have caused serious concern among teachers. However, I believe that banning them completely would be a mistake; instead, schools should teach students to use them responsibly.\n\nThe main reason is that AI will be an essential part of almost every profession in the future. If students never learn how to use these tools, they will be poorly prepared for the modern workplace. For example, programmers and journalists already use AI to check code and summarise documents, saving hours of routine work. Moreover, a ban would be almost impossible to enforce, since these tools are freely available on every phone.\n\nAdmittedly, there is a real risk that some students will simply copy AI answers without thinking. Nevertheless, teachers can reduce this problem by changing how they assess learning, for instance through oral presentations, handwritten tests in class and projects based on personal experience.\n\nIn conclusion, rather than banning artificial intelligence, educational institutions should adapt to it. By setting clear rules and redesigning assignments, they can turn a potential threat into a valuable learning tool.",ml:'C1',
ck:["30 daqiqada yozdim, 5 daqiqa reja bilan","Aniq va izchil pozitsiya","Har asosiy paragrafda tushuntirish + misol","Concession + rebuttal","180–200 so'z, 4 paragraf, tekshiruv qilindi"]}});

L({m:'m5',id:'m5l1',t:'Sentence variety',uz:"Gap turlarini xilma-xil qilish",min:35,
goal:"Oddiy, qo'shma va murakkab gaplarni almashtirib, sifatdosh iboralar va inversiya bilan C1 ritmiga erishish.",
th:[
{h:"Nega xilma-xillik",b:`<p>Hamma gap bir xil uzunlikda va bir xil boshlansa (I think… I think… It is…), matn monoton bo'ladi. C1 matnida qisqa va uzun gaplar, turli boshlanishlar almashinadi.</p>`},
{h:"Gapni turlicha boshlash",b:`<table><tr><th>Usul</th><th>Misol</th></tr>
<tr><td>Ravish bilan</td><td class="en"><b>Surprisingly,</b> the cheaper option was more popular.</td></tr>
<tr><td>Ergash gap bilan</td><td class="en"><b>Although</b> the plan was expensive, it was approved.</td></tr>
<tr><td>Sifatdosh (-ing) bilan</td><td class="en"><b>Living</b> far from the city, many families depend on cars.</td></tr>
<tr><td>Sifatdosh (-ed) bilan</td><td class="en"><b>Built</b> in the 15th century, the madrasa attracts thousands of visitors.</td></tr>
<tr><td>Predlogli ibora bilan</td><td class="en"><b>In many rural areas,</b> internet access remains limited.</td></tr></table>
<div class="warn">Sifatdosh iborasining egasi asosiy gapning egasi bilan bir xil bo'lsin: «<s>Walking to school, the rain started.</s>» (yomg'ir yurmaydi!) → <span class="en">Walking to school, I got caught in the rain.</span></div>`},
{h:"Inversiya — kuchli urg'u",b:`<div class="ex"><b>Not only</b> does exercise improve health, <b>but</b> it <b>also</b> reduces stress.<br><b>Rarely</b> have we seen such rapid change.<br><b>Only by</b> investing in education <b>can</b> we reduce poverty.</div>
<div class="tip">Inversiyani post uchun 1 marta ishlatish yetarli — ko'p bo'lsa sun'iy eshitiladi.</div>`},
{h:"Cleft sentences — urg'u",b:`<div class="ex"><b>What</b> worries me most <b>is</b> the cost. · <b>It is</b> the lack of jobs <b>that</b> forces young people to leave.</div>`}],
ex:[
['r',"-ed sifatdosh bilan boshlang («Built in …»).","The mosque was built in 1514. It is the city's main attraction.",["Built in 1514, the mosque is the city's main attraction."],"<b>Built in…,</b> + asosiy gap."],
['r',"-ing sifatdosh bilan boshlang («Living …»).","Many students live far from campus, so they spend hours travelling.",["Living far from campus, many students spend hours travelling."],"Ega bir xil: students."],
['m',"Which sentence has a dangling participle (mistake)?",["Walking home, I saw an accident.","Walking home, the accident happened.","Tired after work, she went to bed."],1,"Hodisa yurmaydi — ega mos emas."],
['r',"Inversiya qiling: «Not only …, but … also …»","Cycling saves money, and it keeps you fit.",["Not only does cycling save money, but it also keeps you fit."],"<b>Not only does…, but… also…</b>"],
['r',"Cleft gap qiling: «What worries me most is …»","The cost worries me most.",["What worries me most is the cost."],"<b>What… is…</b> — urg'u."],
['m',"Which beginning adds variety?",["I think… I think… I think…","Surprisingly, … / Although…, … / In rural areas, …","It is… It is… It is…"],1,"Turli boshlanishlar."],
['f',"Only by working together ___ we solve this problem.",["can"],"Inversiya: <b>Only by… can we…</b>"],
['r',"«It is … that …» bilan urg'u bering.","The lack of jobs forces young people to leave villages.",["It is the lack of jobs that forces young people to leave villages."],"Cleft: <b>It is… that…</b>"]],
task:{type:'para',w:[80,120],time:15,prompt:`<p>Quyidagi monoton paragrafni qayta yozing (<b>80–120 so'z</b>). Kamida ishlating: <b>1 ta sifatdosh iborasi</b> (-ing yoki -ed), <b>1 ta inversiya yoki cleft</b>, <b>3 xil gap boshlanishi</b>.</p><p><i>«Tourism is important for Uzbekistan. It brings money. It creates jobs. Many tourists visit Samarkand. Samarkand is very old. Tourists buy souvenirs. Local people sell souvenirs. Tourism also has problems. Prices go up. I think the government should control prices.»</i></p>`,
model:"Tourism has become one of the most important sectors of Uzbekistan's economy. Not only does it bring in foreign currency, but it also creates thousands of jobs for local people. Founded more than two thousand years ago, Samarkand attracts visitors from all over the world, many of whom buy handmade souvenirs from local craftsmen. However, this growth has a downside. In popular areas, prices for food and housing have risen sharply, making life harder for residents. What is needed, therefore, is careful government regulation to ensure that tourism benefits everyone.",ml:'C1',
ck:["Sifatdosh iborasi (Founded… / Living…)","Inversiya yoki cleft gap","Kamida 3 xil gap boshlanishi","Qisqa va uzun gaplar aralash","Ma'no saqlangan, 80–120 so'z"]}});

L({m:'m5',id:'m5l2',t:'Academic vocabulary and collocations',uz:"Akademik lug'at va kollokatsiyalar",min:35,
goal:"Tabiiy so'z birikmalarini (collocations) va akademik so'zlarni to'g'ri ishlatish.",
th:[
{h:"Kollokatsiya nima",b:`<p>Ba'zi so'zlar «juft» bo'lib keladi. O'zbekchadan to'g'ridan-to'g'ri tarjima ko'pincha noto'g'ri birikma beradi: «<s>do a mistake</s>» → <span class="en">make a mistake</span>.</p>`},
{h:"Fe'l + ot",b:`<table><tr><th>make</th><th>do</th><th>take</th><th>play / pay / raise</th></tr>
<tr><td class="en">a decision, a mistake, progress, an effort, a difference</td><td class="en">research, damage, homework, harm, your best</td><td class="en">action, measures, responsibility, a risk, steps</td><td class="en">play a role · pay attention · raise awareness</td></tr></table>`},
{h:"Sifat + ot",b:`<div class="ex">a <b>significant</b> increase · a <b>major</b> problem · a <b>growing</b> number of · <b>serious</b> consequences · <b>strong</b> evidence · a <b>key</b> factor · <b>heavy</b> traffic · <b>high</b> unemployment · a <b>wide</b> range of</div>
<div class="warn">«<s>big traffic</s>» → heavy traffic; «<s>strong rain</s>» → heavy rain; «<s>high growth of prices</s>» → a sharp rise in prices.</div>`},
{h:"Oddiy → akademik",b:`<table><tr><th>Oddiy</th><th>Akademik</th></tr><tr><td>very big</td><td class="en">enormous, substantial</td></tr><tr><td>get worse</td><td class="en">deteriorate</td></tr><tr><td>get better</td><td class="en">improve</td></tr><tr><td>bad effect</td><td class="en">negative impact, adverse effect</td></tr><tr><td>good thing</td><td class="en">benefit, advantage</td></tr><tr><td>show</td><td class="en">indicate, demonstrate</td></tr><tr><td>think about</td><td class="en">consider</td></tr><tr><td>a lot of</td><td class="en">a considerable amount / number of</td></tr></table>`}],
ex:[
['m',"Governments must ___ action to reduce pollution.",["make","do","take"],2,"<b>take action</b>"],
['m',"Teachers ___ a key role in children's development.",["play","make","do"],0,"<b>play a role</b>"],
['m',"There is ___ traffic in the city centre every morning.",["big","heavy","strong"],1,"<b>heavy traffic</b>"],
['x',"Students often do mistakes in articles.",["Students often make mistakes with articles.","Students often make mistakes in articles."],"<b>make mistakes</b>"],
['m',"A ___ number of young people are moving abroad.",["growing","big growing","high"],0,"<b>a growing number of</b>"],
['f',"Campaigns can help ___ awareness of environmental problems. (oshirmoq)",["raise"],"<b>raise awareness</b>"],
['m',"Academic synonym for «get worse»:",["deteriorate","worsen up","go bad"],0,"<b>deteriorate</b>"],
['m',"Smoking has an ___ effect on health.",["adverse","adversary","advert"],0,"<b>adverse effect</b>"],
['f',"Students should pay more ___ to their health. (e'tibor)",["attention"],"<b>pay attention</b>"]],
task:{type:'para',w:[80,120],time:15,prompt:`<p>Savol: <b>«What can be done to encourage people to eat more healthily?»</b></p><p>Bitta asosiy paragraf yozing (<b>80–120 so'z</b>). Kamida <b>6 ta kollokatsiya</b> ishlating (take action, play a role, raise awareness, a growing number of, serious consequences, make a difference…) va ularning tagiga e'tibor bilan tekshiring.</p>`,
model:"One of the most effective ways to encourage healthier eating is to raise awareness from an early age. Schools play a key role in this process, as children form most of their eating habits before they turn twelve. A growing number of countries have already taken action by banning sugary drinks in school canteens and introducing cooking lessons. Such measures can make a real difference, since poor diet in childhood often has serious consequences later in life, including obesity and diabetes. In addition, governments could make healthy food more affordable by reducing taxes on fruit and vegetables.",ml:'C1',
ck:["Kamida 6 ta to'g'ri kollokatsiya","make/do/take chalkashtirilmagan","Akademik sifatlar (significant, serious, key…)","Paragraf PEEL tuzilmasida","80–120 so'z"]}});

L({m:'m5',id:'m5l3',t:'Conditionals and modals for arguments',uz:"Dalil uchun shart gaplar va modal fe'llar",min:35,
goal:"Taklif, bashorat va gipotezalarni shart gaplar va modallar bilan aniq va nozik ifodalash.",
th:[
{h:"Shart gaplar xaritasi",b:`<table><tr><th>Tur</th><th>Formula</th><th>Vazifasi</th><th>Misol</th></tr>
<tr><td>1-shart</td><td>If + present, will</td><td>Real natija</td><td class="en">If the city builds more bike lanes, more people will cycle.</td></tr>
<tr><td>2-shart</td><td>If + past, would</td><td>Gipoteza, taklif natijasi</td><td class="en">If public transport were free, traffic would decrease.</td></tr>
<tr><td>3-shart</td><td>If + had done, would have done</td><td>O'tmish haqida afsus</td><td class="en">If the factory had been inspected, the disaster would have been avoided.</td></tr>
<tr><td>Aralash</td><td>If + had done, would + fe'l</td><td>O'tmish → hozir</td><td class="en">If I had studied economics, I would have a better job now.</td></tr></table>`},
{h:"Shart so'zlarining muqobillari",b:`<div class="ex"><b>Unless</b> action is taken, … (= if not)<br><b>Provided that / As long as</b> the rules are clear, …<br><b>Without</b> government support, many farmers would go bankrupt.<br><b>Were</b> the government to invest more, … (rasmiy inversiya)</div>`},
{h:"Modallar — ishonch darajasi",b:`<table><tr><th>Ishonch</th><th>Modal</th></tr><tr><td>Juda yuqori</td><td class="en">will, must</td></tr><tr><td>Yuqori</td><td class="en">should, is likely to</td></tr><tr><td>O'rta</td><td class="en">may, could, might</td></tr></table>
<p>Tavsiya: <span class="en">should, ought to, need to</span>. Majburiyat: <span class="en">must, have to</span>. O'tmishdagi tanqid: <span class="en">should have done</span>.</p>`}],
ex:[
['m',"If public transport ___ free, more people would use it.",["is","were","will be"],1,"2-shart: <b>were</b>."],
['m',"If the company ___ the warning, the accident would not have happened.",["listened to","had listened to","would listen to"],1,"3-shart: <b>had listened</b>."],
['f',"___ action is taken, the problem will get worse. (agar … bo'lmasa)",["Unless"],"<b>Unless</b> = if… not."],
['r',"2-shart bilan qayta yozing («If … were …, … would …»).","Electric cars are expensive, so few people buy them.",["If electric cars were cheaper, more people would buy them.","If electric cars were less expensive, more people would buy them."],"Hozirgi holatga zid gipoteza."],
['m',"Which modal shows the weakest certainty?",["will","should","might"],2,"<b>might</b>"],
['r',"Aralash shart gap qiling.","I didn't learn English as a child, so I am not fluent now.",["If I had learned English as a child, I would be fluent now.","If I had learnt English as a child, I would be fluent now."],"O'tmish sharti → hozirgi natija."],
['m',"The government ___ have acted sooner. (o'tmishdagi tanqid)",["should","must","will"],0,"<b>should have done</b>"],
['f',"___ that the rules are clear, students will follow them. (agar … bo'lsa)",["Provided","As long as","Providing"],"<b>Provided that…</b>"]],
task:{type:'para',w:[80,120],time:15,prompt:`<p>Savol: <b>«Should cities make public transport free?»</b></p><p>Bitta asosiy paragraf yozing (<b>80–120 so'z</b>). Kamida <b>2 xil shart gap</b> (masalan, 2-shart va unless), <b>2 xil modal</b> (should, might, could…) ishlating.</p>`,
model:"Making public transport free could transform life in large cities. If buses and the metro were free, many drivers would leave their cars at home, which would reduce both traffic jams and air pollution. Low-income families might also benefit significantly, as transport costs can take a large share of their budget. However, unless the government finds a reliable source of funding, the quality of the service may decline. Cities should therefore consider gradual steps, such as free travel for students and pensioners, provided that the system remains financially stable.",ml:'C1',
ck:["2-shart gap (If … were/past, … would)","Unless / provided that","Kamida 2 xil modal","Ishonch darajasi nozik (may, might, could)","80–120 so'z"]}});

L({m:'m5',id:'m5l4',t:'Passive and impersonal structures',uz:"Passiv va shaxssiz tuzilmalar",min:30,
goal:"Ob'ektiv, akademik ohang uchun passiv va «It is …» tuzilmalarini ishlatish.",
th:[
{h:"Nega passiv",b:`<p>Kim qilgani muhim bo'lmasa yoki noma'lum bo'lsa, passiv ishlatiladi. Akademik matnda u ob'ektivlik beradi.</p><div class="ex">Thousands of trees <b>are cut down</b> every year. · New laws <b>have been introduced</b>. · Measures <b>should be taken</b>.</div>`},
{h:"Passiv zamonlar",b:`<table><tr><th>Zamon</th><th>Passiv</th></tr><tr><td>Present Simple</td><td class="en">is/are + V3</td></tr><tr><td>Past Simple</td><td class="en">was/were + V3</td></tr><tr><td>Present Perfect</td><td class="en">has/have been + V3</td></tr><tr><td>Modal</td><td class="en">should/can/must be + V3</td></tr><tr><td>Continuous</td><td class="en">is being + V3</td></tr></table>`},
{h:"Shaxssiz «It is…» tuzilmalari",b:`<div class="ex">It is widely believed that… · It is often argued that… · It has been suggested that… · It is essential that… · It is worth noting that…</div><div class="ex">Students <b>are said to</b> spend too much time online. · Prices <b>are expected to</b> rise.</div>
<div class="tip">«People say that…» → <span class="en">It is said that…</span> — bitta harakat bilan ohang akademiklashadi.</div>`},
{h:"Haddan oshirmang",b:`<p>Har gapni passiv qilmang — matn og'ir bo'lib qoladi. Post uchun 3–4 ta passiv/shaxssiz tuzilma yetarli.</p>`}],
ex:[
['r',"Passivga aylantiring.","The government has introduced new laws.",["New laws have been introduced by the government.","New laws have been introduced."],"<b>have been introduced</b>"],
['r',"«It is widely believed that …» bilan boshlang.","Many people believe that technology makes life easier.",["It is widely believed that technology makes life easier."],"Shaxssiz tuzilma."],
['f',"Immediate action must ___ taken.",["be"],"Modal passiv: <b>must be taken</b>."],
['m',"Prices are expected ___ next year.",["rising","to rise","rise"],1,"<b>are expected to + fe'l</b>"],
['r',"Passivga aylantiring.","People cut down thousands of trees every year.",["Thousands of trees are cut down every year."],"<b>are cut down</b>"],
['m',"Which sentence is most academic?",["People say that exercise is good.","It is often argued that exercise improves mental health.","Everyone knows exercise is good."],1,"Shaxssiz, aniq."],
['f',"It has ___ suggested that school should start later.",["been"],"<b>It has been suggested that…</b>"],
['x',"The new bridge was build in 2020.",["The new bridge was built in 2020."],"V3: <b>built</b>."]],
task:{type:'para',w:[80,120],time:15,prompt:`<p>Savol: <b>«What can be done to reduce plastic waste?»</b></p><p>Bitta asosiy paragraf yozing (<b>80–120 so'z</b>). Kamida <b>3 ta passiv</b> (turli zamonlarda) va <b>2 ta shaxssiz tuzilma</b> (It is…, are expected to…) ishlating.</p>`,
model:"It is widely accepted that plastic waste has become one of the most serious environmental problems of our time. Millions of tonnes of plastic are thrown away every year, and much of it ends up in rivers and seas. In several countries, single-use plastic bags have already been banned, and similar measures should be introduced in Uzbekistan. It is also essential that recycling is made easier for ordinary people, for example by placing separate bins in every neighbourhood. If such steps are taken, the amount of plastic waste is expected to fall significantly.",ml:'C1',
ck:["Kamida 3 ta passiv","Kamida 2 ta shaxssiz tuzilma","Passivlar turli zamonlarda","Matn og'ir emas — aktiv gaplar ham bor","80–120 so'z"]}});

L({m:'m5',id:'m5l5',t:'Relative clauses and concision',uz:"Nisbiy gaplar va ixchamlik",min:30,
goal:"Ortiqcha so'zlarni qisqartirib, nisbiy gaplar bilan zich va aniq yozish — so'z limitida muhim.",
th:[
{h:"Ixchamlik nega muhim",b:`<p>Task 1.2 da 150, Part 2 da 200 so'z — chegara. Har bir ortiqcha so'z dalil uchun joyni oladi. Ixcham matn ham ilmiyroq eshitiladi.</p>`},
{h:"Ortiqcha iboralarni qisqartirish",b:`<table><tr><th>Uzun</th><th>Ixcham</th></tr><tr><td>due to the fact that</td><td class="en">because</td></tr><tr><td>at this moment in time</td><td class="en">now</td></tr><tr><td>in order to</td><td class="en">to</td></tr><tr><td>a large number of</td><td class="en">many</td></tr><tr><td>in my personal opinion I think</td><td class="en">I believe</td></tr><tr><td>each and every</td><td class="en">every</td></tr><tr><td>past history / future plans</td><td class="en">history / plans</td></tr><tr><td>It is a fact that … </td><td>(o'chiring)</td></tr></table>`},
{h:"Nisbiy gaplarni qisqartirish",b:`<div class="ex">Students <s>who are</s> living abroad… → Students living abroad…<br>The rules <s>which were</s> introduced last year… → The rules introduced last year…<br>Samarkand, <s>which is</s> a UNESCO site, … → Samarkand, a UNESCO site, … (appozitsiya)</div>`},
{h:"Defining vs non-defining",b:`<div class="ex">Students <b>who work part-time</b> have less time to study. (faqat ishlaydiganlar — vergulsiz)<br>My brother, <b>who works part-time</b>, has little free time. (qo'shimcha ma'lumot — vergul bilan)</div><div class="warn">Vergulli nisbiy gapda «that» ishlatilmaydi: «My city, <s>that</s> is old,…» → <span class="en">My city, which is old,…</span></div>`}],
ex:[
['r',"Ixcham qiling.","Due to the fact that it was raining, the match was cancelled.",["Because it was raining, the match was cancelled.","As it was raining, the match was cancelled.","Because of the rain, the match was cancelled.","Due to the rain, the match was cancelled.","The match was cancelled because of the rain.","The match was cancelled because it was raining."],"<b>Due to the fact that</b> → because."],
['r',"Nisbiy gapni qisqartiring.","Students who are living abroad often feel lonely.",["Students living abroad often feel lonely."],"<b>who are</b> olib tashlanadi."],
['r',"Appozitsiya bilan qisqartiring.","Bukhara, which is one of the oldest cities in Asia, attracts many tourists.",["Bukhara, one of the oldest cities in Asia, attracts many tourists."],"<b>which is</b> o'chiriladi."],
['m',"Which is the most concise?",["In my personal opinion, I think that…","I believe that…","It is my own personal view that I think…"],1,"<b>I believe</b>"],
['x',"Tashkent, that is the capital, is growing fast.",["Tashkent, which is the capital, is growing fast."],"Vergulli nisbiy gapda <b>which</b>."],
['m',"«Students who work part-time have less time to study.» Commas needed?",["Yes, around «who work part-time»","No — it defines which students","Only after «students»"],1,"Defining — vergulsiz."],
['m',"The concise version of «We need more parks in order to reduce stress» is…",["We need more parks to reduce stress.","We need more parks for reduce stress.","We need more parks in reducing stress."],0,"<b>in order to</b> → <b>to</b>."],
['r',"Ixcham qiling.","At this moment in time, a large number of people use smartphones.",["Now, many people use smartphones.","Today, many people use smartphones.","Many people now use smartphones.","Many people use smartphones today.","Currently, many people use smartphones.","Nowadays, many people use smartphones."],"Ortiqcha iboralarni olib tashlang."]],
task:{type:'para',w:[70,100],time:12,prompt:`<p>Quyidagi 150 so'zlik «suvli» paragrafni <b>70–100 so'zga</b> qisqartiring. Barcha asosiy fikrlar saqlansin.</p><p><i>«In my personal opinion, I think that it is a fact that each and every student should do sport. This is due to the fact that sport is very, very good for health. Students who are studying at university very often sit for a large number of hours in front of computers, and at this moment in time this is a big problem. In order to solve this problem, universities, which are places where young people study, should build sports centres which are cheap. Sport also helps students who are feeling stressed before exams. For example, my friend, who is called Bekzod and who studies at a medical university, plays football two times every week, and he says that it helps him a lot with stress. So in conclusion, I think that sport is very important for each and every student and universities should do something about this problem.»</i></p>`,
model:"I believe every student should do sport because it is essential for health. University students often spend long hours in front of computers, which has become a serious problem. To solve it, universities should build affordable sports centres. Sport also helps students cope with exam stress. For example, my friend Bekzod, a medical student, plays football twice a week and says it greatly reduces his stress. Therefore, universities should make sport accessible to all their students.",ml:'C1',
ck:["70–100 so'z","Barcha asosiy fikrlar saqlangan","«due to the fact that, each and every» kabi iboralar yo'q","Nisbiy gaplar qisqartirilgan / appozitsiya","Takrorlanish yo'q"]}});

L({m:'m5',id:'m5l6',t:'Advanced punctuation',uz:"Ilg'or tinish belgilari",min:30,
goal:"Vergul, nuqtali vergul, ikki nuqta va tirelarni C1 darajasida, «comma splice» xatosiz ishlatish.",
th:[
{h:"Comma splice — eng ko'p xato",b:`<p>Ikki mustaqil gapni faqat vergul bilan ulash — xato:</p><div class="ex">✗ Many people use cars, this causes pollution.<br>✓ Many people use cars<b>;</b> this causes pollution.<br>✓ Many people use cars<b>, and</b> this causes pollution.<br>✓ Many people use cars<b>, which</b> causes pollution.<br>✓ Many people use cars<b>.</b> This causes pollution.</div>`},
{h:"However bilan",b:`<div class="ex">✗ The plan is good, however it is expensive.<br>✓ The plan is good<b>; however,</b> it is expensive.<br>✓ The plan is good<b>. However,</b> it is expensive.</div>`},
{h:"Nuqtali vergul va ikki nuqta",b:`<p><b>; (semicolon)</b> — ikki bog'liq mustaqil gap orasida, yoki uzun ro'yxat elementlari orasida.</p><p><b>: (colon)</b> — oldingi gapni tushuntirish yoki ro'yxat oldidan: <span class="en">The solution is simple: invest in education.</span> · <span class="en">Three factors matter: cost, quality and access.</span></p>`},
{h:"Vergul: kirish iboralari va nisbiy gaplar",b:`<ul><li>Kirish ibora/ergash gapdan keyin: <span class="en">In many countries, … · Although it is expensive, …</span></li><li>Non-defining nisbiy gap: <span class="en">My teacher, who is from London, …</span></li><li>Ega va kesim orasida vergul <b>yo'q</b>: <s>«The main problem, is the cost.»</s></li></ul>`}],
ex:[
['m',"Which sentence is correct?",["The bus was late, I missed the lesson.","The bus was late; I missed the lesson.","The bus was late I missed the lesson."],1,"Nuqtali vergul — ikki mustaqil gap."],
['x',"The idea is good, however it is too expensive.",["The idea is good; however, it is too expensive.","The idea is good. However, it is too expensive."],"<b>; however,</b>"],
['m',"Where does the colon go? «There is one solution ___ better public transport.»",["After «solution»","After «There»","No colon"],0,"Tushuntirish oldidan: <b>solution:</b>"],
['x',"The main problem, is the cost of housing.",["The main problem is the cost of housing."],"Ega va kesim orasida vergul yo'q."],
['m',"Which fixes the comma splice «Prices rose, people bought less»?",["Prices rose, so people bought less.","Prices, rose people bought less.","Prices rose people, bought less."],0,"Bog'lovchi qo'shildi."],
['x',"Although it was cold we went swimming.",["Although it was cold, we went swimming."],"Ergash gapdan keyin vergul."],
['m',"Which uses a semicolon correctly?",["I like tea; and coffee.","Some students prefer online classes; others need face-to-face contact.","Because; it was late."],1,"Ikki mustaqil, bog'liq gap."],
['x',"Many young people leave villages, this creates problems for farms.",["Many young people leave villages; this creates problems for farms.","Many young people leave villages, which creates problems for farms.","Many young people leave villages. This creates problems for farms.","Many young people leave villages, and this creates problems for farms."],"Comma splice tuzatildi."]],
task:{type:'para',w:[60,100],time:12,prompt:`<p>Quyidagi paragrafda <b>7 ta tinish belgisi xatosi</b> bor. Tuzatib, to'liq qayta yozing (60–100 so'z):</p><p><i>«In many countries young people are moving to cities, this trend has several causes. The main reason, is employment. Cities offer more jobs, however housing is expensive. There are three main problems; high rents, traffic and pollution. Although cities are attractive many people feel lonely there. My cousin who moved to Tashkent last year, says that he misses his village.»</i></p>`,
model:"In many countries, young people are moving to cities; this trend has several causes. The main reason is employment. Cities offer more jobs; however, housing is expensive. There are three main problems: high rents, traffic and pollution. Although cities are attractive, many people feel lonely there. My cousin, who moved to Tashkent last year, says that he misses his village.",ml:'C1',mnote:"Tuzatishlar: In many countries, · …cities; this trend · reason is (vergulsiz) · jobs; however, · problems: high rents · attractive, many · My cousin, who … last year, says",
ck:["Comma splice tuzatildi","; however, to'g'ri","Ro'yxat oldidan ikki nuqta","Kirish ergash gapidan keyin vergul","Non-defining nisbiy gap ikki vergul bilan"]}});
